const PAD = { on: false, prev: [] };
function dz(v) { return Math.abs(v) < 0.18 ? 0 : (v - Math.sign(v) * 0.18) / 0.82; }

  if (!gp) { PAD.on = false; return; }
  const b = i => gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.5);
  const edge = (i, name) => { const v = b(i); if (v && !PAD.prev[i]) { pressed[name] = true; lastInput = 'pad'; } PAD.prev[i] = v; };
  const lx = dz(gp.axes[0] || 0), ly = dz(gp.axes[1] || 0);
  if (lx || ly) { lastInput = 'pad'; ptr.seen = true; ptr.type = 'mouse'; const sp = 420 * (b(7) ? 1.8 : 1); ptr.x = clamp(ptr.x + lx * sp * dt, 0, W); ptr.y = clamp(ptr.y + ly * sp * dt, 0, H); ptr.moved += Math.hypot(lx, ly) * sp * dt; }
  const a = b(0);
  if (a && !PAD.prev[0]) { ptr.sx = ptr.x; ptr.sy = ptr.y; ptr.moved = 0; ptr.down = true; ptr.onUI = hitUI(ptr); pressed.click = true; pressed.down = true; ptr.justDown = true; lastInput = 'pad'; }
  if (!a && PAD.prev[0]) { ptr.down = false; pressed.up = true; ptr.justUp = true; }
  PAD.prev[0] = a;
  edge(1, 'rclick'); edge(2, 'hold'); edge(3, 'tune'); edge(9, 'esc'); edge(8, 'speed'); edge(4, 'toolPrev'); edge(5, 'toolNext');
  PAD.on = true;
}

// ---------- AUDIO ENGINE (100% synthesized, no samples) ----------
let AC = null, master = null, comp = null, musicBus = null, sfxBus = null, distBus = null, delay = null, noiseBuf = null;

const VOL = 0.5;

    const dl = AC.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 2600;
    delay.connect(dl); dl.connect(fb); fb.connect(delay); const dOut = AC.createGain(); dOut.gain.value = 0.5; dl.connect(dOut); dOut.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);

}
function out(bus) { return bus === 'd' ? distBus : bus === 'm' ? musicBus : bus === 'e' ? delay : sfxBus; }
function tone(f, d, type, v, slide, when, bus, attack) {

  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);

}
function noise(d, v, freq, slide, type, when, q, bus) {

  s.buffer = noiseBuf; f.type = type || 'lowpass'; f.frequency.setValueAtTime(freq || 1200, t); if (q) f.Q.value = q;

// buzzy electrical tone: carrier with fast FM wobble (mains hum / arc)

}

// ---------- AMBIENT: the Deep Hum (two detuned drones; beat = misalignment), wind, machinery ----------
const AMB = { on: false };
function ambStart() {
  if (!AC || AMB.on) return;
  try {
    const t = AC.currentTime;
    const drone = f => { const o = AC.createOscillator(), g = AC.createGain(), fl = AC.createBiquadFilter(); o.type = 'sawtooth'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 180; g.gain.value = 0; o.connect(fl); fl.connect(g); g.connect(sfxBus); o.start(t); return { o, g, fl }; };

    const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true; const fl = AC.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = 400; fl.Q.value = 0.7; const g = AC.createGain(); g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(sfxBus); s.start(t, Math.random());

  } catch (e) { AMB.on = false; }
}
// hum: 0..1 loudness, mis: 0..1 misalignment (beat frequency), mach: machinery level, wind: 0..1
function ambSet(hum, mis, mach, wind) {
  if (!AC || !AMB.on) return; const t = AC.currentTime, v = muted || HEADLESS ? 0 : 1;
  AMB.h1.g.gain.setTargetAtTime(v * hum * 0.05, t, 0.3); AMB.h2.g.gain.setTargetAtTime(v * hum * 0.05, t, 0.3);
  AMB.h2.o.frequency.setTargetAtTime(55 + 0.3 + mis * 7, t, 0.3);
  AMB.h1.fl.frequency.setTargetAtTime(140 + mis * 260, t, 0.4); AMB.h2.fl.frequency.setTargetAtTime(140 + mis * 260, t, 0.4);
  AMB.mach.g.gain.setTargetAtTime(v * mach * 0.12, t, 0.25);
  AMB.wind.g.gain.setTargetAtTime(v * (0.008 + wind * 0.04), t, 0.5); AMB.wind.fl.frequency.setTargetAtTime(300 + wind * 500 + Math.sin(t * 0.5) * 150, t, 0.5);

// ---------- MUSIC: Phrygian lyre over a frame drum; dread rises with the Gaze ----------
const MUS = { on: false, int: 0, step: 0, next: 0, bpm: 76 };
function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }

function musicTick() {
  if (!AC || muted || !MUS.on || !musicOn || HEADLESS) return;
  const t = AC.currentTime, sp = 60 / MUS.bpm / 4;
  if (MUS.next < t - 0.3) MUS.next = t + 0.05;
  while (MUS.next < t + 0.12) {
    const s = MUS.step % 32, w = MUS.next, I = MUS.int, bar = Math.floor(MUS.step / 32) % 4, root = [50, 50, 51, 48][bar];
    const PH = [0, 1, 3, 5, 7, 8, 10, 12]; // phrygian
    if (s === 0) { tone(midi(root - 24), sp * 30, 'sine', 0.07, 0, w, 'm', 0.8); tone(midi(root - 12 + 7), sp * 30, 'triangle', 0.01, 0, w, 'm', 1.2); }
    // frame drum: doum / tek
    if (s % 16 === 0 || s % 16 === 10) tone(70, 0.3, 'sine', 0.13 + I * 0.06, -30, w, 'm');
    if (s % 8 === 4 || (I > 0.4 && s % 4 === 2)) noise(0.06, 0.03 + I * 0.03, 2400, -1200, 'bandpass', w, 1.2, 'm');
    // lyre melody: sparse, a seeded walk through the mode
    const mel = [0, -1, 2, -1, 3, 1, -1, 0, 4, -1, 3, 2, -1, 1, 0, -1];
    const n = mel[(s >> 1) % 16 + 0 & 15]; if (s % 2 === 0 && n >= 0 && (I > 0.12 || s % 4 === 0)) pluck(midi(root + 12 + PH[(n + bar) % 8]), sp * 3, 0.03, w);
    if (I > 0.55 && s % 2 === 1) tone(midi(root + 1), sp * 0.8, 'sawtooth', 0.006 + I * 0.008, 0, w, 'm', 0.01);
    if (I > 0.75 && s % 8 === 0) tone(midi(root - 12 + 1), sp * 6, 'sawtooth', 0.02, 0, w, 'm', 0.2);
    MUS.step++; MUS.next += sp;
  }
}
