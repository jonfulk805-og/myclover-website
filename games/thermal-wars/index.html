// ---------- WORLD: wrapping terrain, thermals, ridge lift, wind, hazards ----------
const TSTEP = 4;
let WW = 4400;
const wx = x => ((x % WW) + WW) % WW;
const wdx = (a, b) => { let d = (a - b) % WW; if (d > WW / 2) d -= WW; else if (d < -WW / 2) d += WW; return d; };
function pn1(x, p) { // periodic 1D value noise, period p
  const xi = Math.floor(x), xf = x - xi, u = xf * xf * (3 - 2 * xf), m = q => ((q % p) + p) % p;
  return lerp(hash(m(xi), 7), hash(m(xi + 1), 7), u);
}
function pfbm(x, p, o) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < (o || 5); i++) { s += a * pn1(x * f, p * f); n += a; a *= 0.5; f *= 2; } return s / n; }
function genTerrain(A, sd) {
  WW = A.ww; const n = Math.round(WW / TSTEP), T = new Float32Array(n);
  const P = 12; // noise period in cells across the world
  for (let i = 0; i < n; i++) {
    const u = i / n, th = u * Math.PI * 2, q = u * P; let h = 0;
    if (A.id === 'alps' || A.id === 'aurora') {
      const pk = A.id === 'aurora' ? 1.25 : 1;
      h = 300 + 210 * Math.sin(th * 2 + 0.6) + 90 * Math.sin(th * 5 + 1.3) + 220 * (pfbm(q, P, 5) - 0.5) * 2;
      const r = 1 - Math.abs(pfbm(q * 2 + 3.3, P * 2, 3) * 2 - 1); h += r * r * 170 * pk;
      h = Math.max(70, h * pk);
    } else if (A.id === 'coast') {
      const sea = u < 0.26 ? 1 : u > 0.96 ? 1 : 0;
      if (sea) h = 18 + 6 * Math.sin(u * 90);
      else if (u < 0.31) h = lerp(18, 60, (u - 0.26) / 0.05); // beach
      else if (u < 0.37) { const k = (u - 0.31) / 0.06; h = 60 + 330 * (k * k * (3 - 2 * k)); } // big windward dune face
      else if (u < 0.6) h = 390 - (u - 0.37) * 900 + 40 * Math.sin(u * 60);
      else if (u < 0.66) { const k = (u - 0.6) / 0.06; h = 190 + 150 * (k * k * (3 - 2 * k)); } // second ridge
      else if (u < 0.96) h = lerp(340, 22, (u - 0.66) / 0.3) + 30 * Math.sin(u * 44);
      h += (pfbm(q * 3, P * 3, 3) - 0.5) * 24;
    } else if (A.id === 'canyon') {
      let b = pfbm(q * 0.8, Math.round(P * 0.8), 4); b = b * 5; const lvl = Math.floor(b), f = b - lvl, st = clamp((f - 0.78) / 0.22, 0, 1);
      h = 70 + (lvl + st * st * (3 - 2 * st)) * 120 + (pfbm(q * 6, P * 6, 2) - 0.5) * 14;
    } else if (A.id === 'volcano') {
      const d = Math.abs(u - 0.5) * 2; // 0 at centre
      h = 90 + 820 * Math.pow(Math.max(0, 1 - d * 1.7), 1.6) + 80 * (pfbm(q, P, 4) - 0.5) * 2;
      if (d < 0.05) h -= 120 * (1 - d / 0.05); // crater
      h += 120 * Math.max(0, Math.sin(th * 3 + 2)) * (d > 0.5 ? 1 : 0);
    } else { // storm hills
      h = 220 + 110 * Math.sin(th * 3 + 0.4) + 150 * (pfbm(q, P, 5) - 0.5) * 2 + 60 * Math.sin(th * 7);
      h = Math.max(60, h);
    }

  }

  for (let pass = 0; pass < 2; pass++) { const c = T.slice(); for (let i = 0; i < n; i++) T[i] = (c[(i - 1 + n) % n] + c[i] * 2 + c[(i + 1) % n]) / 4; }

}
function groundAt(x) {

const WORLD = { T: null, A: null, therms: [], picks: [], wind: 0, gust: 0, gustT: 0, bolts: [], boltT: 6, erupt: 12, maxT: 0, tid: 1 };
function initWorld(A, opt) {

    const s = g * 0.6 + Math.random() * 300 - WORLD.therms.reduce((a, t) => a + (Math.abs(wdx(t.x, x)) < 360 ? 400 : 0), 0); if (s > bs) { bs = s; best = x; } }

    txt(M.mode === 'koth' ? Math.floor(p.score) + ' pts' : p.kos + ' KO', W / 2 + 150, y, 11.5, '#fff', 'right', 900); txt(p.deaths + ' down', W / 2 + 200, y, 10, 'rgba(255,255,255,0.5)', 'right', 700); });

  const ei = M.ev ? EVENTS.indexOf(M.ev) : -1, hasNext = R.win && ei >= 0 && ei < EVENTS.length - 1;

// ---------- PAUSE ----------
function drawPause() {

// ---------- MAIN LOOP ----------
function update(dt) {
  game.t += dt; pollPad(dt);
  for (const tm of game.timers) { tm.t -= dt; if (tm.t <= 0 && !tm.fired) { tm.fired = true; tm.fn(); } } game.timers = game.timers.filter(q => !q.fired);
  for (const m of toasts) m.t -= dt; toasts = toasts.filter(m => m.t > 0);
  if (pressed.mute) setMute(!muted);
  if (pressed.vario) { varioOn = !varioOn; LS.set('tw_vario', varioOn ? '1' : '0'); toast(varioOn ? 'Vario beeps ON' : 'Vario beeps OFF', '#7fe0e8', 1); }
  musicTick();
  game.shake = Math.max(0, game.shake - dt * 3);
  game.flash = Math.max(0, game.flash - dt * 2.5);

    if ((pressed.pause || pressed.esc) && !M.over) { game.paused = true; return; }

  }
}
function render(dt) {

  else if (game.state === 'events') drawEvents(t);
  else if (game.state === 'quick') drawQuick(t);
  else if (game.state === 'hangar') drawHangar(t);
  else if (game.state === 'result') drawResult(t);

  cx.globalAlpha = 1;

  vignette();
  UIprev = UI;
}
function frame(dt) {
  if (pressed.click && processClicks()) { }
  update(dt);
  for (const k in pressed) pressed[k] = false;
}
cv.style.cursor = 'default';
let lastT = performance.now(), MANUAL = /[?&]manual/.test(location.search);
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  frame(dt); render(dt);
  cv.style.cursor = game.state === 'play' && !game.paused && AIM.mode === 'mouse' ? 'none' : 'default';
  if (!MANUAL) requestAnimationFrame(loop);
}
startDemo();
requestAnimationFrame(loop);
window.__TW = { game, SAVE, get M() { return M; }, WORLD, startMatch, startDemo, EVENTS, render: () => render(1 / 60), frame: dt => frame(dt || 1 / 60), ptr, pressed, kheld, AIM, setInput: v => { lastInput = v; }, saveNow,
  setHeadless(v) { HEADLESS = v; },
  // bot = the same AI brain flies the player (for balance sims)
  step(n, bot) { for (let i = 0; i < n; i++) { if (bot && M && M.me && game.state === 'play') { const me = M.me; if (!me.ai) me.ai = makeBrain(typeof bot === 'number' ? bot : 0.5); me.botOn = true; } frame(1 / 60); } } };

})();
