// ---------- MAIN LOOP ----------
function update(dt) {

  for (const tm of game.timers) { tm.t -= dt; if (tm.t <= 0 && !tm.fired) { tm.fired = true; tm.fn(); } } game.timers = game.timers.filter(q => !q.fired);

  if (pressed.mute) setMute(!muted);
  musicTick(); ambTick();
  game.shake = Math.max(0, game.shake - dt * 18);
  game.flash = Math.max(0, game.flash - dt * 2.5);
  if (game.state === 'play') {

    updatePlay(dt);

}

  vignette();

}

}
let lastT = performance.now();

requestAnimationFrame(loop);
window.__SG = { game, SIM, MAP, SAVE, startLevel, place, upgrade, sell, startWave, castSpell, repair, updateSim, TOWERS, ENEMIES, MAPS, makeWave, canBlock, recomputeFlow, render: () => render(1 / 60), frame: dt => frame(dt || 1 / 60), ptr, pressed, setInput: v => { lastInput = v; } };
