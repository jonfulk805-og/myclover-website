const W = 960, H = 540;

function fit() {

  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  SC = Math.max(1, Math.min(2, cw * (window.devicePixelRatio || 1) / W));

addEventListener('resize', fit); fit();

// ---------- utils ----------

      if (t === d.from) { B.cells[t].o = d.o; editTouched(B); sfx('place'); }
      else if (t >= 0 && !B.cells[t]) { B.cells[t] = B.cells[d.from]; B.cells[d.from] = null; B.cells[t].o = d.rot ? d.o : autoOrient(B, t, d.fam, d.o); editTouched(B); sfx('place'); puff(B, t); }
      else if (t >= 0 && movable(B.cells[t])) { const a = B.cells[t]; B.cells[t] = B.cells[d.from]; B.cells[d.from] = a; editTouched(B); sfx('place'); }
      else if (t < 0) toTray(B, d.from);
      else { B.dirty = true; sfx('deny'); }
    }
  }
}
// ---------- loop ----------
function update(dt) {
  game.t += dt;
  for (const tm of game.timers) { tm.t -= dt; if (tm.t <= 0 && !tm.fired) { tm.fired = true; tm.fn(); } } game.timers = game.timers.filter(q => !q.fired);
  for (const m of toasts) m.t -= dt; toasts = toasts.filter(m => m.t > 0);
  if (pressed.mute) setMute(!muted);
  game.shake = Math.max(0, game.shake - dt * 25);
  updParts(dt);
  const B = game.B;
  if (game.state === 'title') { demoTick(dt); if (pressed.go) { const nx = Math.min(save.unlock, CAMPAIGN.length) - 1; loadLevel(nx); } }
  else if (game.state === 'select') { if (pressed.esc) game.state = 'title'; }
  else if (game.state === 'result') { if (pressed.go || pressed.next) nextLevel(); else if (pressed.esc) game.state = 'select'; }
  else if (game.state === 'build' || game.state === 'run') {
    if (!B.done) buildInput(B);
    if (game.state === 'run' || (B.sim && B.sim.state === 'fly')) updateRun(B, dt);
  }
}
function render() {
  UI = [];
  cx.setTransform(SC, 0, 0, SC, 0, 0);
  cx.clearRect(0, 0, W, H);
  if (!BG) buildBG();
  if (game.state === 'title') drawTitle();
  else if (game.state === 'select') drawSelect();
  else if (game.state === 'result') drawResult();
  else drawPlay();
  UIprev = UI;
  const B = game.B;
  cv.style.cursor = (B && (game.state === 'build') && B.drag && B.drag.moved) ? 'grabbing' : 'default';
}
let lastT = performance.now();
function frame(dt) {
  if (processClicks()) pressed.down = false;
  update(dt);
  for (const k in pressed) pressed[k] = false;
}
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  frame(dt); render();
  requestAnimationFrame(loop);
}
addEventListener('resize', () => { BG = null; BOARD = null; for (const k in SPR) delete SPR[k]; if (game.B) game.B.dirty = true; if (DEMO) DEMO.dirty = true; });
requestAnimationFrame(loop);
// test hooks
window.__MC = { game, loadLevel, loadEndless, startRun, step: (n, dt) => { for (let i = 0; i < n; i++) frame(dt || 1 / 60); }, render, CAMPAIGN, ptr, pressed, solutionCells, parseLevel, evaluate, genLevel, save,
  solve: () => { const B = game.B; B.cells = solutionCells(B.lv); B.inv = {}; for (const f in B.lv.inv) B.inv[f] = 0; B.dirty = true; } };

})();
