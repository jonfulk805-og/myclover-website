  } else {
    const woke = r.why === 'woke';
    txtS(woke ? 'THE PATIENT WOKE UP' : 'WE LOST THEM', W / 2, y + 50, 30, '#ff4050', 'center', 900);
    txt(woke ? 'Mid-surgery. Screaming. The sedation clock hit zero.' : 'Cardiac arrest with no return of rhythm.', W / 2, y + 92, 14, 'rgba(255,255,255,0.8)', 'center', 700);
    txt(woke ? 'Push anesthesia (1) before the clock runs out - but space the doses.' : 'Watch the DEPTH gauge, clamp bleeders fast, hang blood, and DEFIB (D) quickly.', W / 2, y + 120, 12.5, 'rgba(255,210,63,0.85)', 'center', 700);
    const S = game.S;
    txt('Objects removed ' + S.specimens + '/' + S.items.length + '   \u00b7   mistakes ' + game.stats.mistakes + '   \u00b7   arrests ' + game.stats.arrests, W / 2, y + 170, 13, 'rgba(255,255,255,0.65)', 'center', 700);
    // flatline
    cx.save(); cx.strokeStyle = woke ? '#ffd23f' : '#3cff7a'; cx.shadowColor = cx.strokeStyle; cx.shadowBlur = 10; cx.lineWidth = 2; cx.beginPath();
    for (let i = 0; i <= 300; i++) { const px = x + 40 + i * (w - 80) / 300; const yy = y + 230 + (woke ? Math.sin(i * 0.4 + game.t * 10) * 10 * Math.sin(i * 0.05) : (Math.random() - 0.5)); i ? cx.lineTo(px, yy) : cx.moveTo(px, yy); }
    cx.stroke(); cx.restore();
    button('retry', x + w - 170, y + h - 58, 140, 40, 'TRY AGAIN', { col: '#ff6a40', fn: () => startCase(game.ci, true) });
    button('menu', x + 30, y + h - 58, 110, 40, 'Cases', { col: '#7fe0e8', fn: () => { game.state = 'title'; } });
  }
}
function drawPause() {
  cx.fillStyle = 'rgba(0,4,6,0.7)'; cx.fillRect(0, 0, W, H);
  glass(W / 2 - 160, 140, 320, 260, '#7fe0e8', 0.92, 16);
  txtS('PAUSED', W / 2, 180, 26, '#fff', 'center', 900);
  txt('The clock is frozen. Lucky you.', W / 2, 208, 12, 'rgba(255,255,255,0.6)', 'center', 700);
  button('resume', W / 2 - 110, 232, 220, 40, 'Resume', { col: '#3cff7a', fn: () => { game.paused = false; } });
  button('restart', W / 2 - 110, 280, 105, 36, 'Restart', { col: '#ffd23f', size: 13, fn: () => startCase(game.ci, true) });
  button('quit', W / 2 + 5, 280, 105, 36, 'Quit', { col: '#ff6a40', size: 13, fn: () => { game.state = 'title'; game.paused = false; } });
  button('snd', W / 2 - 110, 326, 220, 34, muted ? 'Sound: off' : 'Sound: on', { col: '#7fe0e8', size: 13, fn: () => setMute(!muted) });
}

function update(dt) {
  game.t += dt;
  for (const tm of game.timers) { tm.t -= dt; if (tm.t <= 0 && !tm.fired) { tm.fired = true; tm.fn(); } } game.timers = game.timers.filter(q => !q.fired);
  for (const m of toasts) m.t -= dt; toasts = toasts.filter(m => m.t > 0);
  if (pressed.mute) setMute(!muted);
  if (game.state === 'title') { if (pressed.start) startCase(Math.min(save.unlock, CASES.length) - 1); }
  else if (game.state === 'brief') { if (pressed.start) { game.state = 'play'; } if (pressed.pause) game.state = 'title'; }
  else if (game.state === 'result') { if (pressed.start || pressed.retry) { if (game.result.ok && pressed.start && game.ci + 1 < CASES.length) startCase(game.ci + 1); else startCase(game.ci, true); } if (pressed.pause) game.state = 'title'; }
  else if (game.state === 'play') {
    if (pressed.pause) game.paused = !game.paused;
    if (game.paused) return;
    if (!game.result) {
      if (pressed.anes) pushAnes(); if (pressed.epi) pushEpi(); if (pressed.blood) hangBlood(); if (pressed.defib) defib();
      if (pressed.down && ptr.x < PANEL_X - 8 && ptr.y > 54) surgeryInput(); else { pressed.down = false; surgeryInput(); }
      updateSurgery(dt);
      updateVitals(dt);
    } else if (game.V.rhythm !== 'flat') { game.V.phase += dt * game.V.hr / 60; if (game.V.phase >= 1) game.V.phase -= 1; game.V.acc += dt * 60; while (game.V.acc >= 1) { game.V.acc -= 1; const i = game.V.head = (game.V.head + 1) % TRACE_N; game.V.ecg[i] = ecgAt(game.V); game.V.pleth[i] = plethAt(game.V); } }
    else { game.V.acc += dt * 60; while (game.V.acc >= 1) { game.V.acc -= 1; const i = game.V.head = (game.V.head + 1) % TRACE_N; game.V.ecg[i] = ecgAt(game.V); game.V.pleth[i] = 0; } }
    game.shake = Math.max(0, game.shake - dt * 30); game.flashRed = Math.max(0, game.flashRed - dt * 3); game.shockFlash = Math.max(0, game.shockFlash - dt * 4);
    const st = game.V.stir * 3;
    game.fox = (Math.random() - 0.5) * game.shake + Math.sin(game.t * 17) * st; game.foy = (Math.random() - 0.5) * game.shake + Math.cos(game.t * 13) * st;
    ambience(dt);
  }
}
function render() {
  UI = [];
  cx.setTransform(SC, 0, 0, SC, 0, 0);
  cx.clearRect(0, 0, W, H);
  if (game.state === 'title') drawTitle();
  else if (game.state === 'brief') drawBrief();
  else if (game.state === 'play') { drawPlay(); if (game.paused) drawPause(); }
  else if (game.state === 'result') drawResult();
  UIprev = UI;
  cv.style.cursor = game.state === 'play' && !game.paused && ptr.x < PANEL_X - 8 && ptr.y > 54 ? 'none' : 'default';
}
let lastT = performance.now();
function frame(dt) {
  if (game.state !== 'play' || game.paused) { processClicks(); }
  else if (processClicks()) { /* consumed by a panel button */ }
  update(dt);
  for (const k in pressed) pressed[k] = false;
}
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  frame(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// test hooks
window.__SI = { game, startCase, step: (n, dt) => { for (let i = 0; i < n; i++) frame(dt || 1 / 60); }, render, CASES, ptr, pressed, organHit };

})();
</script>
