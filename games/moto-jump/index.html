let AC = null, master = null, comp = null, musicBus = null, sfxBus = null, distBus = null, delay = null, noiseBuf = null;

const MUS = { on: false, int: 0, step: 0, next: 0, bpm: 112 };

function musicTick() {
  if (!AC || muted || !MUS.on || !musicOn) return;
  const t = AC.currentTime, sp = 60 / MUS.bpm / 4;
  if (MUS.next < t - 0.3) MUS.next = t + 0.05;
  while (MUS.next < t + 0.12) {
    const s = MUS.step % 64, w = MUS.next, I = MUS.int, bar = Math.floor(MUS.step / 16) % 8, root = [45, 45, 43, 43, 41, 41, 43, 40][bar];
    if (s % 4 === 0) tone(midi(root - 12 + (s % 8 === 4 ? 7 : 0)), sp * 3.2, 'triangle', 0.07, 0, w, 'm', 0.01); // walking bass
    if (s % 8 === 0) tone(55, 0.22, 'sine', 0.12 + I * 0.08, -26, w, 'm'); // kick
    if (s % 8 === 4) noise(0.12, 0.05 + I * 0.04, 2200, -1000, 'bandpass', w, 0.8, 'm'); // snare
    if (s % 2 === 1) noise(0.03, 0.012 + I * 0.012, 8000, 0, 'highpass', w, 0, 'm');
    if (s % 16 === 0) [0, 4, 7].forEach(k => tone(midi(root + k), sp * 7, 'sawtooth', 0.012, 0, w, 'm', 0.04));

    MUS.step++; MUS.next += sp;
  }
}

  txt('x' + Rs.mult.toFixed(2) + ' bike style  =  ' + fmtN(Rs.styleTot) + (Rs.ok ? '   (goal ' + fmtN(R.ev.goal) + ')' : ''), lx, ly + 4, 13, '#e8d4ff', 'left', 900);

function drawPause() {

// ---------- MAIN LOOP ----------
function update(dt) {
  game.t += dt; pollPad(dt);
  for (const tm of game.timers) { tm.t -= dt; if (tm.t <= 0 && !tm.fired) { tm.fired = true; tm.fn(); } } game.timers = game.timers.filter(q => !q.fired);
  for (const m of toasts) m.t -= dt; toasts = toasts.filter(m => m.t > 0);
  if (pressed.mute) setMute(!muted);

    if ((pressed.pause || pressed.esc) && !RUN.over && !RUN.landed) { game.paused = true; return; }
    if (pressed.restart) { startRun(RUN.evIdx); return; }

    if (pressed.esc && (game.state === 'garage' || game.state === 'events')) game.state = 'title';

    else if (game.state === 'events') { const un = unlockedEvents(); if (pressed.start) startRun(Math.min(SAVE.ev, un - 1)); else if (pressed.garage) openGarage(); }
    else if (game.state === 'result' && RUN && RUN.result) { const R = RUN, nxt = R.evIdx + 1 < unlockedEvents() && R.result.ok;
      if (pressed.restart) startRun(R.evIdx); else if (pressed.start) startRun(nxt ? R.evIdx + 1 : R.evIdx); else if (pressed.garage) openGarage(); }
  }
}
function render(dt) {

  else if (game.state === 'title') drawTitle(t);
  else if (game.state === 'garage') drawGarage(t);
  else if (game.state === 'events') drawEvents(t);
  else if (game.state === 'result') drawResult(t);
  toasts.forEach((tt, i) => { const ty = game.state === 'play' ? H - 130 - i * 34 : 70 + i * 34; cx.globalAlpha = clamp(tt.t / 0.3, 0, 1); glass(W / 2 - 220, ty, 440, 28, tt.col, 0.85); txt(tt.s, W / 2, ty + 14, 12, tt.col, 'center', 900); });
  cx.globalAlpha = 1;
  if (game.flash > 0) { cx.save(); cx.globalAlpha = game.flash * 0.4; cx.fillStyle = game.flashCol; cx.fillRect(0, 0, W, H); cx.restore(); }
  if (lastInput === 'pad' && ptr.seen && game.state !== 'play') { cx.strokeStyle = '#ffd23f'; cx.lineWidth = 2; cx.beginPath(); cx.arc(ptr.x, ptr.y, 7, 0, 6.29); cx.moveTo(ptr.x - 11, ptr.y); cx.lineTo(ptr.x + 11, ptr.y); cx.moveTo(ptr.x, ptr.y - 11); cx.lineTo(ptr.x, ptr.y + 11); cx.stroke(); }
  vignette();

}
function frame(dt) {
  if (pressed.click && processClicks()) { }
  update(dt);
  for (const k in pressed) pressed[k] = false;
  ptr.justDown = false;
}
let lastT = performance.now(), MANUAL = /[?&]manual/.test(location.search);
function loop(now) {
