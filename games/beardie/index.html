function playerInput() {

  if (touchMove.x || touchMove.y) { mx = touchMove.x; my = touchMove.y; }
  const inp = { mx, my, tongue: !!(pressed.tongue || pressed.mtongue), dash: !!keys.dash || (mouse.rdown && !TOUCH), puff: !!pressed.puff, aim: null, face: null };
  if (!TOUCH && mouse.active && (pressed.mtongue || game.t - mouse.lastMove < 2.5)) {

    const d = Math.hypot(p.x - e.x, p.y - e.y), hot = e.st !== 'patrol' && e.st !== 'groom' && e.st !== 'sniff';
    const R0 = hot ? 210 : 120;
    if (d < R0) { const w = (R0 - d) / R0 * (hot ? 2 : 1); fx += (p.x - e.x) / d * w; fy += (p.y - e.y) / d * w; danger = Math.max(danger, hot ? 1 : 0.5);

  }

  let best = null, bs = 1e9;
  for (const b of L.bugs) { if (b.caught) continue; let d = Math.hypot(b.x - p.x, b.y - p.y);
    for (const e of L.preds) if (!e.air && Math.hypot(b.x - e.x, b.y - e.y) < 120) d += 200;
    if (d < bs) { bs = d; best = b; } }
  let tx = 0, ty = 0;
  if (best) { const d = Math.hypot(best.x - p.x, best.y - p.y) || 1; tx = (best.x - p.x) / d; ty = (best.y - p.y) / d;
    if (d < 115 && !p.tongue.st) { const da = Math.abs(wrapA(Math.atan2(best.y - p.y, best.x - p.x) - p.a)); if (da < 1.1 || d < 50) inp.tongue = true; }
    if (best.kind === 'golden' && d < 260) inp.dash = true; }
  if (nearBush) { const d = Math.hypot(nearBush.x - p.x, nearBush.y - p.y) || 1; inp.mx = (nearBush.x - p.x) / d; inp.my = (nearBush.y - p.y) / d; if (d < nearBush.r * 0.4) { inp.mx = inp.my = 0; } inp.dash = d > 60; }
  else { inp.mx = tx * (danger ? 0.4 : 1) + fx * 1.6; inp.my = ty * (danger ? 0.4 : 1) + fy * 1.6; if (danger >= 1 && Math.hypot(fx, fy) > 0.6) inp.dash = true; }

}
function closestBush() { let b = null, bd = 1e9; for (const q of L.bushes) { const d = Math.hypot(q.x - P.x, q.y - P.y); if (d < bd) { bd = d; b = q; } } return bd < 320 ? b : null; }

// ---------- simulation ----------
function stepWorld(dt, inp) {
  if (L.intro > 0) { L.intro -= dt; if (pressed.start || pressed.tongue || pressed.mtongue || pressed.click) L.intro = Math.min(L.intro, 0.25); inp = { mx: 0, my: 0 }; }
  let sdt = dt;
  if (L.won || L.dead) { L.endT -= dt; sdt = dt * (L.dead ? 0.35 : 0.6);
    if (L.endT <= 0 && !L.demo && game.state === 'play') { game.state = L.won ? 'clear' : 'over'; game.st = 0; showTouch(false); } }

  L.comboT = Math.max(0, L.comboT - sdt); if (L.comboT <= 0 && !L.won) L.combo = 0;
  if (!L.dead) updateLizard(sdt, inp && L.intro <= 0 ? inp : { mx: 0, my: 0 });

  // camera
  const tx = clamp(P.x + P.vx * 0.3 - W / 2, 0, L.w - W), ty = clamp(P.y + P.vy * 0.3 - H / 2, 0, L.h - H), k = 1 - Math.exp(-5 * dt);

let DARK = null;
function drawWorld(dt) {
  const camx = L.cam.x, camy = L.cam.y;
  const sh = RMOTION ? 0 : L.shake, sx = R(-sh, sh) * 0.5, sy = R(-sh, sh) * 0.5;
  cx.fillStyle = L.B.edge; cx.fillRect(0, 0, W, H);
  cx.save(); cx.translate(-camx + sx, -camy + sy);
  const bs = L.bs, scx = clamp(camx, 0, L.w - W), scy = clamp(camy, 0, L.h - H);
  cx.drawImage(L.bg, scx * bs, scy * bs, W * bs, H * bs, scx, scy, W, H);
  const vis = (x, y, m) => x > camx - m && x < camx + W + m && y > camy - m && y < camy + H + m;
  drawParts(cx, 'ground');
  for (const b of L.bugs) if (b.z < 6 && vis(b.x, b.y, 30)) drawBug(cx, b);
  for (const e of L.preds) if (e.kind === 'snake' && vis(e.x, e.y, 160)) drawPred(cx, e);
  drawTongue(cx, P); for (const b of L.bugs) if (b.caught && b.z < 6) drawBug(cx, b);
  drawLizard(cx, P, 1);
  for (const e of L.preds) if (!e.air && e.kind !== 'snake' && vis(e.x, e.y, 80)) drawPred(cx, e);
  // bushes (canopy over everything on the ground)
  // bushes are baked into the ground; redraw the canopy only where something is underneath it
  for (const b of L.bushes) { if (!vis(b.x, b.y, b.r + 20)) continue;
    const near = (x, y, m) => Math.hypot(x - b.x, y - b.y) < b.r + m;
    const inside = near(P.x, P.y, 30) || P.spine.some((q, i) => i % 4 === 0 && near(q.x, q.y, 6));
    if (!inside && !L.preds.some(e => !e.air && near(e.x, e.y, 40)) && !L.bugs.some(q => q.z < 6 && near(q.x, q.y, 12))) continue;
    const o = b.r + b.pad; cx.globalAlpha = inside ? 0.5 : 1; cx.drawImage(b.spr, b.x - o, b.y - o, o * 2, o * 2); cx.globalAlpha = 1; }
  for (const b of L.bugs) if (b.z >= 6 && vis(b.x, b.y, 30)) drawBug(cx, b);
  for (const e of L.preds) if (e.air) drawBird(cx, e);
  drawParts(cx, 'air');
  cx.restore();
  // time-of-day grading + lights
  if (L.dusk) {
    cx.save(); cx.globalCompositeOperation = 'multiply'; cx.fillStyle = lin(cx, 0, 0, 0, H, [[0, '#b07ab8'], [1, '#e8a070']]); cx.fillRect(0, 0, W, H);
    cx.globalCompositeOperation = 'soft-light'; cx.fillStyle = 'rgba(255,140,60,0.4)'; cx.fillRect(0, 0, W, H); cx.restore();
  } else if (L.night) {
    if (!DARK) DARK = layer(W, H, 0.5);
    const [dc, dg] = DARK; dg.setTransform(0.5, 0, 0, 0.5, 0, 0); dg.globalCompositeOperation = 'source-over'; dg.clearRect(0, 0, W, H);
    dg.fillStyle = 'rgba(4,8,26,0.84)'; dg.fillRect(0, 0, W, H); dg.globalCompositeOperation = 'destination-out';
    const hole = (x, y, r, a) => { const gr = dg.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(0,0,0,' + a + ')'); gr.addColorStop(0.6, 'rgba(0,0,0,' + a * 0.6 + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)'); dg.fillStyle = gr; dg.fillRect(x - r, y - r, r * 2, r * 2); };

    for (const b of L.bugs) if (b.kind === 'golden') hole(b.x - camx, b.y - camy, 60, 0.8);
    for (const e of L.preds) if (e.air && (e.st === 'track' || e.st === 'dive')) hole(e.sx - camx, e.sy - camy, PRED[e.kind].R * 1.4, 0.5);
    cx.drawImage(dc, 0, 0, W, H);
    // glowing eyes in the dark
    for (const e of L.preds) { if (e.air || e.kind === 'snake') continue; const d = Math.hypot(e.x - P.x, e.y - P.y); if (d < 140) continue;
      const hx = e.x + Math.cos(e.a) * 17 - camx, hy = e.y + Math.sin(e.a) * 17 - camy, px = -Math.sin(e.a) * 3, py = Math.cos(e.a) * 3;
      for (const sd of [-1, 1]) { glowAt(hx + px * sd, hy + py * sd, 9, '#d8ff40', 0.9); cx.fillStyle = '#f4ffb0'; cx.beginPath(); cx.arc(hx + px * sd, hy + py * sd, 1.6, 0, 7); cx.fill(); } }

function drawPlay(dt) {
  if (pressed.pause && !L.won && !L.dead) game.paused = !game.paused;

  if (game.state === 'play' || game.state === 'clear' || game.state === 'over') {
    edgeRadar(); drawHUD(dt); if (game.state === 'play') drawTutorial();
    if (L.intro > 0) drawIntroCard();
    if (L.won && game.state === 'play') txtS(L.def.boss ? 'RIDGE CLEARED!' : 'ALL BUGS EATEN!', W / 2, H / 2 - 40, 34, '#7dff5a', 'center', 900);
  }
  if (game.paused && game.state === 'play') drawPause();
}

// ---------- UI navigation (keyboard / gamepad) ----------
const NAV_DEF = { clear: 'next', over: 'retry', victory: 'again', play: 'resume', title: 'play' };
function navActivate() {
  if (!navFocus || !pressed.start) return;
  const b = UIprev.find(x => x.id === navFocus); if (!b) return;
  pressed.start = false;
  if (b.dis) sfx('deny'); else if (b.fn) { sfx('select'); b.fn(); }
}
function navMove() {
  const menu = game.state !== 'play' || game.paused;
  if (game.state === 'title') { // title uses left/right for level select; up/down to focus buttons
    if (!pressed.nup && !pressed.ndown && !navFocus) return;
  }
  const c = UI.filter(b => b.fn && !b.dis && b.w > 0 && !(game.state === 'title' && b.id.startsWith('lv')));
  if (!menu || !c.length) { navFocus = null; return; }
  let cur = c.find(b => b.id === navFocus);
  if (navFocus && !cur) navFocus = null;
  const d = ['nup', 'ndown', 'nleft', 'nright'].find(k => pressed[k]);
  if (d) {
    if (!cur) cur = c.find(b => b.id === NAV_DEF[game.state]) || c[0];
    else { const ox = cur.x + cur.w / 2, oy = cur.y + cur.h / 2, vx = d === 'nleft' ? -1 : d === 'nright' ? 1 : 0, vy = d === 'nup' ? -1 : d === 'ndown' ? 1 : 0;
      let best = null, bs = 1e9;
      for (const b of c) { if (b === cur) continue; const dx = b.x + b.w / 2 - ox, dy = b.y + b.h / 2 - oy, along = dx * vx + dy * vy, perp = Math.abs(dx * vy - dy * vx); if (along <= 4) continue; const sc = along + perp * 2.2; if (sc < bs) { bs = sc; best = b; } }
      if (best) cur = best; }
    navFocus = cur.id; sfx('roll');
  }
  if (cur && navFocus) { cx.save(); cx.strokeStyle = '#ffffff'; cx.lineWidth = 2.5; cx.shadowColor = '#ffd23f'; cx.shadowBlur = 12; cx.setLineDash([6, 4]); cx.lineDashOffset = -game.t * 30; rrect(cx, cur.x - 4, cur.y - 4, cur.w + 8, cur.h + 8, 12); cx.stroke(); cx.restore(); }
}
function checkRotate() {
  const el = document.getElementById('rot'); if (!el) return;
  const on = TOUCH && innerHeight > innerWidth; el.style.display = on ? 'flex' : 'none';
  if (on && game.state === 'play') game.paused = true;
}
addEventListener('resize', checkRotate); addEventListener('orientationchange', checkRotate); checkRotate();

// ---------- main loop ----------
let lastT = performance.now();
function frame(dt) {
  game.t += dt;
  pollPad(); processClicks(); navActivate();
  UIprev = UI; UI = [];
  if (pressed.mute) setMute(!muted);
  cx.setTransform(SC, 0, 0, SC, 0, 0);
  cx.fillStyle = '#0a0603'; cx.fillRect(0, 0, W, H);
  switch (game.state) {
    case 'title': drawTitle(dt); break;
    case 'play': drawPlay(dt); break;
    case 'clear': drawPlay(dt); drawClear(dt); break;
    case 'over': drawPlay(dt); drawOver(dt); break;
    case 'victory': drawVictory(dt); break;
  }
  soundButton(); navMove();
  UIprev = UI.slice();
  for (const k in pressed) pressed[k] = false;
  music();
}
function loop(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now;
  try { frame(dt); } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
playSong('title');
requestAnimationFrame(loop);

// ---------- touch controls ----------
function showTouch(on) { const el = document.getElementById('touch'); if (el) el.style.display = on && TOUCH ? 'block' : 'none'; }
(function () {
  if (!TOUCH) return;
  const st = document.getElementById('lstick'), kn = st.querySelector('.knob'); let pid = null, ox = 0, oy = 0;
  const set = (dx, dy) => { const d = Math.hypot(dx, dy), m = 50, k = d > m ? m / d : 1; kn.style.transform = 'translate(' + dx * k + 'px,' + dy * k + 'px)'; touchMove.x = d > 8 ? dx / Math.max(d, m) : 0; touchMove.y = d > 8 ? dy / Math.max(d, m) : 0; };
  st.addEventListener('pointerdown', e => { ensureAudio(); pid = e.pointerId; const r = st.getBoundingClientRect(); ox = r.left + r.width / 2; oy = r.top + r.height / 2; st.setPointerCapture(pid); set(e.clientX - ox, e.clientY - oy); e.preventDefault(); });
  st.addEventListener('pointermove', e => { if (e.pointerId === pid) set(e.clientX - ox, e.clientY - oy); });
  const end = e => { if (e.pointerId === pid) { pid = null; set(0, 0); } }; st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  document.querySelectorAll('[data-k]').forEach(b => { const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { ensureAudio(); pressed[k] = true; keys[k] = true; b.classList.add('on'); e.preventDefault(); e.stopPropagation(); });
    const up = () => { keys[k] = false; b.classList.remove('on'); }; b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up); });
})();

// ---------- test hooks ----------
function simLevel(i, maxT) {
  startLevel(i, true); game.bot = true; L.intro = 0; let n = 0;
  while (game.state === 'play' && n < 60 * (maxT || 240)) { stepWorld(1 / 60, botInput()); n++; }
  game.bot = false;
  return { lvl: i, state: game.state, won: !!L.won, dead: !!L.dead, t: Math.round(L.t), eaten: L.eaten, total: L.total, hits: L.hits, hp: P.hp, killer: game.killer, score: L.score };
}
window.__BD = { game, L: () => L, P: () => P, startLevel, simLevel, toTitle, setBot: v => game.bot = v, naive: v => game.naive = v, god: v => game.god = v, step: (n, dt) => { for (let i = 0; i < n; i++) frame(dt || 1 / 60); } };

})();
