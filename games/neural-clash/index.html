<script>
(function(){
'use strict';
// ===== NEURAL CLASH - AI vs AI combat ladder =====
// Original code + procedurally drawn art by Viktor for MyClover.Tech. No external assets.
const W = 960, H = 540;
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 1 || /Mobi|Android|iPhone|iPad|Tablet/i.test(navigator.userAgent);
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
let RMOTION = LS.get('nc_rm', null) != null ? LS.get('nc_rm') === '1' : !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let SC = 1, CSS_S = 1, CRect = null;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px'; CSS_S = s;
  SC = Math.max(1, Math.min(2, cw * (window.devicePixelRatio || 1) / W));
  cv.width = Math.round(W * SC); cv.height = Math.round(H * SC);
  CRect = null;
}
addEventListener('resize', fit); fit();

// ---------- utils ----------
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const wrapA = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const MONO = 'ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace';

// ---------- input ----------
const keys = {}, pressed = {};
let navFocus = null; // keyboard/gamepad focused button id
const KM = {
  KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
  Space: 'strike', ShiftLeft: 'dash', ShiftRight: 'dash', KeyQ: 'a1', KeyE: 'a2', KeyR: 'a3', Digit1: 'a1', Digit2: 'a2', Digit3: 'a3',
  KeyT: 'auto', KeyP: 'pause', Escape: 'pause', Enter: 'start', KeyM: 'mute', KeyF: 'strike', KeyJ: 'fire'
};
const mouse = { x: W / 2, y: H / 2, down: false, rdown: false, moved: false };
addEventListener('keydown', e => {
  ensureAudio();
  const a = KM[e.code];
  if (a) { if (!keys[a]) pressed[a] = true; keys[a] = true; e.preventDefault(); }
  const nv = { ArrowUp: 'nup', ArrowDown: 'ndown', ArrowLeft: 'nleft', ArrowRight: 'nright' }[e.code];
  if (nv && !e.repeat) pressed[nv] = true;
});
addEventListener('keyup', e => { const a = KM[e.code]; if (a) keys[a] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = mouse.rdown = false; if (game.state === 'fight') game.paused = true; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (game.state === 'fight') game.paused = true; for (const k in keys) keys[k] = false; if (AC && AC.state === 'running') AC.suspend(); }
  else if (AC && AC.state === 'suspended') AC.resume();
});
function onUI(x, y) { for (const b of UIprev) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) return true; return false; }
function toLogical(e) {
  if (!CRect) CRect = cv.getBoundingClientRect();
  return { x: (e.clientX - CRect.left) / CRect.width * W, y: (e.clientY - CRect.top) / CRect.height * H };
}
addEventListener('scroll', () => CRect = null);
cv.addEventListener('mousemove', e => { const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; mouse.moved = true; });
cv.addEventListener('mousedown', e => {
  ensureAudio(); const p = toLogical(e); mouse.x = p.x; mouse.y = p.y;
  if (e.button === 2) { mouse.rdown = true; pressed.dash = true; } else { if (!onUI(p.x, p.y)) mouse.down = true; pressed.click = true; }
  navFocus = null;
  e.preventDefault();
});
addEventListener('mouseup', e => { if (e.button === 2) mouse.rdown = false; else mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('touchstart', e => { ensureAudio(); const t = e.changedTouches[0]; const p = toLogical(t); mouse.x = p.x; mouse.y = p.y; pressed.click = true; e.preventDefault(); }, { passive: false });

// gamepad: left stick move, right stick aim, RT fire, A strike, B/LT dash, X/Y/RB abilities
let padPrev = {}; const pad = { on: false, ax: 0, ay: 0, fire: false };
function pollPad() {
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = gps && gps[0];
  if (!gp) { pad.on = false; return; }
  const b = i => gp.buttons[i] && gp.buttons[i].pressed;
  const lx = gp.axes[0] || 0, ly = gp.axes[1] || 0, rx = gp.axes[2] || 0, ry = gp.axes[3] || 0;
  const st = {
    left: b(14) || lx < -0.35, right: b(15) || lx > 0.35, up: b(12) || ly < -0.35, down: b(13) || ly > 0.35,
    strike: b(0), dash: b(1) || b(6), a1: b(2), a2: b(3), a3: b(5), pause: b(9), auto: b(8), start: b(9) || b(0),
    nup: b(12), ndown: b(13), nleft: b(14), nright: b(15)
  };
  for (const k in st) { if (st[k] && !padPrev[k]) pressed[k] = true; if (st[k] !== padPrev[k]) keys[k] = st[k] || false; }
  padPrev = st;
  pad.on = true; pad.lx = lx; pad.ly = ly;
  if (Math.hypot(rx, ry) > 0.3) { pad.ax = rx; pad.ay = ry; pad.aim = true; } else pad.aim = false;
  pad.fire = (gp.buttons[7] && gp.buttons[7].value > 0.3) || pad.aim;
}

// ---------- audio ----------
let AC = null, master = null, musicGain = null, noiseBuf = null, muted = LS.get('nc_mute', '0') === '1';
function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.3; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.3; musicGain.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (err) { AC = null; }
}
function tone(f, d, type, v, slide, dest, when) {
  if (!AC || muted) return;
  const t = when || AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
  g.gain.setValueAtTime(v || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
  o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v, freq, slide, type) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type || 'lowpass'; f.frequency.setValueAtTime(freq || 1200, t);
  if (slide) f.frequency.exponentialRampToValueAtTime(Math.max(40, (freq || 1200) + slide), t + d);
  g.gain.setValueAtTime(v || 0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d);
}
const sfxLast = {};
const SFX = {
  blaster: () => tone(880, 0.07, 'square', 0.035, -520),
  eblaster: () => tone(620, 0.07, 'sawtooth', 0.03, -380),
  bit: () => { tone(1500, 0.05, 'square', 0.03, 600); },
  strike: () => { noise(0.12, 0.18, 2400, -1800); tone(180, 0.1, 'square', 0.06, -90); },
  whoosh: () => noise(0.18, 0.12, 900, 2400, 'bandpass'),
  hit: () => { tone(260, 0.06, 'square', 0.05, -140); noise(0.06, 0.08, 3000); },
  crit: () => { tone(1320, 0.08, 'square', 0.05, -200); noise(0.1, 0.12, 5000); },
  shield: () => tone(520, 0.08, 'sine', 0.06, 300),
  lance: () => { tone(1900, 0.35, 'sawtooth', 0.06, -1700); noise(0.25, 0.1, 5000, -3800); },
  charge: () => tone(200, 0.3, 'sawtooth', 0.04, 900),
  wave: () => { noise(0.5, 0.3, 700, -560); tone(70, 0.4, 'sine', 0.2, -30); },
  missile: () => noise(0.22, 0.08, 2200, -1500),
  boom: () => { noise(0.4, 0.3, 900, -800); tone(90, 0.3, 'square', 0.1, -60); },
  bigboom: () => { noise(1.3, 0.5, 600, -560); tone(55, 1.1, 'sawtooth', 0.16, -35); },
  heal: () => { [660, 880, 1100].forEach((f, i) => tone(f, 0.14, 'sine', 0.05, 0, null, AC.currentTime + i * 0.06)); },
  emp: () => { tone(90, 0.6, 'square', 0.1, 40); noise(0.5, 0.2, 400, 4000, 'bandpass'); },
  zap: () => { tone(1800, 0.12, 'square', 0.04, 1300); noise(0.14, 0.1, 6500); },
  blink: () => { tone(400, 0.12, 'sine', 0.07, 1600); },
  power: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.05, 0, null, AC.currentTime + i * 0.07)); },
  select: () => tone(1200, 0.04, 'square', 0.035),
  deny: () => tone(160, 0.12, 'square', 0.05, -40),
  roll: () => tone(600 + Math.random() * 900, 0.03, 'square', 0.025),
  lock: () => { tone(300, 0.1, 'square', 0.06); tone(900, 0.18, 'square', 0.05, 0, null, AC.currentTime + 0.08); },
  ready: () => tone(1480, 0.07, 'sine', 0.035, 300),
  ko: () => { tone(400, 0.9, 'sawtooth', 0.1, -360); noise(0.8, 0.3, 1600, -1400); },
  win: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'square', 0.05, 0, null, AC.currentTime + i * 0.09)); },
  lose: () => { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.08, 0, null, AC.currentTime + i * 0.14)); },
  mine: () => tone(1000, 0.05, 'square', 0.03, 500),
  grav: () => tone(60, 0.8, 'sine', 0.18, 140),
  bell: () => { tone(880, 0.6, 'sine', 0.1); tone(1320, 0.4, 'sine', 0.05); },
  cloak: () => tone(1200, 0.3, 'sine', 0.04, -1000),
  turret: () => { tone(300, 0.08, 'square', 0.05); tone(450, 0.08, 'square', 0.05, 0, null, AC.currentTime + 0.08); }
};
const UI_SFX = { select: 1, deny: 1, power: 1, lock: 1, roll: 1 };
function sfx(n) {
  if (!AC || muted || !SFX[n]) return;
  if (F && F.demo && game.state === 'title' && !UI_SFX[n]) return; // attract mode: music only
  const t = performance.now();
  if (sfxLast[n] && t - sfxLast[n] < 45) return;
  sfxLast[n] = t; SFX[n]();
}
// music: one synthwave-ish loop per domain
const SONGS = {
  title: { tempo: 0.15, bass: [0, 0, 12, 0, 7, 0, 10, 12, 5, 5, 17, 5, 3, 3, 15, 10], arp: [12, 19, 15, 24], root: 40 },
  physical: { tempo: 0.13, bass: [0, 0, 12, 0, 10, 0, 7, 0, 0, 0, 12, 0, 15, 12, 10, 7], arp: [12, 15, 19, 15], root: 40 },
  drone: { tempo: 0.12, bass: [0, 12, 0, 12, 5, 17, 5, 17, 3, 15, 3, 15, 7, 19, 10, 22], arp: [12, 17, 19, 24], root: 43 },
  cyber: { tempo: 0.115, bass: [0, 1, 0, 12, 0, 1, 0, 13, 5, 6, 5, 17, 3, 4, 3, 15], arp: [12, 13, 19, 13], root: 38 },
  boss: { tempo: 0.105, bass: [0, 0, 12, 0, 1, 1, 13, 1, 0, 0, 12, 0, 6, 7, 6, 3], arp: [24, 19, 13, 12], root: 36 }
};
function setMute(v) { muted = v; LS.set('nc_mute', v ? '1' : '0'); if (master) master.gain.value = muted ? 0 : 0.3; }
let song = null, nextNote = 0, noteStep = 0;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function music() {
  if (!AC || muted || !song) return;
  const s = SONGS[song];
  if (nextNote < AC.currentTime) nextNote = AC.currentTime + 0.05;
  while (nextNote < AC.currentTime + 0.2) {
    const b = s.bass[noteStep % s.bass.length];
    tone(mtof(s.root + b), s.tempo * 0.9, 'triangle', 0.22, 0, musicGain, nextNote);
    if (noteStep % 2 === 0) tone(mtof(s.root + 12 + s.arp[(noteStep / 2) % s.arp.length]), s.tempo * 0.6, 'sawtooth', 0.025, 0, musicGain, nextNote);
    if (noteStep % 4 === 0) {
      const t = nextNote, sN = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
      sN.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = noteStep % 8 === 0 ? 150 : 5000;
      g.gain.setValueAtTime(noteStep % 8 === 0 ? 0.14 : 0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      sN.connect(f); f.connect(g); g.connect(musicGain); sN.start(t); sN.stop(t + 0.09);
    }
    nextNote += s.tempo; noteStep++;

function playSong(n) { if (song === n) return; song = n; noteStep = 0; if (AC) nextNote = AC.currentTime + 0.1; }

// ---------- data: stats, abilities, domains, opponents ----------

  { k: 'POW', name: 'POWER', col: '#ff5a3c', desc: 'Damage of every attack' },

// abilities: cost = energy, cd = seconds
const ABIL = {

  emp: { name: 'EMP BURST', icon: 'emp', col: '#7fb8ff', cost: 35, cd: 10, desc: 'Stuns + silences nearby enemies', range: 170 },
  overdrive: { name: 'OVERDRIVE', icon: 'overdrive', col: '#ff4fd8', cost: 30, cd: 12, desc: '+45% speed, +60% fire rate for 4s', range: 0 },
  decoy: { name: 'HOLO DECOY', icon: 'decoy', col: '#b8f7ff', cost: 25, cd: 10, desc: 'Spawns a decoy and cloaks you 1.5s', range: 0 },

function drawFight(dt) {

// ---------- helpers: stat effects, motion, sound, tutorial, keyboard/gamepad focus ----------
const pct = v => Math.round(v * 100) + '%';
function statEffect(k, v) {

    case 'ARM': return Math.round(150 + 10.5 * v) + ' integrity, -' + pct(Math.min(0.42, v * 0.012)) + ' dmg taken';
    case 'SPD': return 'move speed ' + Math.round(150 + 7 * v);
    case 'RFX': return 'dash every ' + Math.max(0.55, 1.9 - 0.06 * v).toFixed(2) + 's, ' + pct(Math.min(0.3, v * 0.011)) + ' evade';
    case 'NRG': return (60 + 5 * v) + ' energy, +' + (8 + 1.1 * v).toFixed(1) + '/s';
    case 'TGT': return pct(Math.min(0.45, 0.03 + v * 0.017)) + ' crit, tighter aim';
    case 'FWL': return '-' + pct(Math.min(0.75, v * 0.034)) + ' stun/slow/virus time';
    case 'OVC': return (2.6 + 0.1 * v).toFixed(1) + ' shots/s, -' + pct(Math.min(0.45, v * 0.019)) + ' cooldowns';
  }
  return '';
}
function toggleMotion() { RMOTION = !RMOTION; LS.set('nc_rm', RMOTION ? '1' : '0'); }

}
const TUT = { done: LS.get('nc_tut', '0') === '1', fire: false, dash: false, abil: false };

  const p = F.p;
  if (mouse.down || keys.fire || touchFire || (pad.on && pad.fire)) TUT.fire = true;
  if (p.dashCd > 0) TUT.dash = true;
  if (Object.values(p.cd).some(v => v > 0)) TUT.abil = true;
  const pad_ = pad.on && !TOUCH;
  let msg = null;
  if (!TUT.fire) msg = TOUCH ? 'RIGHT STICK: AIM + FIRE' : pad_ ? 'RIGHT STICK / RT: AIM + FIRE' : 'HOLD CLICK TO FIRE (aim with the mouse)';
  else if (!TUT.dash) msg = TOUCH ? 'TAP DASH TO DODGE THROUGH BOLTS' : pad_ ? 'B / LT: DASH THROUGH BOLTS' : 'SHIFT or RIGHT-CLICK: DASH THROUGH BOLTS';
  else if (!TUT.abil) msg = TOUCH ? 'TAP Q / E / R FOR ABILITIES' : pad_ ? 'X / Y / RB: ABILITIES' : 'Q / E / R: FIRE YOUR ABILITIES';

  const a = 0.75 + 0.25 * Math.sin(game.t * 5);

  cx.fillStyle = 'rgba(4,6,12,0.75)'; rrect(cx, W / 2 - w / 2, 92, w, 30, 10); cx.fill(); cx.strokeStyle = 'rgba(60,255,122,0.7)'; cx.lineWidth = 1.4; cx.stroke();
  txt(msg, W / 2, 108, 15, '#ffffff', 'center', 900); cx.restore();

const NAV_DEF = { draft: 'lock', versus: 'fight', result: 'cont', upgrade: 'next', gameover: 'again', victory: 'ng', fight: 'resume', title: 'boot' };
function navActivate() { // Enter / pad A on a focused button
  if (!navFocus || !pressed.start) return;
  const b = UIprev.find(x => x.id === navFocus); if (!b) return;
  pressed.start = false;
  if (b.dis) sfx('deny'); else if (b.fn) { sfx('select'); b.fn(); }
}
function navMove() {
  const menu = game.state !== 'fight' || game.paused;
  const dirs = game.state === 'title' ? ['nup', 'ndown'] : ['nup', 'ndown', 'nleft', 'nright'];

}
function checkRotate() {
  const el = document.getElementById('rot'); if (!el) return;

  if (on && game.state === 'fight') game.paused = true;

addEventListener('resize', checkRotate); addEventListener('orientationchange', checkRotate); checkRotate();

// ---------- main loop ----------
let lastT = performance.now();
function frame(dt) {
  game.t += dt; game.anim += dt;
  pollPad(); processClicks(); navActivate();
  UIprev = UI; UI = [];
  if (pressed.mute) setMute(!muted);
  cx.setTransform(SC, 0, 0, SC, 0, 0);
  cx.fillStyle = '#05060a'; cx.fillRect(0, 0, W, H);
  switch (game.state) {
    case 'title': drawTitle(dt); break;
    case 'draft': drawDraft(dt); break;
    case 'versus': drawVersus(dt); break;
    case 'fight': drawFight(dt); break;
    case 'result': drawResult(dt); break;
    case 'upgrade': drawUpgrade(dt); break;
    case 'gameover': drawEnd(dt, false); break;
    case 'victory': drawEnd(dt, true); break;
  }
  soundButton(); navMove();

  music();
}
function loop(now) {
  const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now;
  try { frame(dt); } catch (err) { console.error(err); }

}
requestAnimationFrame(loop);

// ---------- touch controls ----------
function showTouch(on) { const el = document.getElementById('touch'); if (el) el.style.display = on && TOUCH ? 'block' : 'none'; }
(function () {
  if (!TOUCH) return;
  const mk = (id, cb) => { const st = document.getElementById(id), kn = st.querySelector('.knob'); let pid = null, ox = 0, oy = 0;
    const set = (dx, dy) => { const d = Math.hypot(dx, dy), m = 50, k = d > m ? m / d : 1; kn.style.transform = 'translate(' + dx * k + 'px,' + dy * k + 'px)'; cb(d > 10 ? dx / Math.max(d, m) : 0, d > 10 ? dy / Math.max(d, m) : 0, d > 10); };
    st.addEventListener('pointerdown', e => { ensureAudio(); pid = e.pointerId; const r = st.getBoundingClientRect(); ox = r.left + r.width / 2; oy = r.top + r.height / 2; st.setPointerCapture(pid); set(e.clientX - ox, e.clientY - oy); e.preventDefault(); });
    st.addEventListener('pointermove', e => { if (e.pointerId === pid) set(e.clientX - ox, e.clientY - oy); });

    const up = () => b.classList.remove('on'); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up); });

}
function simOne(lvl, total) {
  newRun(); game.level = lvl; game.build.stats = rollStats(total); game.auto = true; startFight(); const tr = [];
  let n = 0; while (game.state === 'fight' && n < 60 * 140) { stepFight(1 / 60); n++; if (n % 120 === 0) tr.push([Math.round(F.t), Math.round(F.p.x), Math.round(F.p.y), Math.round(F.e.x), Math.round(F.e.y), Math.round(F.p.hp), Math.round(F.e.hp), F.units.length, F.p.brain.target && F.p.brain.target.kind, F.e.brain.target && F.e.brain.target.kind, F.phase]); }
