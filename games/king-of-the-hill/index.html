<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hill Turret — prototype v3</title>
<style>
  html,body{margin:0;height:100%;background:#07080c;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:100vw;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
// ===== Setup / resolution (render at up to 2x for crispness) =====
const W = 960, H = 540;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const S = Math.max(1, Math.min(2, (window.devicePixelRatio || 1) * Math.min(innerWidth / W, innerHeight / H)));
cv.width = Math.round(W * S); cv.height = Math.round(H * S);
function layer(w, h, scale = S) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * scale); c.height = Math.ceil(h * scale);
  const g = c.getContext('2d'); g.scale(scale, scale);
  return [c, g];
}
let seed = 1337; // seeded RNG so the scenery is identical every run
const srand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function hash(x, y) { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= 0.5; } return s / (1 - Math.pow(0.5, o)); }

// ===== Terrain (gameplay, unchanged from v1) =====
const GROUND = 470, PEAK_X = W / 2, HILL_H = 175, HILL_W = 210;
const hillY = x => GROUND - HILL_H * Math.exp(-Math.pow((x - PEAK_X) / HILL_W, 2));
const slopeAt = x => (hillY(x + 3) - hillY(x - 3)) / 6;
const TURRET = { x: PEAK_X, y: hillY(PEAK_X) - 18 };
const SUN = { x: 190, y: 300 };

// ===== Procedural sprites =====
function glowSprite(rgb, size = 128) {
  const [c, g] = layer(size, size, 1);
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(0.25, `rgba(${rgb},0.45)`);
  gr.addColorStop(0.6, `rgba(${rgb},0.12)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const GLOW = { white: glowSprite('255,255,255'), orange: glowSprite('255,140,50'), yellow: glowSprite('255,215,140'), red: glowSprite('255,40,30', 64), cyan: glowSprite('110,220,255', 64), green: glowSprite('90,255,120', 32) };
function smokeSprite(rgb, alpha) {
  const size = 96, [c, g] = layer(size, size, 1);
  for (let i = 0; i < 14; i++) {
    const a = srand() * 6.28, d = srand() * 22, r = 14 + srand() * 20;
    const x = 48 + Math.cos(a) * d, y = 48 + Math.sin(a) * d;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const shade = 0.8 + srand() * 0.4;
    const col = rgb.split(',').map(v => Math.min(255, Math.round(v * shade))).join(',');
    gr.addColorStop(0, `rgba(${col},${alpha})`); gr.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, size, size);
  }
  return c;
}
const SMOKE = [0, 1, 2].map(() => smokeSprite('70,64,62', 0.32));
const DUST = [0, 1].map(() => smokeSprite('150,128,98', 0.3));
const STEAM = [0, 1].map(() => smokeSprite('190,185,180', 0.25));
const FIRE = (() => {
  const [c, g] = layer(64, 64, 1);
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,250,225,1)'); gr.addColorStop(0.25, 'rgba(255,200,90,0.9)');
  gr.addColorStop(0.55, 'rgba(230,90,20,0.45)'); gr.addColorStop(1, 'rgba(120,20,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
})();

// ===== Pre-rendered background layers (parallax) =====
const PAD = 60; // parallax overscan
const skyLayer = (() => {
  const [c, g] = layer(W + PAD, H);
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#1a2033'); gr.addColorStop(0.35, '#3d4259'); gr.addColorStop(0.62, '#8a6a68');
  gr.addColorStop(0.78, '#d39a74'); gr.addColorStop(0.9, '#e8b58a'); gr.addColorStop(1, '#c48a6a');
  g.fillStyle = gr; g.fillRect(0, 0, W + PAD, H);
  const sg = g.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, 420);
  sg.addColorStop(0, 'rgba(255,225,170,0.75)'); sg.addColorStop(0.12, 'rgba(255,190,130,0.35)'); sg.addColorStop(1, 'rgba(255,160,110,0)');
  g.fillStyle = sg; g.fillRect(0, 0, W + PAD, H);
  g.save(); g.shadowColor = 'rgba(255,230,180,1)'; g.shadowBlur = 40;
  g.fillStyle = '#fff1d2'; g.beginPath(); g.arc(SUN.x, SUN.y, 24, 0, 7); g.fill(); g.restore();
  for (let i = 0; i < 26; i++) { // thin stratus streaks
    const y = 40 + srand() * 230, x = srand() * (W + PAD), w = 120 + srand() * 300;
    const lg = g.createLinearGradient(x - w, 0, x + w, 0);
    const warm = y > 180 ? '230,170,140' : '150,150,175';
    lg.addColorStop(0, `rgba(${warm},0)`); lg.addColorStop(0.5, `rgba(${warm},${0.08 + srand() * 0.12})`); lg.addColorStop(1, `rgba(${warm},0)`);
    g.fillStyle = lg; g.beginPath(); g.ellipse(x, y, w, 2 + srand() * 5, 0, 0, 7); g.fill();
  }
  return c;
})();
const cloudLayer = (() => {
  const CW = W * 2, [c, g] = layer(CW, 300, 1);
  for (let k = 0; k < 16; k++) {
    const cx = srand() * CW, cy = 60 + srand() * 170, n = 10 + srand() * 14;
    for (let i = 0; i < n; i++) {
      const x = cx + (srand() - 0.5) * 220, y = cy + (srand() - 0.5) * 30, r = 30 + srand() * 50;
      const lit = cy > 150 ? '220,160,130' : '120,118,140';
      const gr = g.createRadialGradient(x, y - r * 0.2, 0, x, y, r);
      gr.addColorStop(0, `rgba(${lit},0.22)`); gr.addColorStop(1, `rgba(${lit},0)`);
      g.save(); g.translate(x, y); g.scale(1, 0.45); g.translate(-x, -y);
      g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.restore();
    }
  }
  return c;
})();
const mountainLayer = (() => {
  const [c, g] = layer(W + PAD, H);
  const ridge = (base, amp, sc, col, sd) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + PAD; x += 3) g.lineTo(x, base - amp * fbm(x / sc, sd, 5));
    g.lineTo(W + PAD, H); g.fill();
    const hz = g.createLinearGradient(0, base - amp, 0, base + 30);
    hz.addColorStop(0, 'rgba(214,160,125,0)'); hz.addColorStop(1, 'rgba(214,160,125,0.55)');
    g.globalCompositeOperation = 'source-atop'; g.fillStyle = hz; g.fillRect(0, base - amp, W + PAD, H); g.globalCompositeOperation = 'source-over';
  };
  ridge(410, 150, 140, '#6e5f78', 3.1);
  ridge(425, 100, 90, '#544863', 7.7);
  return c;
})();
const cityLayer = (() => { // distant ruined city
  const [c, g] = layer(W + PAD, H);
  const base = 450, lit = [];
  let x = -10;
  while (x < W + PAD) {
    const bw = 22 + srand() * 46, bh = 40 + srand() * 140 * (0.5 + 0.5 * Math.abs(Math.sin(x * 0.004 + 1)));
    const top = base - bh, shade = 34 + srand() * 14;
    g.fillStyle = `rgb(${shade + 6},${shade},${shade + 12})`;
    g.beginPath(); g.moveTo(x, base); g.lineTo(x, top + srand() * 10);
    const steps = 3 + (srand() * 5 | 0); // broken jagged roofline
    for (let i = 1; i <= steps; i++) g.lineTo(x + bw * i / steps, top + (srand() < 0.5 ? srand() * 26 : -srand() * 6));
    g.lineTo(x + bw, base); g.fill();
    g.fillStyle = 'rgba(230,150,110,0.12)'; g.fillRect(x, top + 8, 3, bh); // sunward edge
    for (let wy = top + 14; wy < base - 8; wy += 9) for (let wx = x + 4; wx < x + bw - 6; wx += 7) {
      const r = srand();
      if (r < 0.03) lit.push([wx, wy]);
      g.fillStyle = r < 0.55 ? 'rgba(10,8,16,0.55)' : 'rgba(10,8,16,0.2)';
      g.fillRect(wx, wy, 3.5, 5);
    }
    if (srand() < 0.45) { // exposed girders
      g.strokeStyle = `rgb(${shade - 6},${shade - 8},${shade})`; g.lineWidth = 1.2;
      for (let i = 0; i < 3; i++) { const gx = x + srand() * bw; g.beginPath(); g.moveTo(gx, top + 6); g.lineTo(gx + (srand() - 0.5) * 10, top - 10 - srand() * 16); g.stroke(); }
    }
    x += bw + srand() * 6 - 2;
  }
  g.strokeStyle = '#2c2833'; g.lineWidth = 2; // crane
  g.beginPath(); g.moveTo(700, base); g.lineTo(700, 250); g.lineTo(620, 262); g.moveTo(700, 250); g.lineTo(760, 255); g.moveTo(640, 260); g.lineTo(640, 300); g.stroke();
  for (const [wx, wy] of lit) { g.fillStyle = 'rgba(255,170,90,0.85)'; g.fillRect(wx, wy, 3.5, 5); }
  const hz = g.createLinearGradient(0, 300, 0, base);
  hz.addColorStop(0, 'rgba(205,150,120,0)'); hz.addColorStop(1, 'rgba(205,150,120,0.6)');
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = hz; g.fillRect(0, 280, W + PAD, H); g.globalCompositeOperation = 'source-over';
  g.fillStyle = hz; g.fillRect(0, 420, W + PAD, 120);
  return c;
})();

const hillLayer = (() => { // textured hill: dirt, strata, rocks, noise, grass
  const [c, g] = layer(W, H);
  g.save(); g.beginPath(); g.moveTo(-10, H + 10); for (let x = -10; x <= W + 10; x += 3) g.lineTo(x, hillY(x)); g.lineTo(W + 10, H + 10); g.closePath(); g.clip();
  const dg = g.createLinearGradient(0, GROUND - HILL_H, 0, H);
  dg.addColorStop(0, '#6d5a40'); dg.addColorStop(0.3, '#57462f'); dg.addColorStop(1, '#2b2219');
  g.fillStyle = dg; g.fillRect(0, 0, W, H);
  const bands = [[18, '#7a6446', 0.35], [34, '#4a3a28', 0.4], [52, '#6a5a48', 0.3], [75, '#3c3024', 0.45], [100, '#5d5244', 0.35], [130, '#2e261d', 0.5]];
  for (const [d, col, a] of bands) {
    g.globalAlpha = a; g.fillStyle = col; g.beginPath();
    for (let x = -10; x <= W + 10; x += 4) { const y = hillY(x) + d + (fbm(x / 60, d) - 0.5) * 18; x === -10 ? g.moveTo(x, y) : g.lineTo(x, y); }
    for (let x = W + 10; x >= -10; x -= 4) g.lineTo(x, hillY(x) + d + 8 + (fbm(x / 50, d + 9) - 0.5) * 14);
    g.fill();
  }
  g.globalAlpha = 1;
  for (let i = 0; i < 120; i++) { // embedded rocks
    const x = srand() * W, depth = 10 + Math.pow(srand(), 0.8) * 160, y = hillY(x) + depth;
    if (y > H) continue;
    const r = 2 + srand() * (3 + depth * 0.06);
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(x + 1, y + r * 0.5, r * 1.1, r * 0.6, 0, 0, 7); g.fill();
    const rg = g.createLinearGradient(x - r, y - r, x + r, y + r), t = 66 + srand() * 34;
    rg.addColorStop(0, `rgb(${t + 24},${t + 16},${t + 4})`); rg.addColorStop(1, `rgb(${t - 34},${t - 40},${t - 44})`);
    g.fillStyle = rg; g.beginPath();
    for (let k = 0; k < 7; k++) { const a = k / 7 * 6.28, rr = r * (0.7 + srand() * 0.4); g.lineTo(x + Math.cos(a) * rr * 1.2, y + Math.sin(a) * rr * 0.8); }
    g.fill();
  }
  for (let i = 0; i < 26; i++) { // half-buried scrap from past battles
    const x = srand() * W, y = hillY(x) + 6 + srand() * 40;
    g.save(); g.translate(x, y); g.rotate(srand() * 6.28);
    g.fillStyle = srand() < 0.5 ? '#3d3a37' : '#5a3a22'; g.fillRect(-4, -1.5, 6 + srand() * 6, 3);
    g.fillStyle = 'rgba(255,220,180,0.2)'; g.fillRect(-4, -1.5, 6, 0.8); g.restore();
  }
  const [nc, ng] = layer(W, H, 1), id = ng.createImageData(W, H), d = id.data; // fBm grain texture
  for (let y = 280; y < H; y++) for (let x = 0; x < W; x++) {
    const n = fbm(x / 34, y / 18, 3) * 0.6 + hash(x, y) * 0.4;
    const v = clamp(128 + (n - 0.5) * 190, 0, 255), i = (y * W + x) * 4;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  ng.putImageData(id, 0, 0);
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.75; g.drawImage(nc, 0, 0, W, H);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  const lg = g.createLinearGradient(PEAK_X - 260, 0, PEAK_X + 300, 0); // sun from the left
  lg.addColorStop(0, 'rgba(255,190,130,0.10)'); lg.addColorStop(0.45, 'rgba(0,0,0,0)'); lg.addColorStop(1, 'rgba(10,5,20,0.35)');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  const bg = g.createLinearGradient(0, 380, 0, H);
  bg.addColorStop(0, 'rgba(0,0,0,0)'); bg.addColorStop(1, 'rgba(8,4,10,0.55)');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.restore();
  g.lineCap = 'round'; g.strokeStyle = '#3c4a22'; g.lineWidth = 7; g.beginPath(); // turf edge
  for (let x = -10; x <= W + 10; x += 3) x === -10 ? g.moveTo(x, hillY(x) + 2.5) : g.lineTo(x, hillY(x) + 2.5);
  g.stroke();
  const greens = ['#6f8a3a', '#56702c', '#8a9a48', '#a39a5a', '#47602a', '#b0a066'];
  for (let x = -10; x <= W + 10; x += 0.8) { // grass blades
    const patch = fbm(x / 40, 5.5);
    if (patch < 0.3 && srand() < 0.6) continue;
    const y = hillY(x) + 2 + srand() * 2, h = (2 + srand() * 7) * (0.5 + patch), lean = -0.1 + srand() * 0.5;
    g.strokeStyle = greens[(srand() * greens.length) | 0]; g.lineWidth = 0.9 + srand() * 0.6;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + lean * h * 0.4, y - h * 0.6, x + lean * h, y - h); g.stroke();
  }
  g.globalCompositeOperation = 'source-atop'; // warm rim light on sunlit slope
  const rim = g.createLinearGradient(0, 0, PEAK_X + 40, 0);
  rim.addColorStop(0, 'rgba(255,190,120,0.25)'); rim.addColorStop(1, 'rgba(255,190,120,0)');
  g.fillStyle = rim; g.fillRect(0, 250, PEAK_X + 40, 260);
  g.globalCompositeOperation = 'source-over';
  return c;
})();
const turretBase = (() => { // sandbags + armored pedestal, origin at TURRET
  const [c, g] = layer(180, 80); g.translate(90, 40);
  const sh = g.createRadialGradient(4, 22, 0, 4, 22, 70);
  sh.addColorStop(0, 'rgba(0,0,0,0.55)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.translate(4, 22); g.scale(1, 0.22); g.translate(-4, -22); g.fillStyle = sh; g.fillRect(-70, -60, 150, 160); g.restore();
  const bag = (x, y, w, h) => {
    const bg = g.createLinearGradient(x, y - h, x, y + h);
    bg.addColorStop(0, '#b8a27a'); bg.addColorStop(0.5, '#8e7a56'); bg.addColorStop(1, '#4e4130');
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(x + 1.5, y + 2, w, h, 0, 0, 7); g.fill();
    g.fillStyle = bg; g.beginPath(); g.ellipse(x, y, w, h, 0, 0, 7); g.fill();
    g.strokeStyle = 'rgba(60,45,30,0.6)'; g.lineWidth = 0.7;
    g.beginPath(); g.moveTo(x - w * 0.6, y - h * 0.3); g.lineTo(x + w * 0.6, y - h * 0.3); g.stroke();
    g.fillStyle = 'rgba(255,240,210,0.25)'; g.beginPath(); g.ellipse(x - w * 0.25, y - h * 0.5, w * 0.45, h * 0.25, 0, 0, 7); g.fill();
  };
  for (const s of [-1, 1]) { bag(s * 50, 20, 11, 5.5); bag(s * 68, 23, 10, 5); bag(s * 40, 13, 10, 5); bag(s * 58, 15, 10, 5); }
  const pg = g.createLinearGradient(-36, 0, 36, 0);
  pg.addColorStop(0, '#9aa3ad'); pg.addColorStop(0.3, '#6c7580'); pg.addColorStop(0.7, '#454c56'); pg.addColorStop(1, '#262b32');
  g.fillStyle = pg; g.beginPath(); g.moveTo(-36, 24); g.lineTo(-26, 0); g.lineTo(26, 0); g.lineTo(36, 24); g.closePath(); g.fill();
  g.strokeStyle = '#1b1e23'; g.lineWidth = 1; g.stroke();
  g.strokeStyle = 'rgba(255,235,210,0.7)'; g.beginPath(); g.moveTo(-26, 0.6); g.lineTo(26, 0.6); g.stroke();
  g.save(); g.beginPath(); g.rect(-31, 13, 62, 5); g.clip(); // hazard band
  g.fillStyle = '#c9a227'; g.fillRect(-31, 13, 62, 5); g.fillStyle = '#1f1d1a';
  for (let x = -40; x < 40; x += 7) { g.beginPath(); g.moveTo(x, 18); g.lineTo(x + 3.5, 13); g.lineTo(x + 7, 13); g.lineTo(x + 3.5, 18); g.fill(); }
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(-31, 13, 62, 5); g.restore();
  g.strokeStyle = 'rgba(0,0,0,0.45)'; g.beginPath(); g.moveTo(-10, 0); g.lineTo(-12, 13); g.moveTo(10, 0); g.lineTo(12, 13); g.stroke();
  const rv = (x, y) => { g.fillStyle = '#20242a'; g.beginPath(); g.arc(x + 0.4, y + 0.4, 1.3, 0, 7); g.fill(); g.fillStyle = '#c4ccd6'; g.beginPath(); g.arc(x - 0.2, y - 0.2, 0.9, 0, 7); g.fill(); };
  for (let x = -22; x <= 22; x += 7.3) rv(x, 4.5);
  for (const x of [-30, -20, 20, 30]) rv(x, 21);
  g.fillStyle = 'rgba(70,52,34,0.6)'; g.fillRect(-36, 21, 72, 3);
  return c;
})();
const vignette = (() => {
  const [c, g] = layer(W, H, 1);
  const vg = g.createRadialGradient(W / 2, H * 0.48, H * 0.32, W / 2, H / 2, W * 0.65);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(0.7, 'rgba(6,4,12,0.28)'); vg.addColorStop(1, 'rgba(4,2,8,0.7)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  return c;
})();
// cached gradients in local sprite coordinates (reused every frame)
const G = {};
const lin = (x0, y0, x1, y1, stops) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
const rad = (x0, y0, r0, x1, y1, r1, stops) => { const g = ctx.createRadialGradient(x0, y0, r0, x1, y1, r1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
G.barrel = lin(0, -6, 0, 6, [[0, '#2c3138'], [0.22, '#dfe6ee'], [0.45, '#8b95a2'], [0.8, '#3a4049'], [1, '#15181c']]);
G.receiver = lin(0, -12, 0, 12, [[0, '#b8c1cc'], [0.35, '#6f7884'], [1, '#22262c']]);
G.dome = rad(-6, -10, 1, 0, 0, 22, [[0, '#f4f7fb'], [0.18, '#a9b3bf'], [0.6, '#5a636f'], [1, '#1d2127']]);
G.scut = lin(0, -24, 0, -8, [[0, '#f3b064'], [0.45, '#c46a28'], [1, '#5e2c0e']]);
G.brute = lin(0, -46, 0, -14, [[0, '#c3c9d2'], [0.35, '#7f8898'], [1, '#353b46']]);
G.wheel = rad(-1.5, -1.5, 0, 0, 0, 6, [[0, '#8a8f98'], [0.6, '#3e424a'], [1, '#16181b']]);
G.drone = rad(-4, -5, 1, 0, 0, 15, [[0, '#f2fbff'], [0.3, '#86aec6'], [0.75, '#34495a'], [1, '#151d25']]);
G.brass = lin(0, -1, 0, 1, [[0, '#f6dc8a'], [0.5, '#b88a2e'], [1, '#5a3f10']]);
G.ammo = lin(0, 7, 0, 12, [[0, '#f6dc8a'], [0.5, '#b88a2e'], [1, '#5a3f10']]);

// ===== Input (unchanged) =====
const mouse = { x: W / 2 + 150, y: 200, down: false };
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width;
  mouse.y = (e.clientY - r.top) * H / r.height;
}
cv.addEventListener('mousemove', toCanvas);
cv.addEventListener('mousedown', e => {
  toCanvas(e); audioInit();
  if (inMute()) { setMuted(!AU.muted); sfx('toggle'); return; }
  if (e.button === 2) { if (state.mode === 'play') throwGrenade(); return; }
  if (e.button !== 0) return;
  mouse.down = true; onClick();
});
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { e.preventDefault(); if (state.mode === 'play') state.weapon = (state.weapon + (e.deltaY > 0 ? 1 : 2)) % 3; }, { passive: false });
window.addEventListener('keydown', e => {
  audioInit();
  const k = e.key.toLowerCase();
  if (k === 'm') setMuted(!AU.muted);
  else if (k === '1' || k === '2' || k === '3') state.weapon = +k - 1;
  else if (k === 'g') throwGrenade();
  else if (k === 'r') fireRocket();
});
window.addEventListener('mouseup', () => { mouse.down = false; });
cv.addEventListener('touchstart', e => { e.preventDefault(); toCanvas(e.touches[0]); mouse.down = true; onClick(); }, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); toCanvas(e.touches[0]); }, { passive: false });
cv.addEventListener('touchend', () => { mouse.down = false; });

// ===== Robot types (gameplay stats identical to v1) =====
const TYPES = {
  scuttler: { hp: 1,  speed: 95, r: 9,  dmg: 5,  score: 10, debris: ['#c46a28', '#f3b064', '#3a3836', '#5e2c0e'] },
  brute:    { hp: 10, speed: 28, r: 22, dmg: 20, score: 60, debris: ['#7f8898', '#353b46', '#1e1f22', '#c3c9d2'] },
  drone:    { hp: 2,  speed: 70, r: 11, dmg: 8,  score: 25, debris: ['#86aec6', '#34495a', '#3d434c', '#151d25'] },
};

// ===== State =====
let state, best = 0, clock = 0, camX = 0;
const fx = { smoke: [], fire: [], sparks: [], debris: [], casings: [], lights: [], rings: [], wrecks: [], bg: [], dust: [], scorch: [] };
for (let i = 0; i < 55; i++) fx.dust.push({ x: Math.random() * W, y: 150 + Math.random() * 360, s: 0.6 + Math.random() * 1.6, v: 6 + Math.random() * 14, p: Math.random() * 6.28 });
const CAP = { smoke: 260, fire: 160, sparks: 260, debris: 180, casings: 70, bg: 90, lights: 40, scorch: 14 };
function add(kind, o) { const a = fx[kind]; a.push(o); if (CAP[kind] && a.length > CAP[kind]) a.shift(); }

function reset(mode) {
  state = {
    mode, t: 0, score: 0, wave: 0, hp: 100, maxHp: 100,
    angle: -Math.PI / 4, cooldown: 0, fireRate: 9, flash: 0, recoil: 0, heat: 0,
    robots: [], bullets: [], floaters: [],
    toSpawn: [], spawnTimer: 0, banner: 0, shake: 0, hurt: 0, kills: 0, dmgTimer: 0,
    weapon: 0, gren: 6, rock: 4, gcd: 0, rcd: 0, grenades: [], rockets: [], pickups: [],
  };
  for (const k of ['debris', 'casings', 'wrecks', 'scorch']) fx[k].length = 0;
  if (mode === 'play') nextWave();
}
function nextWave() {
  const s = state;
  s.wave++;
  s.banner = 2.2;
  if (s.wave > 1) { s.hp = Math.min(s.maxHp, s.hp + 15); s.fireRate = Math.min(18, s.fireRate + 0.8); s.gren = Math.min(WEAPONS[1].max, s.gren + 3); s.rock = Math.min(WEAPONS[2].max, s.rock + 2); }
  sfx(s.wave > 1 ? 'waveClear' : 'waveStart');
  const w = s.wave, list = [];
  const n = 6 + w * 4;
  for (let i = 0; i < n; i++) {
    let t = 'scuttler';
    const r = Math.random();
    if (w >= 2 && r < Math.min(0.35, 0.12 + w * 0.03)) t = 'drone';
    else if (w >= 3 && r > 1 - Math.min(0.25, 0.06 + w * 0.025)) t = 'brute';
    list.push(t);
  }
  if (w === 1) list[n - 1] = 'brute';
  s.toSpawn = list;
  s.spawnInterval = Math.max(0.22, 1.1 - w * 0.09);
  s.spawnTimer = 1.5;
}
function spawn(type) {
  const T = TYPES[type], side = Math.random() < 0.5 ? -1 : 1;
  const x = side < 0 ? -30 : W + 30;
  const hpScale = 1 + (state.wave - 1) * 0.12;
  state.robots.push({
    type, side, x, y: type === 'drone' ? 80 + Math.random() * 140 : hillY(x),
    baseY: 80 + Math.random() * 140, hp: Math.ceil(T.hp * hpScale), maxHp: Math.ceil(T.hp * hpScale),
    speed: T.speed * (0.9 + Math.random() * 0.25) * (1 + state.wave * 0.03), r: T.r,
    phase: Math.random() * 6.28, hit: 0, seed: Math.random() * 1000, puff: 0,
  });
}
function onClick() {
  if (state.mode !== 'play') {
    if (state.mode === 'over' && state.t < 0.8) return;
    reset('play');
  }
}

// ===== FX emitters (visual only) =====
function sparks(x, y, n, spd, dirA = null, spread = Math.PI) {
  for (let i = 0; i < n; i++) {
    const a = dirA === null ? Math.random() * 6.28 : dirA + (Math.random() - 0.5) * spread, v = spd * (0.3 + Math.random());
    add('sparks', { x, y, px: x, py: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.15, 0.5), max: 0.5 });
  }
}
function smoke(x, y, n, o = {}) {
  const set = o.spr || SMOKE;
  for (let i = 0; i < n; i++) {
    const life = rnd(o.lmin || 1.0, o.lmax || 2.2);
    add('smoke', { x: x + rnd(-6, 6), y: y + rnd(-6, 6), vx: rnd(-25, 25) + (o.vx || 0), vy: rnd(-50, -15) + (o.vy || 0),
      size: rnd(o.min || 12, o.max || 26), grow: rnd(18, 42) * (o.grow || 1), life, max: life, spr: set[(Math.random() * set.length) | 0] });
  }
}
function fire(x, y, n, spd, sz) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = spd * Math.random(), l = rnd(0.25, 0.6);
    add('fire', { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, size: sz * rnd(0.6, 1.2), life: l, max: l });
  }
}
function light(x, y, r, c, life, i = 1) { add('lights', { x, y, r, c, life, max: life, i }); }
function debris(x, y, cols, n, spd, smoky) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, v = spd * rnd(0.4, 1.1);
    add('debris', { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: Math.random() * 6.28, vr: rnd(-14, 14), w: rnd(2.5, 7), h: rnd(1.5, 4),
      c: cols[(Math.random() * cols.length) | 0], life: rnd(3.5, 6), rest: false, smoky: smoky && Math.random() < 0.5, hot: smoky ? 1 : 0 });
  }
}
function explode(r, big) {
  const T = TYPES[r.type], x = r.x, y = r.y;
  light(x, y, big ? 260 : 140, 'orange', big ? 0.35 : 0.22, 1);
  light(x, y, big ? 90 : 50, 'white', 0.08, 1);
  fx.rings.push({ x, y, r: 6, v: big ? 520 : 300, life: 0.3, max: 0.3 });
  fire(x, y, big ? 22 : 9, big ? 140 : 90, big ? 40 : 24);
  smoke(x, y, big ? 14 : 6, { min: big ? 20 : 12, max: big ? 40 : 24, lmin: 1.2, lmax: 2.6 });
  sparks(x, y, big ? 45 : 18, big ? 420 : 300);
  debris(x, y, T.debris, big ? 16 : 7, big ? 340 : 240, true);
  state.shake = Math.min(14, state.shake + (r.type === 'brute' ? 9 : 3));
  if (r.type === 'brute') fx.wrecks.push({ x: r.x, y: hillY(r.x), face: -r.side, ang: Math.atan(slopeAt(r.x)), life: 7, max: 7, t: 0 });
}

// ===== Update (gameplay logic same as v1; FX hooks added) =====
function update(dt) {
  const s = state;
  s.t += dt;
  s.shake = Math.max(0, s.shake - dt * 30);
  s.flash = Math.max(0, s.flash - dt);
  s.recoil = Math.max(0, s.recoil - dt * 40);
  s.hurt = Math.max(0, s.hurt - dt * 2);
  s.banner = Math.max(0, s.banner - dt);
  s.heat = Math.max(0, s.heat - dt * 0.35);
  for (const f of s.floaters) { f.y -= 30 * dt; f.life -= dt; }
  s.floaters = s.floaters.filter(f => f.life > 0);
  s.dmgTimer -= dt; // damaged turret smokes / burns
  if (s.dmgTimer <= 0 && s.mode !== 'title' && (s.hp < 50 || s.mode === 'over')) {
    const bad = s.hp < 25 || s.mode === 'over';
    s.dmgTimer = s.mode === 'over' ? 0.05 : bad ? 0.07 : 0.14;
    smoke(TURRET.x + rnd(-10, 14), TURRET.y - 4, 1, { min: 8, max: 16, vy: -30, lmin: 1.5, lmax: 2.8 });
    if (bad) { fire(TURRET.x + rnd(-14, 14), TURRET.y + 2, 1, 20, 16); if (Math.random() < 0.15) sparks(TURRET.x, TURRET.y, 4, 160, -Math.PI / 2, 1.6); }
  }
  if (s.mode === 'title') { s.angle = -Math.PI / 2 + Math.sin(clock) * 0.9; return; }
  if (s.mode === 'over') return;

  let a = Math.atan2(mouse.y - TURRET.y, mouse.x - TURRET.x);
  if (a > 0.35 && a < Math.PI - 0.35) a = a < Math.PI / 2 ? 0.35 : Math.PI - 0.35;
  s.angle = a;

  s.cooldown -= dt;
  if (mouse.down && s.weapon === 0 && s.cooldown <= 0) {
    s.cooldown = 1 / s.fireRate;
    const ca = Math.cos(a), sa = Math.sin(a);
    const bx = TURRET.x + ca * 44, by = TURRET.y - 4 + sa * 44;
    const sp = (Math.random() - 0.5) * 0.06;
    s.bullets.push({ x: bx, y: by, vx: Math.cos(a + sp) * 820, vy: Math.sin(a + sp) * 820, life: 1.3 });
    s.flash = 0.06; s.recoil = 6; s.shake = Math.max(s.shake, 1.5);
    s.heat = Math.min(1, s.heat + 0.035); sfx('shot');
    light(bx, by, 150, 'yellow', 0.07, 0.9);
    smoke(bx + ca * 6, by + sa * 6, 1, { spr: STEAM, min: 6, max: 10, grow: 0.8, lmin: 0.4, lmax: 0.8, vx: ca * 40, vy: sa * 40 });
    sparks(bx, by, 2, 260, a, 0.5);
    add('casings', { x: TURRET.x - ca * 6, y: TURRET.y - 8, vx: -ca * rnd(40, 90) + rnd(-20, 20), vy: rnd(-230, -150), rot: Math.random() * 6.28, vr: rnd(-30, 30), life: 3.5, rest: false, clink: true });
  }

  updateOrdnance(dt);
  s.spawnTimer -= dt;
  if (s.toSpawn.length && s.spawnTimer <= 0) {
    spawn(s.toSpawn.shift());
    s.spawnTimer = s.spawnInterval * (0.5 + Math.random());
  }

  for (const r of s.robots) {
    if (r.dead) continue;
    r.phase += dt * (r.type === 'scuttler' ? 18 : 6);
    r.hit = Math.max(0, r.hit - dt * 6);
    if (r.type === 'drone') {
      const dx = TURRET.x - r.x, dy = TURRET.y - r.y, d = Math.hypot(dx, dy);
      const close = Math.abs(dx) < 220;
      r.x += Math.sign(dx) * r.speed * dt;
      if (close) r.y += (dy / d) * r.speed * 1.2 * dt;
      else r.y = r.baseY + Math.sin(r.phase * 0.5) * 25;
    } else {
      const dir = -r.side;
      const slope = (hillY(r.x + dir * 4) - hillY(r.x)) / 4;
      r.x += dir * r.speed * dt * (slope < 0 ? 0.75 : 1);
      r.y = hillY(r.x);
      r.puff -= dt; // footstep dust / exhaust (visual)
      if (r.puff <= 0) {
        if (r.type === 'brute') {
          r.puff = 0.18;
          smoke(r.x - dir * 17, r.y - 54, 1, { min: 5, max: 9, vy: -25, lmin: 0.8, lmax: 1.4 });
          smoke(r.x - dir * 22, r.y - 2, 1, { spr: DUST, min: 6, max: 12, lmin: 0.5, lmax: 0.9, vy: 10 });
          if (r.hp < r.maxHp / 2) { smoke(r.x, r.y - 36, 1, { min: 8, max: 14, vy: -30 }); if (Math.random() < 0.3) sparks(r.x, r.y - 30, 3, 150, -Math.PI / 2, 2); }
        } else { r.puff = 0.22; if (Math.random() < 0.5) smoke(r.x - dir * 4, r.y - 1, 1, { spr: DUST, min: 3, max: 6, grow: 0.4, lmin: 0.35, lmax: 0.6, vy: 10 }); }
      }
    }
    const reach = r.type === 'drone' ? Math.hypot(r.x - TURRET.x, r.y - TURRET.y) < 26 : Math.abs(r.x - TURRET.x) < 26 + r.r * 0.5;
    if (reach) {
      r.dead = true;
      s.hp -= TYPES[r.type].dmg;
      s.hurt = 1; sfx('hurt');
      s.shake = Math.min(18, s.shake + 8 + TYPES[r.type].dmg * 0.3);
      explode({ ...r, y: r.type === 'drone' ? r.y : r.y - r.r }, true);
      s.floaters.push({ x: TURRET.x, y: TURRET.y - 40, text: '-' + TYPES[r.type].dmg, color: '#ff5566', life: 0.9 });
    }
  }

  for (const b of s.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.y > hillY(b.x)) {
      b.life = 0; const gy = hillY(b.x);
      smoke(b.x, gy, 2, { spr: DUST, min: 5, max: 10, lmin: 0.5, lmax: 1.0, vy: -20 });
      debris(b.x, gy, ['#5a4630', '#3b2e20', '#7a6446'], 3, 120, false);
      sparks(b.x, gy, 3, 160, -Math.PI / 2, 2);
      light(b.x, gy, 30, 'yellow', 0.05, 0.6);
      continue;
    }
    for (const p of s.pickups) if (!p.got && Math.hypot(b.x - p.x, b.y - (p.y - 6)) < 13) { collect(p); b.life = 0; }
    if (b.life <= 0) continue;
    for (const r of s.robots) {
      if (r.dead) continue;
      const cy = r.type === 'drone' ? r.y : r.y - r.r;
      if (Math.hypot(b.x - r.x, b.y - cy) < r.r + 3) {
        b.life = 0; r.hp--; r.hit = 1;
        sparks(b.x, b.y, 8, 260, Math.atan2(-b.vy, -b.vx), 1.8);
        light(b.x, b.y, 50, 'yellow', 0.07, 0.8);
        if (r.type === 'brute') { r.x += r.side * 2.5; debris(b.x, b.y, TYPES.brute.debris, 1, 140, false); }
        if (r.hp <= 0) killRobot(r); else sfx('hit');
        break;
      }
    }
  }
  s.bullets = s.bullets.filter(b => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -40);
  s.robots = s.robots.filter(r => !r.dead);

  if (s.hp <= 0) {
    s.hp = 0; s.mode = 'over'; s.t = 0; best = Math.max(best, s.score);
    s.overAngle = s.angle;
    for (let i = 0; i < 4; i++) explode({ type: 'drone', x: TURRET.x + rnd(-30, 30), y: TURRET.y + rnd(-15, 5), side: 1 }, true);
    light(TURRET.x, TURRET.y, 500, 'orange', 0.6, 1);
    sfx('gameover'); s.grenades = []; s.rockets = [];
    s.shake = 22;
    return;
  }
  if (!s.toSpawn.length && !s.robots.length) nextWave();
}

const CITY_FIRES = [[150, 405], [790, 418], [565, 430]];
function updateFx(dt) {
  const wind = 14;
  for (const p of fx.smoke) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx += (wind - p.vx) * 0.6 * dt; p.vy *= 1 - 0.8 * dt; p.vy -= 6 * dt; p.size += p.grow * dt; p.life -= dt; }
  fx.smoke = fx.smoke.filter(p => p.life > 0);
  for (const p of fx.fire) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy -= 90 * dt; p.life -= dt; }
  fx.fire = fx.fire.filter(p => p.life > 0);
  for (const p of fx.sparks) { p.px = p.x; p.py = p.y; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.vx *= 0.99; p.life -= dt; if (p.y > hillY(p.x)) { p.y = hillY(p.x); p.vy *= -0.35; p.vx *= 0.6; } }
  fx.sparks = fx.sparks.filter(p => p.life > 0);
  const phys = (o, bounce) => { // simple bounce-and-settle on the hill surface
    if (o.rest) return;
    o.x += o.vx * dt; o.y += o.vy * dt; o.vy += 650 * dt; o.rot += o.vr * dt;
    const gy = hillY(o.x);
    if (o.y > gy - 1) { if (o.clink && o.vy > 110) sfx('clink'); o.y = gy - 1; o.vy *= -bounce; o.vx = o.vx * 0.55 + slopeAt(o.x) * 20; o.vr *= 0.5; if (Math.abs(o.vy) < 40) { o.rest = true; o.rot = Math.atan(slopeAt(o.x)) + (Math.random() < 0.5 ? 0 : Math.PI); } }
  };
  for (const d of fx.debris) { phys(d, 0.3); d.life -= dt; d.hot = Math.max(0, d.hot - dt * 1.2); if (d.smoky && !d.rest && Math.random() < 0.5) smoke(d.x, d.y, 1, { min: 3, max: 6, grow: 0.5, lmin: 0.4, lmax: 0.8, vx: 0, vy: 20 }); }
  fx.debris = fx.debris.filter(d => d.life > 0);
  for (const c of fx.casings) { phys(c, 0.45); c.life -= dt; }
  fx.casings = fx.casings.filter(c => c.life > 0);
  for (const l of fx.lights) l.life -= dt;
  fx.lights = fx.lights.filter(l => l.life > 0);
  for (const r of fx.rings) { r.r += r.v * dt; r.life -= dt; }
  fx.rings = fx.rings.filter(r => r.life > 0);
  for (const w of fx.wrecks) {
    w.life -= dt; w.t += dt;
    if (Math.random() < 0.5 * (w.life / w.max) + 0.1) smoke(w.x + rnd(-12, 12), w.y - 20, 1, { min: 10, max: 20, vy: -35, lmin: 1.4, lmax: 2.6 });
    if (w.life > 2.5 && Math.random() < 0.6) fire(w.x + rnd(-14, 14), w.y - 18, 1, 20, 18);
  }
  fx.wrecks = fx.wrecks.filter(w => w.life > 0);
  for (const [ex, ey] of CITY_FIRES) if (Math.random() < 6 * dt) { // distant smoke columns
    const l = rnd(6, 9);
    add('bg', { x: ex + rnd(-4, 4), y: ey, vx: rnd(2, 6), vy: rnd(-16, -10), size: rnd(8, 14), grow: rnd(5, 8), life: l, max: l, spr: SMOKE[(Math.random() * 3) | 0] });
  }
  for (const p of fx.bg) { p.x += (p.vx + (420 - p.y) * 0.06) * dt; p.y += p.vy * dt; p.size += p.grow * dt; p.life -= dt; }
  fx.bg = fx.bg.filter(p => p.life > 0);
  for (const d of fx.dust) { d.x += d.v * dt; d.y += Math.sin(clock * 0.7 + d.p) * 4 * dt; if (d.x > W + 5) { d.x = -5; d.y = 150 + Math.random() * 360; } }
}

// ===== Secondary weapons: grenades + rockets =====
const WEAPONS = [{ name: 'MG' }, { name: 'GRENADE', max: 8, cd: 0.55 }, { name: 'ROCKET', max: 6, cd: 0.9 }];
const GRAV = 700;
function throwGrenade() {
  const s = state; if (s.mode !== 'play' || s.gcd > 0) return;
  if (s.gren <= 0) { s.gcd = 0.3; sfx('empty'); return; }
  s.gren--; s.gcd = WEAPONS[1].cd;
  const ox = TURRET.x, oy = TURRET.y - 16, dx = mouse.x - ox, dy = mouse.y - oy;
  const T = clamp(Math.hypot(dx, dy) / 420, 0.45, 1.15); // flight time so it lands near the cursor
  s.grenades.push({ x: ox, y: oy, vx: dx / T, vy: (dy - 0.5 * GRAV * T * T) / T, rot: 0, vr: rnd(-12, 12), fuse: 1.5 });
  sfx('throw');
}
function rocketPod() { // world position of the launch tube on the gun
  const a = state.angle, flip = Math.cos(a) < 0, ly = flip ? 15.5 : -15.5;
  return [TURRET.x + Math.cos(a) * 14 - Math.sin(a) * ly, TURRET.y - 4 + Math.sin(a) * 14 + Math.cos(a) * ly];
}
function fireRocket() {
  const s = state; if (s.mode !== 'play' || s.rcd > 0) return;
  if (s.rock <= 0) { s.rcd = 0.3; sfx('empty'); return; }
  s.rock--; s.rcd = WEAPONS[2].cd;
  let tgt = null, bestD = 150; // lock onto the robot nearest the cursor
  for (const r of s.robots) { const d = Math.hypot(r.x - mouse.x, (r.type === 'drone' ? r.y : r.y - r.r) - mouse.y); if (d < bestD) { bestD = d; tgt = r; } }

  }
  ctx.globalCompositeOperation = 'source-over';
  for (const p of fx.smoke) { // layered soft smoke puffs
    ctx.globalAlpha = Math.min(1, p.life / p.max * 1.6) * Math.min(1, (p.max - p.life) * 8);
    ctx.drawImage(p.spr, p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const p of fx.fire) { const t = p.life / p.max, sz = p.size * (0.5 + t * 0.6); ctx.globalAlpha = t; ctx.drawImage(FIRE, p.x - sz, p.y - sz, sz * 2, sz * 2); }
  ctx.globalAlpha = 1; ctx.lineWidth = 1.4;
  for (const p of fx.sparks) {
    const t = p.life / p.max;
    ctx.strokeStyle = `rgba(255,${190 + 60 * t | 0},${90 + 120 * t | 0},${Math.min(1, t * 2)})`;
    ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x + p.vx * 0.012, p.y + p.vy * 0.012); ctx.stroke();
  }
  for (const r of fx.rings) { const t = r.life / r.max; ctx.strokeStyle = `rgba(255,220,180,${t * 0.5})`; ctx.lineWidth = 3 * t + 0.5; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); }
  for (const l of fx.lights) { // dynamic light flashes wash over terrain & units
    ctx.globalAlpha = Math.min(1, l.life / l.max * 1.3) * l.i;
    ctx.drawImage(GLOW[l.c], l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function text(str, x, y, size, color, align = 'center') {
  ctx.font = `bold ${size}px system-ui, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(str, x + 2, y + 2);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
const PANEL = lin(0, 0, 0, 1, [[0, 'rgba(70,78,90,0.85)'], [1, 'rgba(20,23,28,0.85)']]);
function panel(x, y, w, h) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, h); ctx.fillStyle = PANEL; ctx.fillRect(0, 0, w, 1); ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(x, y, w, h, 5); ctx.stroke();
}
function drawHud() {
  const s = state, pct = s.hp / s.maxHp;
  panel(14, 12, 238, 34);
  ctx.fillStyle = '#0b0c0f'; ctx.fillRect(21, 19, 224, 20);
  ctx.fillStyle = pct > 0.5 ? '#4fd06a' : pct > 0.25 ? '#e6b440' : '#e04050'; ctx.fillRect(22, 20, 222 * pct, 18);
  ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(22, 20, 222 * pct, 6);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; for (let i = 1; i < 10; i++) ctx.fillRect(22 + i * 22.2, 20, 1, 18);
  text(`TURRET ${Math.ceil(s.hp)}/${s.maxHp}`, 133, 29.5, 13, '#fff');
  if (s.heat > 0.05) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(22, 50, 100, 4); ctx.fillStyle = `rgb(255,${200 - 120 * s.heat | 0},60)`; ctx.fillRect(22, 50, 100 * s.heat, 4); }
  panel(W - 190, 12, 176, 74);
  text(`SCORE ${s.score}`, W - 24, 30, 20, '#ffe08a', 'right');
  text(`WAVE ${s.wave}`, W - 24, 55, 15, '#d8e0ec', 'right');
  text(`left: ${s.toSpawn.length + s.robots.length}`, W - 24, 74, 12, '#9aa7c7', 'right');
  if (s.banner > 0) {
    ctx.globalAlpha = Math.min(1, s.banner);
    text(`WAVE ${s.wave}`, W / 2, 120, 46, '#ffffff');
    if (s.wave > 1) text('+15 HP · fire rate up · +3 grenades · +2 rockets', W / 2, 160, 16, '#8df59f');
    ctx.globalAlpha = 1;
  }
}
function crosshair() {
  ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 9, 0, 7);
  ctx.moveTo(mouse.x - 15, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y); ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 15, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - 15); ctx.lineTo(mouse.x, mouse.y - 5); ctx.moveTo(mouse.x, mouse.y + 5); ctx.lineTo(mouse.x, mouse.y + 15);
  ctx.stroke();
}
function draw() {
  const s = state;
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.save();
  if (s.shake > 0) ctx.translate((Math.random() - 0.5) * s.shake, (Math.random() - 0.5) * s.shake);
  drawBackground();
  for (const r of s.robots) { // soft contact shadows
    if (r.type === 'drone') { const gy = hillY(r.x), h = gy - r.y; shadow(r.x, gy, 14 * clamp(1 - h / 400, 0.4, 1), 0.3 * clamp(1 - h / 350, 0.1, 1)); }
    else shadow(r.x, r.y, r.r * 1.35, 0.45);
  }
  drawScorch();
  for (const w of fx.wrecks) drawWreck(w);
  drawGroundFx();
  for (const r of s.robots) drawRobot(r);
  drawOrdnance();
  drawTurret();
  drawAirFx();
  ctx.fillStyle = 'rgb(255,225,190)'; // sunlit drifting dust
  for (const d of fx.dust) { ctx.globalAlpha = 0.15 + 0.2 * Math.sin(clock + d.p); ctx.fillRect(d.x, d.y, d.s, d.s); }
  ctx.globalAlpha = 1;
  for (const f of s.floaters) { ctx.globalAlpha = Math.min(1, f.life * 2); text(f.text, f.x, f.y, 16, f.color); }
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(255,160,90,0.22)'; ctx.fillRect(0, 0, W, H); // warm grade
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(vignette, 0, 0, W, H);
  if (s.hurt > 0) { ctx.fillStyle = `rgba(255,30,40,${s.hurt * 0.22})`; ctx.fillRect(0, 0, W, H); }
  if (s.mode === 'play') {
    drawHud(); drawWeapons();
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 3.5; crosshair();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5; crosshair();
  } else if (s.mode === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
    text('HILL TURRET', W / 2, 170, 64, '#ffe08a');
    text('Hold the hill. Stop the horde.', W / 2, 225, 20, '#d8e0ec');
    text('Mouse aim · hold Left Mouse to fire the selected weapon', W / 2, 272, 16, '#ffffff');
    text('1 Machine gun · 2 Grenade · 3 Rocket   (or mouse wheel)', W / 2, 296, 16, '#ffffff');
    text('Right-click / G: quick grenade · R: quick rocket · M: mute', W / 2, 320, 16, '#ffffff');
    text('Click to start', W / 2, 372, 24, '#8df59f');
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    text('THE HILL HAS FALLEN', W / 2, 170, 48, '#ff5566');
    text(`Score ${s.score}  ·  Wave ${s.wave}  ·  ${s.kills} robots scrapped`, W / 2, 235, 20, '#ffffff');
    text(`Best ${best}`, W / 2, 270, 18, '#ffe08a');
    if (s.t > 0.8) text('Click to restart', W / 2, 340, 24, '#8df59f');
  }
  drawMute();
}

// ===== Loop =====
let last = performance.now();
const perf = { frames: 0, acc: 0, worst: 0 };
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  clock += dt;
  const target = state.mode === 'title' ? Math.sin(clock * 0.3) * 20 : (mouse.x - W / 2) * 0.05; // subtle parallax camera
  camX += (target - camX) * Math.min(1, dt * 3);
  const t0 = performance.now();
  update(dt); updateFx(dt); audioTick(dt); draw();
  const ms = performance.now() - t0; perf.acc += ms; perf.frames++; perf.worst = Math.max(perf.worst, ms);
  requestAnimationFrame(frame);
}
reset('title');
window.__hill = () => state;
window.__hillAudio = () => ({ state: AU.ctx ? AU.ctx.state : 'none', voices: AU.voices, muted: AU.muted });
window.__hillFx = () => fx; // debug hooks (used by verify.py)
window.__hillPerf = () => { const r = { avgFrameMs: +(perf.acc / Math.max(1, perf.frames)).toFixed(2), worstMs: +perf.worst.toFixed(2), frames: perf.frames, fx: Object.fromEntries(Object.entries(fx).map(([k, v]) => [k, v.length])) }; perf.acc = 0; perf.frames = 0; perf.worst = 0; return r; };
requestAnimationFrame(frame);
})();
</script>
