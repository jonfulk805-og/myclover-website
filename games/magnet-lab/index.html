<script>

// ---------- GFX: noise, glow sprites, painted arenas ----------
function layer(w, h, s) {

function fbm(x, y, o) { o = o || 4; let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); n += a; f *= 2; a *= 0.5; } return s / n; }
const RGBC = {};

function glowSprite(rgb, size) {

}
const GLOWC = {};
function glowOf(c) { return GLOWC[c] || (GLOWC[c] = glowSprite(hexRgb(c).join(','), 64)); }
function glowAt(x, y, r, c, a, g) {

}
const SMOKE = [0, 1, 2].map(i => { seed = 50 + i; const size = 96, [c, g] = layer(size, size, 1);
  for (let k = 0; k < 14; k++) { const a = srand() * 6.28, d = srand() * 22, r = 14 + srand() * 20, x = 48 + Math.cos(a) * d, y = 48 + Math.sin(a) * d, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(70,66,74,0.36)'); gr.addColorStop(1, 'rgba(70,66,74,0)'); g.fillStyle = gr; g.fillRect(0, 0, size, size); }
  return c; });
const FIRE = (() => { const [c, g] = layer(64, 64, 1), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,250,225,1)'); gr.addColorStop(0.25, 'rgba(255,200,90,0.9)'); gr.addColorStop(0.55, 'rgba(230,90,20,0.45)'); gr.addColorStop(1, 'rgba(120,20,0,0)');

function pnoise(x, y, p) { // periodic value noise (period p cells) so grain tiles seamlessly

let VIG = null;

  cx.fillStyle = col || '#fff'; cx.fillText(s, x, y);
}
function txtS(s, x, y, size, col, align, weight) { cx.save(); cx.shadowColor = 'rgba(0,0,0,0.85)'; cx.shadowBlur = 8; cx.shadowOffsetY = 2; txt(s, x, y, size, col, align, weight); cx.restore(); }

const liveEl = document.getElementById('live');

  for (let i = 0; i < 4; i++) { const a = -2.356 + i * 1.5708, lx = x + Math.cos(a) * r * 0.5, ly = y + Math.sin(a) * r * 0.5;

// ---------- global game state ----------

// ---------- input: pointer + keyboard ----------

// ---------- SFX + magnet hum + music (all synthesized) ----------
const note = (base, semi) => base * Math.pow(2, semi / 12);
const SFX = {
  select: () => tone(1400, 0.04, 'triangle', 0.05),
  deny: () => { tone(150, 0.14, 'square', 0.07, -40); tone(155, 0.14, 'sawtooth', 0.04); },
  tick: () => tone(3200, 0.012, 'square', 0.02),
  flip: p => { const t = AC.currentTime; noise(0.05, 0.25, p > 0 ? 2600 : 1400, 0, 'bandpass', t, 4); tone(p > 0 ? 520 : 330, 0.12, 'square', 0.05, p > 0 ? 400 : -120, t); tone(p > 0 ? 1560 : 990, 0.08, 'triangle', 0.03, 0, t + 0.02, 'e'); },
  off: () => { const t = AC.currentTime; tone(260, 0.1, 'sine', 0.05, -150, t); noise(0.04, 0.08, 900, 0, 'bandpass', t, 3); },
  clank: v => { const t = AC.currentTime; v = v || 0.3; tone(1800 + Math.random() * 900, 0.12 + v * 0.2, 'triangle', 0.03 + v * 0.08, -300, t); tone(3400 + Math.random() * 800, 0.08, 'sine', 0.02 + v * 0.04, 0, t); noise(0.05, 0.1 + v * 0.3, 3500, 0, 'bandpass', t, 2); if (v > 0.5) tone(90, 0.2, 'sine', v * 0.3, -40, t); },
  core: i => { const t = AC.currentTime; [0, 4, 7, 12].forEach((s, k) => tone(note(784, s + (i || 0) * 2), 0.22, 'triangle', 0.06, 0, t + k * 0.045, 'e')); noise(0.1, 0.12, 9000, 0, 'highpass', t); },
  die: k => { const t = AC.currentTime; duck(0.9, 1.2); if (k) arc(300, 0.35, 0.18, t, 'd', 120); noise(0.5, 0.7, 5000, -4600, 'lowpass', t, 0, 'd'); tone(70, 0.5, 'sine', 0.6, -40, t); tone(600, 0.3, 'sawtooth', 0.06, -500, t, 'd'); },
  win: () => { const t = AC.currentTime; duck(1, 2.4); [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => tone(note(392, s), 0.5, 'square', 0.035, 0, t + i * 0.07, 'e')); tone(49, 1.2, 'sine', 0.4, 0, t); noise(0.8, 0.2, 300, 8000, 'bandpass', t, 1.5); },
  star: k => { const t = AC.currentTime; tone(note(1047, k * 4), 0.3, 'triangle', 0.07, 0, t, 'e'); tone(note(2093, k * 4), 0.2, 'sine', 0.04, 0, t + 0.03); noise(0.08, 0.15, 8000, 0, 'highpass', t); }
};
const sfxLast = {};
function sfx(nm, k) {
  if (!AC || muted || !SFX[nm]) return;
  const t = performance.now(); if (sfxLast[nm] && t - sfxLast[nm] < 40) return;
  sfxLast[nm] = t; SFX[nm](k);
}
function setMute(v) { muted = v; LS.set('mg_mute', v ? '1' : '0'); if (master) master.gain.value = muted ? 0 : VOL; }
function setMusic(v) { musicOn = v; LS.set('mg_music', v ? '1' : '0'); if (musicBus) { musicBus.gain.cancelScheduledValues(0); musicBus.gain.value = v ? 0.55 : 0; } }
// magnet hum: detuned saw pair through a resonant lowpass + slow tremolo; pitch = polarity, brightness = field strength
const HUM = { ready: false };
function humInit() {
  if (HUM.ready || !AC) return; HUM.ready = true;
  const o1 = AC.createOscillator(), o2 = AC.createOscillator(); o1.type = 'sawtooth'; o2.type = 'sawtooth'; o1.frequency.value = 110; o2.frequency.value = 110.7;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500; lp.Q.value = 7;
  const g1 = AC.createGain(); g1.gain.value = 0; const trem = AC.createOscillator(); trem.frequency.value = 7; const tg = AC.createGain(); tg.gain.value = 0.25;

  const f = p > 0 ? 110 : 82.4; HUM.o1.frequency.setTargetAtTime(f * (1 + near * 0.5), t, 0.04); HUM.o2.frequency.setTargetAtTime(f * 1.007 * (1 + near * 0.5), t, 0.04);
  HUM.lp.frequency.setTargetAtTime(300 + near * 1800, t, 0.05); HUM.trem.frequency.setTargetAtTime(5 + near * 14, t, 0.1);

// music: driving synthwave in E minor
const MUS = { next: 0, step: 0, bpm: 108, inten: 0, target: 0, on: false };

  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.001, t + d);

function musicTick() {

// ---------- MAIN LOOP ----------
function update(dt) {
  game.t += dt;
  for (const tm of game.timers) { tm.t -= dt; if (tm.t <= 0 && !tm.fired) { tm.fired = true; tm.fn(); } } game.timers = game.timers.filter(q => !q.fired);
  for (const m of toasts) m.t -= dt; toasts = toasts.filter(m => m.t > 0);
  if (pressed.mute) setMute(!muted);
  musicTick();
  if (game.state === 'title') { if (pressed.start) game.state = 'map'; }
  else if (game.state === 'map') updateMap();
  else if (game.state === 'play') updatePlay(dt);

}
function render() {

  cx.clearRect(0, 0, W, H);
  if (game.state === 'title') drawTitle();
  else if (game.state === 'map') drawMap();
  else if (game.state === 'play') { drawPlay(); if (game.paused && !P.end) drawPause(); }
  toasts.forEach((tt, i) => { cx.globalAlpha = clamp(tt.t / 0.3, 0, 1); txtS(tt.s, W / 2, 100 + i * 24, 15, tt.col, 'center', 900); });

}

}

function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  frame(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__MG = { game, P, LEVELS, PH, save, held, ptr, startLevel, resetRun, step: (k, dt) => { for (let i = 0; i < k; i++) frame(dt || 1 / 60); }, render };
