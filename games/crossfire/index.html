    const dl = AC.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 2600;
    delay.connect(dl); dl.connect(fb); fb.connect(delay); const dOut = AC.createGain(); dOut.gain.value = 0.5; dl.connect(dOut); dOut.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);

}

// ---------- MUSIC: dark synth, intensity follows combat ----------
const MUS = { on: false, int: 0, step: 0, next: 0, bpm: 104 };
const SCALE = [0, 3, 5, 7, 10, 12, 15]; // minor pentatonic-ish
function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
function musicTick() {
  if (!AC || muted || !MUS.on || !musicOn) return;
  const t = AC.currentTime, sp = 60 / MUS.bpm / 4;
  if (MUS.next < t - 0.3) MUS.next = t + 0.05;
  while (MUS.next < t + 0.12) {
    const s = MUS.step % 64, w = MUS.next, I = MUS.int, root = [45, 45, 41, 43][Math.floor(MUS.step / 64) % 4];
    if (s % 16 === 0) tone(midi(root - 12), sp * 15, 'sawtooth', 0.05, 0, w, 'm', 0.4); // drone
    if (s % 4 === 0) { tone(midi(root - 12 + (s % 16 === 8 ? 7 : 0)), sp * 1.6, 'square', 0.035 + I * 0.03, 0, w, 'm'); }
    if (I > 0.15 && s % 8 === 0) { tone(60, 0.22, 'sine', 0.18 + I * 0.15, -30, w, 'm'); } // kick
    if (I > 0.45 && s % 8 === 4) noise(0.12, 0.05 + I * 0.05, 2000, -800, 'bandpass', w, 1, 'm'); // snare
    if (I > 0.3 && s % 2 === 1) noise(0.03, 0.012 + I * 0.015, 8000, 0, 'highpass', w, 0, 'm'); // hats
    if (s % 2 === 0 && (I > 0.55 || s % 8 === 0) && Math.random() < 0.55 + I * 0.3) tone(midi(root + 12 + SCALE[(s * 5 + MUS.step) % 7]), sp * 1.8, 'triangle', 0.025 + I * 0.02, 0, w, 'e');
    if (s === 32 && I < 0.3) tone(midi(root + 24 + 7), sp * 10, 'sine', 0.02, -4, w, 'e', 0.6); // eerie bell
    MUS.step++; MUS.next += sp;
  }
}
