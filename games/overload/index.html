function glowSprite(rgb, size) {

}
const GLOWC = {};
function glowOf(c) { return GLOWC[c] || (GLOWC[c] = glowSprite(hexRgb(c).join(','), 64)); }
function glowAt(x, y, r, c, a, g) {

const SMOKE = [0, 1, 2].map(i => { seed = 50 + i; const size = 96, [c, g] = layer(size, size, 1);
  for (let k = 0; k < 14; k++) { const a = srand() * 6.28, d = srand() * 22, r = 14 + srand() * 20, x = 48 + Math.cos(a) * d, y = 48 + Math.sin(a) * d, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(70,66,74,0.36)'); gr.addColorStop(1, 'rgba(70,66,74,0)'); g.fillStyle = gr; g.fillRect(0, 0, size, size); }
  return c; });
const FIRE = (() => { const [c, g] = layer(64, 64, 1), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,250,225,1)'); gr.addColorStop(0.25, 'rgba(255,200,90,0.9)'); gr.addColorStop(0.55, 'rgba(230,90,20,0.45)'); gr.addColorStop(1, 'rgba(120,20,0,0)');

function pnoise(x, y, p) { // periodic value noise (period p cells) so grain tiles seamlessly

  cx.fillStyle = col || '#fff'; cx.fillText(s, x, y);
}

  cx.fillStyle = lin(cx, 0, y, 0, y + h, [[0, 'rgba(255,255,255,0.08)'], [0.15, 'rgba(255,255,255,0.02)'], [1, 'rgba(255,255,255,0)']]); rrect(cx, x, y, w, h, r); cx.fill();

const liveEl = document.getElementById('live');

// ---------- global game state ----------

// ---------- input: pointer + keyboard ----------

  txt('Score ' + RUN.score + '   \u00b7   Fuses ' + RUN.fuses + '   \u00b7   Best chain ' + RUN.bestChain, 40, 438, 12, 'rgba(255,255,255,0.6)', 'left', 800, MONO);
  button('go', W / 2 - 120, H - 70, 240, 50, 'POWER ON', { col: '#3cff7a', size: 19, sub: 'Level ' + RUN.lv + '  \u00b7  Enter', hot: true, fn: startLevel });
  button('quit', 40, H - 62, 110, 34, 'Quit run', { col: '#ff6a40', size: 12, fn: () => { gameOver(); } });
}
function wrap(s, x, y, w, size, col, lh) {
  cx.font = '700 ' + size + 'px ' + FONT; const words = s.split(' '); let line = '', yy = y;
  for (const wd of words) { const t = line + wd + ' '; if (cx.measureText(t).width > w && line) { txt(line, x, yy, size, col, 'left', 700); line = wd + ' '; yy += lh; } else line = t; }
  txt(line, x, yy, size, col, 'left', 700);
}
function drawOver() {
  backdrop(0.7); game.overT = (game.overT || 0) + 1 / 60;
  const x = W / 2 - 240, y = 70, w = 480, h = 390;
  glass(x, y, w, h, '#ff3040', 0.9, 16);
  metalTxt('SYSTEM FAILURE', W / 2, y + 48, 38, 'center', '#ff3040');
  txt('Reached level ' + RUN.lv + (RUN.startLv > 1 ? ' (started at ' + RUN.startLv + ')' : ''), W / 2, y + 86, 14, 'rgba(255,255,255,0.75)', 'center', 800);
  txt('SCORE', W / 2, y + 126, 12, '#ffd23f', 'center', 900, MONO);
  cx.save(); cx.shadowColor = '#ffd23f'; cx.shadowBlur = 16; txt(String(RUN.score), W / 2, y + 160, 40, '#fff', 'center', 900, MONO); cx.restore();
  if (RUN.newBest) txt('NEW BEST', W / 2, y + 192, 13, '#ffd23f', 'center', 900, MONO); else txt('Best ' + save.best, W / 2, y + 192, 12, 'rgba(255,255,255,0.5)', 'center', 800, MONO);
  [['Parts popped', RUN.pops], ['Parts dropped', RUN.drops], ['Best chain', RUN.bestChain]].forEach(([k, v], i) => { txt(k, x + 120, y + 228 + i * 24, 13, 'rgba(255,255,255,0.7)', 'left', 700); txt(String(v), x + w - 120, y + 228 + i * 24, 13, '#fff', 'right', 900, MONO); });
  button('again', W / 2 + 10, y + h - 64, 180, 44, 'REBOOT', { col: '#3cff7a', size: 17, sub: 'new run \u00b7 Enter', fn: () => newRun(1) });
  button('menu', W / 2 - 190, y + h - 64, 180, 44, 'Title', { col: '#7fe0e8', size: 15, fn: () => { game.state = 'title'; } });
}
function drawPause() {
  cx.fillStyle = 'rgba(0,4,6,0.72)'; cx.fillRect(0, 0, W, H);
  glass(W / 2 - 160, 130, 320, 280, '#7fe0e8', 0.92, 16);
  metalTxt('PAUSED', W / 2, 172, 30, 'center');
  button('resume', W / 2 - 120, 206, 240, 42, 'Resume', { col: '#3cff7a', fn: () => { game.paused = false; } });
  button('restart', W / 2 - 120, 256, 116, 36, 'Restart level', { col: '#ffd23f', size: 12, fn: () => { game.paused = false; restartLevel(); } });
  button('quit', W / 2 + 4, 256, 116, 36, 'Quit run', { col: '#ff6a40', size: 12, fn: () => { game.paused = false; gameOver(); } });
  button('snd', W / 2 - 120, 300, 116, 34, muted ? 'Sound off' : 'Sound on', { col: '#7fe0e8', size: 12, fn: () => setMute(!muted) });
  button('mus', W / 2 + 4, 300, 116, 34, musicOn ? 'Music on' : 'Music off', { col: '#7fe0e8', size: 12, fn: () => setMusic(!musicOn) });
  button('rm', W / 2 - 120, 342, 240, 30, RMOTION ? 'Reduced motion: on' : 'Reduced motion: off', { col: '#7fe0e8', size: 11, fn: () => { RMOTION = !RMOTION; LS.set('ov_rm', RMOTION ? '1' : '0'); } });
  txt('Restarting costs no fuse, but resets the level score.', W / 2, 390, 10, 'rgba(255,255,255,0.5)', 'center', 700);
}
function drawPlay() {
  backdrop(0);
  cx.save(); cx.translate(game.fox, game.foy);
  drawField(); drawAim(); drawFX(); drawShot(); drawLauncher();
  cx.restore();
  drawPanels(); drawBanners(); drawToasts();
}
function drawToasts() {
  toasts.forEach((m, i) => { const a = Math.min(1, m.t * 3, (m.max - m.t) * 6 + 0.2), y = 330 + i * 30;
    cx.save(); cx.globalAlpha = a; cx.font = '900 13px ' + FONT; const w = cx.measureText(m.s).width + 30;
    cx.fillStyle = 'rgba(0,0,0,0.7)'; rrect(cx, LX - w / 2, y - 13, w, 26, 13); cx.fill(); cx.strokeStyle = rgba(m.col, 0.8); cx.lineWidth = 1.2; cx.stroke();
    txt(m.s, LX, y, 13, m.col, 'center', 900); cx.restore(); });
}

// ---------- MAIN LOOP ----------
function update(dt) {
  game.t += dt;
  for (const tm of game.timers) { tm.t -= dt; if (tm.t <= 0 && !tm.fired) { tm.fired = true; tm.fn(); } } game.timers = game.timers.filter(q => !q.fired);
  for (const m of toasts) m.t -= dt; toasts = toasts.filter(m => m.t > 0);
  if (pressed.mute) setMute(!muted);
  musicTick();
  if (game.state === 'title') { MUS.on = true; MUS.target = 0.4; MUS.boss = false; if (pressed.start || pressed.fire) newRun(1); }
  else if (game.state === 'shop') { MUS.on = true; MUS.target = 0.2; if (pressed.start) startLevel(); }
  else if (game.state === 'over') { if (pressed.start) newRun(1); }
  else if (game.state === 'play') {
    if (pressed.pause && G.phase !== 'dead') game.paused = !game.paused;
    if (game.paused) return;
    updatePlay(dt);
  }
  game.shake = Math.max(0, game.shake - dt * 40); game.flash = Math.max(0, game.flash - dt * 2.5);
  const sh = RMOTION ? game.shake * 0.25 : game.shake;
  game.fox = (Math.random() - 0.5) * sh; game.foy = (Math.random() - 0.5) * sh;
}
function render() {
  UI = [];
  cx.setTransform(SC, 0, 0, SC, 0, 0);
  cx.clearRect(0, 0, W, H);
  if (game.state === 'title') drawTitle();
  else if (game.state === 'shop') drawShop();
  else if (game.state === 'over') drawOver();
  else if (game.state === 'play') { drawPlay(); if (game.paused) drawPause(); }
  if (game.flash > 0) { cx.save(); cx.globalCompositeOperation = 'lighter'; cx.globalAlpha = game.flash * 0.5; cx.fillStyle = game.flashCol; cx.fillRect(0, 0, W, H); cx.restore(); }
  vignette();
  UIprev = UI;
  const aiming = game.state === 'play' && !game.paused && ptr.x > FX && ptr.x < FX + FW && ptr.y < LY;
  cv.style.cursor = aiming ? 'crosshair' : 'default';
}
cv.addEventListener('pointerdown', () => { ptr.consumed = false; }, true);
function frame(dt) {
  if (pressed.click && processClicks()) { ptr.consumed = true; }
  if (ptr.consumed) pressed.up = false;
  update(dt);
  for (const k in pressed) pressed[k] = false;
}
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  frame(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// test hooks
window.__OV = { game, get G() { return G; }, get RUN() { return RUN; }, newRun, startLevel, trace, fire, step: (n, dt) => { for (let i = 0; i < n; i++) frame(dt || 1 / 60); }, render, ptr, pressed, held, eachCell, flood, cellX, cellY, presentColors, floating, nbrs, armSpecial, swapAmmo, levelDef, buyUp, UPG };

})();
