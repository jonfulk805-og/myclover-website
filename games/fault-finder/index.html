// ---------- TITLE / JOB MAP / PAUSE ----------
let DEMO = null;

}
const MAPI = { focus: 0 };
function drawMap(dt) {
  drawDemoBoard(dt); cx.fillStyle = 'rgba(3,5,4,0.82)'; cx.fillRect(0, 0, W, H);

  txt(totalStars() + ' / ' + LEVELS.length * 3 + ' \u2605   \u00b7   bank $' + save.bank.toFixed(0), 280, 36, 14, '#ffd23f', 'left', 900, MONO);

function updateMap() {

// ---------- MAIN LOOP ----------
function update(dt) {

  else if (game.state === 'map') updateMap();
  else if (game.state === 'bench') { if (game.paused) { if (pressed.pause || KP.Escape) game.paused = false; } else updateBench(dt); }

}
let lastDt = 1 / 60;
function render() {

}
cv.addEventListener('pointerdown', () => { ptr.consumed = false; }, true);
