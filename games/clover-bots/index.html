const MUS = { on: true, int: 0.15, step: 0, next: 0, bpm: 140 };

  while (MUS.next < t + 0.12) {
    const s = MUS.step % 16, w = MUS.next, I = MUS.int, bar = Math.floor(MUS.step / 16) % 8, root = [40, 40, 43, 38, 40, 40, 45, 43][bar];

}
