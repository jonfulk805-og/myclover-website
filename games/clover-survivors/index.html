function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
 const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=12;comp.ratio.value=6;comp.attack.value=0.003;comp.release.value=0.2;
 MG=AC.createGain();MG.gain.value=muted?0:0.7;MG.connect(comp);comp.connect(AC.destination);
 noiseBuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);}
const sfxLast={};
function canPlay(k,gap){const t=performance.now();if(sfxLast[k]&&t-sfxLast[k]<gap)return false;sfxLast[k]=t;return true}
function tone(f0,f1,dur,type,vol,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+0.02)}
function noise(dur,freq,vol,q,type,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type=type||'lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,freq*0.25),t+dur);f.Q.value=q||1;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+dur+0.02)}

 g.fillStyle=metal(g,0,0,13,'#e8f4ff','#3b4a5c');g.beginPath();g.arc(0,0,12,0,TAU);g.fill();

 g.fillStyle=metal(g,0,0,11,'#b7c2cc','#3a4550');g.beginPath();g.arc(0,0,10,0,TAU);g.fill();g.fillRect(6,-3,16,6);g.fillStyle='#f40';g.shadowColor='#f40';g.shadowBlur=6;g.fillRect(-3,-2,6,4)});

 g.fillStyle='#222';g.fillRect(4,-3,14,6);g.fillStyle='#ff4af0';g.shadowColor='#f4f';g.shadowBlur=8;g.beginPath();g.arc(0,0,5,0,TAU);g.fill()});
SPR.splitter=mk(44,(g)=>{g.fillStyle=metal(g,0,0,18,'#7affd8','#0a4a44');for(let i=0;i<3;i++){const a=i*TAU/3;g.beginPath();g.arc(Math.cos(a)*7,Math.sin(a)*7,10,0,TAU);g.fill()}g.strokeStyle='#033';g.lineWidth=1.5;g.beginPath();g.arc(0,0,17,0,TAU);g.stroke();g.fillStyle='#fff';g.shadowColor='#0ff';g.shadowBlur=8;g.beginPath();g.arc(0,0,4,0,TAU);g.fill()});
SPR.mboss=mk(110,(g)=>{g.shadowColor='#f30';g.shadowBlur=14;g.fillStyle=metal(g,0,0,40,'#ff9a5a','#5a1000');g.beginPath();for(let i=0;i<8;i++){const a=i*TAU/8;g.lineTo(Math.cos(a)*42,Math.sin(a)*42);g.lineTo(Math.cos(a+TAU/16)*32,Math.sin(a+TAU/16)*32)}g.closePath();g.fill();g.shadowBlur=0;
 g.fillStyle=metal(g,0,0,20,'#ccd','#334');g.beginPath();g.arc(0,0,20,0,TAU);g.fill();g.fillStyle='#ff0';g.shadowColor='#ff0';g.shadowBlur=12;g.beginPath();g.arc(0,0,8,0,TAU);g.fill()});
SPR.boss=mk(190,(g)=>{g.shadowColor='#f0f';g.shadowBlur=20;g.fillStyle=metal(g,0,0,75,'#9a8aff','#14063a');g.beginPath();g.arc(0,0,72,0,TAU);g.fill();g.shadowBlur=0;
 g.strokeStyle='#4a2aaa';g.lineWidth=4;for(let i=0;i<12;i++){const a=i*TAU/12;g.beginPath();g.moveTo(Math.cos(a)*40,Math.sin(a)*40);g.lineTo(Math.cos(a)*70,Math.sin(a)*70);g.stroke()}
 g.fillStyle=metal(g,0,0,38,'#e0e8ff','#223');g.beginPath();g.arc(0,0,36,0,TAU);g.fill();g.fillStyle='#f22';g.shadowColor='#f22';g.shadowBlur=18;g.beginPath();g.arc(0,0,16,0,TAU);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(-4,-4,5,0,TAU);g.fill()});
