const RGBC = {};

function glowSprite(rgb, size) {

}
const GLOWC = {};
function glowOf(c) { return GLOWC[c] || (GLOWC[c] = glowSprite(hexRgb(c).join(','), 64)); }
function glowAt(x, y, r, c, a, g) {
  g = g || cx; g.globalCompositeOperation = 'lighter'; g.globalAlpha = a == null ? 1 : a;

}
const SMOKE = [0, 1, 2].map(i => { seed = 50 + i; const size = 96, [c, g] = layer(size, size, 1);
  for (let k = 0; k < 14; k++) { const a = srand() * 6.28, d = srand() * 22, r = 14 + srand() * 20, x = 48 + Math.cos(a) * d, y = 48 + Math.sin(a) * d, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(70,66,74,0.36)'); gr.addColorStop(1, 'rgba(70,66,74,0)'); g.fillStyle = gr; g.fillRect(0, 0, size, size); }
  return c; });
const FIRE = (() => { const [c, g] = layer(64, 64, 1), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,250,225,1)'); gr.addColorStop(0.25, 'rgba(255,200,90,0.9)'); gr.addColorStop(0.55, 'rgba(230,90,20,0.45)'); gr.addColorStop(1, 'rgba(120,20,0,0)');

function pnoise(x, y, p) { // periodic value noise (period p cells) so grain tiles seamlessly

  cx.fillStyle = col || '#fff'; cx.fillText(s, x, y);

const liveEl = document.getElementById('live');

// ---------- global game state ----------

// ---------- structure builders (meters -> pixels at build time) ----------
const GY = 446; // ground line in structure scenes
function frameBuild(o) {
  // o: {x0 (px), ppm, bays[], floors[], mat, thick (col thickness 1-3 or fn(ci,fi)), core:{bay, floors:[a,b], thick}, slotFloors:[0], roofY}
  const ppm = o.ppm, nodes = [], mem = [], panels = [], cols = o.bays.length + 1, rows = o.floors.length + 1;
  const xs = [o.x0]; o.bays.forEach(b => xs.push(xs[xs.length - 1] + b * ppm));
  const ys = [GY]; o.floors.forEach(f => ys.push(ys[ys.length - 1] - f * ppm));
  const id = (c, r) => r * cols + c;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) nodes.push({ x: xs[c], y: ys[r], px: xs[c], py: ys[r], pin: r === 0, m: 1, c, r });
  const add = (a, b, kind, mat, thick, extra) => { const A = nodes[a], B = nodes[b]; const m = Object.assign({ a, b, len: Math.hypot(A.x - B.x, A.y - B.y), kind, mat, thick, alive: true }, extra || {}); mem.push(m); return mem.length - 1; };
  const slots = [], pre = [];
  for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols; c++) {
    const th = typeof o.thick === 'function' ? o.thick(c, r) : o.thick;
    const mi = add(id(c, r), id(c, r + 1), 'col', o.mat, th, { ci: c, fi: r });
    if ((o.slotFloors || [0]).includes(r)) slots.push(mi);
  }
  for (let r = 1; r < rows; r++) for (let c = 0; c < cols - 1; c++) add(id(c, r), id(c + 1, r), 'beam', o.mat, 2, { bi: c, fi: r });
  for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {
    const core = o.core && o.core.bays.includes(c) && r >= o.core.floors[0] && r <= o.core.floors[1];
    const kind = core ? 'wall' : 'joint', th = core ? o.core.thick : 1;
    const d1 = add(id(c, r), id(c + 1, r + 1), kind, o.mat, th, { bi: c, fi: r });
    const d2 = add(id(c + 1, r), id(c, r + 1), kind, o.mat, th, { bi: c, fi: r });
    if (core) { pre.push(d1); mem[d1].pair = d2; mem[d2].pair = d1; mem[d2].hidden = true; }
    panels.push({ n: [id(c, r), id(c + 1, r), id(c + 1, r + 1), id(c, r + 1)], fi: r, bi: c, core, seed: c * 7 + r * 13 });
  }
  return { nodes, mem, panels, slots, pre, H0: GY - ys[rows - 1], x0: xs[0], x1: xs[cols - 1], type: 'frame', mat: o.mat, ppm };
}
function stackBuild(o) {
  // brick chimney: two node columns, rungs + X braces; slots: base right / base notch / base left
  const ppm = o.ppm, nodes = [], mem = [], n = o.segs, h = o.h * ppm / n;
  for (let i = 0; i <= n; i++) { const t = i / n, w = (o.wb + (o.wt - o.wb) * t) * ppm / 2;
    nodes.push({ x: o.x - w, y: GY - i * h, px: o.x - w, py: GY - i * h, pin: i === 0, m: 1, r: i });
    nodes.push({ x: o.x + w, y: GY - i * h, px: o.x + w, py: GY - i * h, pin: i === 0, m: 1, r: i }); }
  const add = (a, b, kind, extra) => { const A = nodes[a], B = nodes[b]; mem.push(Object.assign({ a, b, len: Math.hypot(A.x - B.x, A.y - B.y), kind, mat: 'brick', thick: 2, alive: true }, extra || {})); return mem.length - 1; };
  const slots = [];
  for (let i = 0; i < n; i++) {
    const L = add(i * 2, i * 2 + 2, 'col', { side: 'L', seg: i }), R = add(i * 2 + 1, i * 2 + 3, 'col', { side: 'R', seg: i });
    add(i * 2 + 2, i * 2 + 3, 'beam', { seg: i });
    const d1 = add(i * 2, i * 2 + 3, 'joint', { seg: i, stackBrace: 1 }), d2 = add(i * 2 + 1, i * 2 + 2, 'joint', { seg: i, stackBrace: 1 });
    if (i === 0) { slots.push(L); slots.push(R); mem[d1].thick = 2; mem[d2].thick = 2; mem[d1].kind = 'notch'; mem[d2].kind = 'notch'; mem[d1].pair = d2; mem[d2].hidden = true; slots.splice(1, 0, d1); }
  }
  return { nodes, mem, panels: [], slots, pre: [], H0: o.h * ppm, x0: o.x - o.wb * ppm / 2, x1: o.x + o.wb * ppm / 2, type: 'stack', mat: 'brick', ppm };
}

      const px = x + 20 + j * 18, py = y + 24 + (rows - 1 - r) * 16; cx.fillStyle = pl.ord === 'none' ? '#333' : done ? (age < 30 ? '#fff6c0' : '#ff9a1f') : '#4a4f56'; cx.beginPath(); cx.arc(px, py, done && age < 30 ? 6 : 4, 0, 6.283); cx.fill(); } });

}
function drawResult() {

// ---------- MAIN LOOP ----------
function update(dt) {
  game.t += dt;
  for (const tm of game.timers) { tm.t -= dt; if (tm.t <= 0 && !tm.fired) { tm.fired = true; tm.fn(); } } game.timers = game.timers.filter(q => !q.fired);
  for (const m of toasts) m.t -= dt; toasts = toasts.filter(m => m.t > 0);

    if (game.paused) { if (pressed.pause) game.paused = false; return; }

function frame(dt) {
