function S(k, o) { return Object.assign({ k }, STEPLIB[k], o || {}); }
function buildSteps(r, o) {
  o = o || {}; const f = r.fish ? FISH[r.fish] : null, st = [];
  if (r.type === 'nigiri') {
    st.push(S('neta', { tool: 'case:' + r.fish, how: 'Take the ' + f.jp + ' (' + f.en.toLowerCase() + ') saku from the neta case. ' + f.note }));
    if (r.fish === 'ebi') { /* pre-cooked and butterflied */ }
    else if (r.fish === 'tamago') st.push(S('slice', { term: 'Hira-giri', kanji: '平切り', style: 'hira', n: r.kan, mm: 9, how: 'Tamago is cut straight down in thick slices (about 8-10 mm). One clean pull, top to bottom.' }));
    else if (r.fish === 'hotate') st.push(S('slice', { term: 'Sogi-giri', kanji: 'そぎ切り', style: 'sogi', n: r.kan, mm: 6, how: 'Butterfly-thin the scallop with an angled sogi-giri cut, about 5-7 mm. Pull the whole blade toward you in ONE stroke.' }));
    else st.push(S('slice', { term: 'Sogi-giri', kanji: 'そぎ切り', style: 'sogi', n: r.kan, mm: 6, how: 'Cut the neta at an angle (sogi-giri), about 5-7 mm thick, against the grain. Start at the heel of the yanagiba and pull the whole blade toward you in ONE stroke. No sawing.' }));
    st.push(S('tezu'));
    st.push(S('shari', { lo: 15, hi: 20, rate: 13, how: 'Take about 15-20 g of shari per piece (nigiri-sized: a loose oblong). Hold to gather, release on target.' }));
    if (r.fish !== 'tamago' && r.fish !== 'unagi' && !o.sabinuki) st.push(S('wasabi', { how: 'Dab a small amount of wasabi on the underside of the neta with your index finger. It sits between fish and rice.' }));
    st.push(S('form', { kind: 'nigiri', how: 'Squeeze the shari lightly into an oblong, set it on the neta, press a dimple with your thumb, flip it (kote-gaeshi) and finish with two fingers. Firm outside, airy inside.' }));
    if (r.fish === 'unagi') st.push(S('tare', { how: 'Brush the eel with tare, the sweet soy glaze. No wasabi: the sauce does the work.' }));
    if (r.fish === 'tamago') st.push(S('obi'));
  } else if (r.type === 'hoso' || r.type === 'ura') {
    const ura = r.type === 'ura';
    st.push(S('nori', { how: 'Lay a half sheet of nori on the makisu, long side toward you.' + (ura ? ' For ura-maki the makisu is wrapped in plastic film so rice will not stick.' : '') + ' Which side faces up for the rice?' }));
    st.push(S('tezu'));
    st.push(ura ? S('shari', { lo: 110, hi: 130, rate: 70, how: 'An ura-maki half sheet takes about 110-130 g of shari. Hold to gather, release on target.' })
      : S('shari', { lo: 80, hi: 100, rate: 52, how: 'A hosomaki takes about 80-100 g of shari. Hold to gather, release on target.' }));
    st.push(S('spread', { full: ura, how: ura ? 'Spread the shari evenly over the WHOLE sheet, edge to edge. Light fingertips; never mash the grains.' : 'Spread the shari evenly, but leave about 1 cm of bare nori along the far edge. That strip seals the roll.' }));
    if (ura) st.push(S('top', { tool: 'top:' + r.top, term: TOPS[r.top].jp, kanji: TOPS[r.top].kanji, how: 'Sprinkle ' + TOPS[r.top].jp.toLowerCase() + ' (' + TOPS[r.top].en.toLowerCase() + ') over the rice. It ends up on the outside of the roll.' }));
    if (ura) st.push(S('flip'));
    if (!ura && !o.sabinuki) st.push(S('wasabi', { line: true, how: 'Swipe a thin line of wasabi across the middle of the rice.' }));
    st.push(S('gu', { need: r.gu.slice(), how: 'Lay the filling (gu) in a line across the ' + (ura ? 'middle of the nori' : 'middle of the rice') + ': ' + r.gu.map(g => GU[g].jp + ' (' + GU[g].en.toLowerCase() + ')').join(', ') + '. Pick each from the gu tray, then click the line.' }));
    st.push(S('roll', { ura, how: 'Lift the near edge of the makisu, roll it over the filling and tuck it down so the near edge meets the far rice line. Then squeeze (shime) to set the shape.' }));
    st.push(S('fukin'));
    st.push(S('cut', { pieces: ura ? 8 : 6, how: ura ? 'Cut the roll in half, line the halves up, then cut into quarters: 8 pieces. One pull per cut.' : 'Cut the roll in half, line the halves up, then cut into thirds: 6 pieces. One pull per cut.' }));
  } else if (r.type === 'gunkan') {
    st.push(S('tezu'));
    st.push(S('shari', { lo: 14, hi: 18, rate: 12, how: 'Gunkan shari is a little smaller: about 14-18 g, shaped into an oval.' }));
    st.push(S('form', { kind: 'gunkan', term: 'Nigiru', kanji: '握る', how: 'Form a neat oval of shari with one gentle squeeze. It must stand on its own.' }));
    st.push(S('wrap', { how: 'Wrap a strip of nori (about 3 cm tall) around the shari so it rises above the rice like the hull of a ship. Circle the rice to wrap.' }));
    st.push(S('spoon', { tool: 'case:' + r.top, term: 'Ikura', kanji: 'いくら', how: 'Spoon ikura into the boat from the neta case. Fill to the rim with a small dome. Hold to spoon, release on target.' }));
  } else if (r.type === 'sashimi') {
    st.push(S('neta', { tool: 'case:' + r.fish, how: 'Take the ' + f.jp + ' (' + f.en.toLowerCase() + ') saku from the neta case. ' + f.note }));
    st.push(S('slice', { term: 'Hira-zukuri', kanji: '平造り', style: 'hira', n: r.n, mm: 10, how: 'Hira-zukuri: straight rectangular slices about 1 cm thick. One long pull per slice, then slide the slice to the right.' }));
    st.push(S('garnish'));
    if (!o.sabinuki) st.push(S('wasabi', { side: true, how: 'Sashimi gets a small mound of wasabi on the side of the plate, not on the fish.' }));
  }
  st.push(S('geta'));
  return st;
}

// ---------- rice texture ----------
let RICE = null, RICE_PAT = null, RICE_PAT_CX = null;
function riceTex() {
  if (RICE) return RICE;
  const N = 96, s = 2, [c, g] = layer(N, N, s); seed = 77;
  g.fillStyle = '#e9e3d4'; g.fillRect(0, 0, N, N);
  for (let k = 0; k < 520; k++) {
    const x = srand() * N, y = srand() * N, a = srand() * 3.14, l = 2.6 + srand() * 1.2;
    for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) {
      const X = x + ox, Y = y + oy; if (X < -6 || X > N + 6 || Y < -6 || Y > N + 6) continue;
      g.save(); g.translate(X, Y); g.rotate(a);
      g.fillStyle = 'rgba(120,110,90,0.35)'; g.beginPath(); g.ellipse(0.5, 0.7, l, 1.55, 0, 0, 6.29); g.fill();
      const v = 236 + srand() * 19 | 0; g.fillStyle = 'rgb(' + v + ',' + (v - 3) + ',' + (v - 12) + ')'; g.beginPath(); g.ellipse(0, 0, l, 1.45, 0, 0, 6.29); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.8)'; g.beginPath(); g.ellipse(-0.6, -0.4, l * 0.5, 0.5, 0, 0, 6.29); g.fill();
      g.restore();
    }
  }

}
function ricePat(g) {

  const p = g.createPattern(riceTex(), 'repeat');
  try { p.setTransform(new DOMMatrix().scale(0.5)); } catch (e) { }

  return p;
}
function shariBlob(g, x, y, rx, ry, rot) {
  g.save(); g.translate(x, y); if (rot) g.rotate(rot);
  g.fillStyle = 'rgba(40,25,10,0.28)'; g.beginPath(); g.ellipse(2, ry * 0.45, rx * 1.02, ry * 0.8, 0, 0, 6.29); g.fill();

  g.fillRect(-rx - 2, -ry - 2, rx * 2 + 4, ry * 2 + 4); g.restore();

  g.restore();
}

    g.fillStyle = lin(g, 0, 0, 0, h, [[0, '#e0585e'], [0.1, 'rgba(230,140,140,0.6)'], [0.2, 'rgba(230,180,180,0)']]); g.fillRect(0, 0, w, h); }

  else if (f === 'ebi') { base('#fff2ea', '#fff'); for (let i = 0; i < 7; i++) { const yy = i / 7 * w; g.fillStyle = lin(g, yy, 0, yy + w / 7, 0, [[0, 'rgba(255,90,40,0)'], [0.5, 'rgba(255,90,40,0.85)'], [1, 'rgba(255,90,40,0)']]); g.fillRect(yy, 0, w / 7, h); } }
  else if (f === 'unagi') { base('#5e2e12', '#8a4a1c'); g.save(); g.globalAlpha = 0.6; g.strokeStyle = '#2a1206'; g.lineWidth = 3; for (let i = -2; i < w / 12 + 2; i++) { g.beginPath(); g.moveTo(i * 12, 0); g.lineTo(i * 12 + h * 0.6, h); g.stroke(); } g.restore();
    g.fillStyle = lin(g, 0, 0, 0, h, [[0, 'rgba(255,220,150,0.35)'], [0.3, 'rgba(255,220,150,0)'], [1, 'rgba(0,0,0,0.2)']]); g.fillRect(0, 0, w, h); }
  else if (f === 'tamago') { base('#ffd84d', '#ffc93a'); g.save(); g.globalAlpha = 0.35; g.strokeStyle = '#d99a1f'; g.lineWidth = 1; for (let y = 4; y < h; y += 5 + srand() * 3) { g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= w; x += 6) g.lineTo(x, y + Math.sin(x * 0.1 + y) * 0.8); g.stroke(); } g.restore();

const SKIN = ['#f6d3b3', '#eabf98', '#d9a477', '#b97f55', '#8d5a36', '#5f3a22'];
const HAIRC = ['#1b1410', '#2e1d12', '#5a3a1e', '#8a5a2b', '#c9a060', '#e8e0d0', '#b23a2a', '#3a3a44'];

function makeLook() {
  return { skin: pick(SKIN), hair: pick(HAIRC), shirt: pick(SHIRT), style: RI(0, 6), glasses: Math.random() < 0.25, tie: Math.random() < 0.2, hat: Math.random() < 0.12, w: RND(0.92, 1.1), h: RND(0.95, 1.06), eye: RI(0, 2) };

function drawCustomer(g, L, x, mood, t, anim) {

  g.save(); g.translate(x, bob);

  g.fillStyle = lin(g, x - tw, 0, x + tw, 0, [[0, shade(L.shirt, -0.4)], [0.5, L.shirt], [1, shade(L.shirt, -0.45)]].map(q => q)) ;
  g.fillStyle = lin(g, -tw, 0, tw, 0, [[0, shade(L.shirt, -0.45)], [0.45, shade(L.shirt, 0.08)], [1, shade(L.shirt, -0.5)]]);

  // collar / neck
  g.fillStyle = shade(L.skin, -0.18); rrect(g, -8, by - 62 * s, 16, 16, 5); g.fill();
  if (L.tie) { g.fillStyle = '#e8e8ee'; g.beginPath(); g.moveTo(-14, by - 50 * s); g.lineTo(0, by - 38 * s); g.lineTo(14, by - 50 * s); g.closePath(); g.fill(); g.fillStyle = '#8a1f2a'; g.beginPath(); g.moveTo(-3, by - 44 * s); g.lineTo(3, by - 44 * s); g.lineTo(5, by - 6); g.lineTo(0, by + 2); g.lineTo(-5, by - 6); g.closePath(); g.fill(); }
  else { g.strokeStyle = shade(L.shirt, 0.3); g.lineWidth = 2; g.beginPath(); g.moveTo(-10, by - 50 * s); g.quadraticCurveTo(0, by - 42 * s, 10, by - 50 * s); g.stroke(); }
  // head

  if (L.style === 3 || L.style === 5) { g.fillStyle = shade(L.hair, -0.2); g.beginPath(); g.ellipse(0, hy + 10, hr + 6, hr + 14, 0, 0, 6.29); g.fill(); } // long hair behind
  g.fillStyle = radg(g, -6, hy - 8, 2, 0, hy, hr * 1.2, [[0, shade(L.skin, 0.12)], [0.7, L.skin], [1, shade(L.skin, -0.25)]]);
  g.beginPath(); g.ellipse(0, hy, hr, hr * 1.12, 0, 0, 6.29); g.fill();
  g.fillStyle = shade(L.skin, -0.15); g.beginPath(); g.ellipse(-hr, hy + 2, 4, 6, 0, 0, 6.29); g.ellipse(hr, hy + 2, 4, 6, 0, 0, 6.29); g.fill();
  // hair styles
  g.fillStyle = L.hair;
  if (L.style === 0) { g.beginPath(); g.ellipse(0, hy - 9, hr + 1, hr * 0.72, 0, Math.PI, 0); g.fill(); g.fillRect(-hr - 1, hy - 10, 5, 10); g.fillRect(hr - 4, hy - 10, 5, 10); }
  else if (L.style === 1) { g.beginPath(); g.ellipse(0, hy - 7, hr + 3, hr * 0.85, 0, Math.PI * 0.95, Math.PI * 2.05); g.fill(); g.beginPath(); g.moveTo(-hr - 2, hy - 6); g.quadraticCurveTo(-4, hy - 4, 6, hy - 16); g.quadraticCurveTo(hr, hy - 10, hr + 2, hy - 6); g.lineTo(hr + 2, hy - 14); g.lineTo(-hr - 2, hy - 14); g.fill(); }
  else if (L.style === 2) { g.beginPath(); g.ellipse(0, hy - 12, hr * 0.9, hr * 0.45, 0, Math.PI, 0); g.fill(); } // short/buzz
  else if (L.style === 3) { g.beginPath(); g.ellipse(0, hy - 8, hr + 3, hr * 0.8, 0, Math.PI, 0); g.fill(); g.fillRect(-hr - 3, hy - 8, 7, 34); g.fillRect(hr - 4, hy - 8, 7, 34); }
  else if (L.style === 4) { g.beginPath(); g.ellipse(0, hy - 9, hr + 1, hr * 0.7, 0, Math.PI, 0); g.fill(); g.beginPath(); g.arc(0, hy - hr - 6, 9, 0, 6.29); g.fill(); } // bun
  else if (L.style === 5) { g.beginPath(); g.ellipse(0, hy - 8, hr + 4, hr * 0.85, 0, Math.PI, 0); g.fill(); g.beginPath(); g.moveTo(-hr - 4, hy - 8); g.quadraticCurveTo(-hr + 4, hy + 2, -6, hy - 10); g.lineTo(-hr - 4, hy - 14); g.fill(); }
  else if (L.style === 6) { g.fillStyle = shade(L.skin, 0.05); g.beginPath(); g.ellipse(-3, hy - 12, 7, 4, -0.3, 0, 6.29); g.fillStyle = 'rgba(255,255,255,0.25)'; g.fill(); g.fillStyle = L.hair; g.fillRect(-hr - 1, hy - 4, 4, 8); g.fillRect(hr - 3, hy - 4, 4, 8); } // bald
  if (L.hat) { g.fillStyle = shade(L.shirt, -0.2); g.beginPath(); g.ellipse(0, hy - 12, hr + 2, hr * 0.62, 0, Math.PI, 0); g.fill(); g.fillRect(-hr - 2, hy - 13, hr * 2 + 14, 4); }
  // face
  const blink = (Math.sin(t * 0.9 + x * 0.1) > 0.985) ? 0.15 : 1, ey = hy + 1, mo = clamp(mood, 0, 1);
  g.fillStyle = '#1a1210';
  if (anim && anim.happy > 0) { g.strokeStyle = '#1a1210'; g.lineWidth = 1.8; for (const ex of [-7, 7]) { g.beginPath(); g.arc(ex, ey + 2, 3.2, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); } }
  else for (const ex of [-7, 7]) { g.beginPath(); g.ellipse(ex, ey, 2.2, 2.8 * blink, 0, 0, 6.29); g.fill(); }
  g.strokeStyle = shade(L.hair, 0.1); g.lineWidth = 1.6;
  const bA = (0.5 - mo) * 0.6;
  for (const ex of [-7, 7]) { g.beginPath(); g.moveTo(ex - 4, ey - 6 + (ex < 0 ? -bA * 6 : bA * 6) * 0.3 * Math.sign(ex)); g.lineTo(ex + 4, ey - 6 - (ex < 0 ? -bA * 6 : bA * 6) * 0.3 * Math.sign(ex)); g.stroke(); }
  if (L.glasses) { g.strokeStyle = '#222'; g.lineWidth = 1.3; g.beginPath(); g.arc(-7, ey, 5.2, 0, 6.29); g.moveTo(12.2, ey); g.arc(7, ey, 5.2, 0, 6.29); g.moveTo(-1.8, ey); g.lineTo(1.8, ey); g.stroke(); }
  g.strokeStyle = '#6a2a22'; g.lineWidth = 1.8; g.beginPath();
  const my = hy + 12, curve = (mo - 0.45) * 9;
  if (anim && anim.eat > 0) { g.fillStyle = '#5a1a14'; g.beginPath(); g.ellipse(0, my, 3.5, 2 + Math.abs(Math.sin(anim.eat * 14)) * 2.5, 0, 0, 6.29); g.fill(); }
  else { g.moveTo(-6, my); g.quadraticCurveTo(0, my + curve, 6, my); g.stroke(); }
  if (mo > 0.7) { g.fillStyle = 'rgba(255,120,120,0.25)'; g.beginPath(); g.arc(-12, hy + 7, 4, 0, 6.29); g.arc(12, hy + 7, 4, 0, 6.29); g.fill(); }
  if (mo < 0.25) { g.fillStyle = 'rgba(120,200,255,0.8)'; g.beginPath(); g.ellipse(hr - 2, hy - 10, 2.5, 4, 0, 0, 6.29); g.fill(); }
  g.restore();
}

// ---------- STATION: orders, steps, tool clicks, minigames ----------
const PXMM = 4; // board scale for slicing: 4 px per mm
const BC = { x: BOARD.x + BOARD.w / 2, y: BOARD.y + BOARD.h / 2 };
const SHEET = { x: BOARD.x + 78, y: BOARD.y + 50, w: 300, h: 150 };
let M = null; // session (shift / lesson / demo)
let FX = []; // particles
function puff(x, y, col, n, sp, life, g) { for (let i = 0; i < n; i++) { const a = RND(0, 6.28), v = RND(0.3, 1) * (sp || 80); FX.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, t: 0, life: life || RND(0.4, 0.8), col, r: RND(1.5, 3.5), g: g == null ? 160 : g }); } }
function popText(s, x, y, col, size) { FX.push({ txt: s, x, y, vx: 0, vy: -26, t: 0, life: 1.4, col: col || '#fff', size: size || 14 }); }
function diffK() { return M && M.lesson ? 0 : M ? M.diff : 0; } // 0 minarai, 1 wakiita, 2 itamae
function newOrder(rec, cust, opt) {
  opt = opt || {};
  const O = { rec, cust, steps: opt.steps || buildSteps(rec, opt), si: 0, qs: [], mistakes: 0, notes: [], v: { slices: [], gu: [] }, mg: null, t: 0, done: false, sabinuki: !!opt.sabinuki, fb: null, fish: opt.fish || rec.fish, lesson: !!opt.lesson, hint: 0 };
  autoStart(O);
  return O;
}
function curStep(O) { return O && O.steps[O.si]; }
function autoStart(O) { const st = curStep(O); if (st && !st.tool && st.mini) O.mg = newMini(st, O); }
function toolMatches(st, id) {
  if (!st || !st.tool) return false;
  if (st.tool === id) return true;
  if (st.tool === 'gu' && id.startsWith('gu:')) return true;
  return false;
}
function stepLabel(st, full) {
  if (!st) return '';
  return st.term + (st.kanji ? '  ' + st.kanji : '') + (full ? '  -  ' + st.en : '');
}
function toolName(id) { const t = TOOLS[id]; return t ? t.jp + ' (' + t.en.toLowerCase() + ')' : id; }
function mistake(O, msg, w) {
  const k = diffK(); const add = (w == null ? 1 : w) * (O.lesson ? 0 : [0.35, 0.65, 1][k]);
  O.mistakes += add; sfx('wrong'); game.shake = 0.25;
  O.fb = { s: msg, col: '#ff8a7a', t: 3.2 };
  if (!O.lesson && add > 0) popText('-' + (add * 10 | 0) + '%', BC.x, BOARD.y + 30, '#ff8a7a', 15);
  announce(msg);
}
function clickTool(id) {
  const O = M && M.O;
  if (!O) { if (M && M.mode === 'shift' && id !== 'board') { toast('Pick a ticket first: click a guest\'s order bubble', '#ffd23f'); sfx('deny'); } return; }
  if (O.mg) { const D = MINI[O.mg.type]; if (D.tool) D.tool(O.mg, id, O); return; }
  const st = curStep(O); if (!st) return;
  if (toolMatches(st, id)) { beginStep(O, st, id); return; }
  if (id === 'board') { if (diffK() === 0 || O.lesson) O.fb = { s: 'Next: ' + stepLabel(st) + ' - use the ' + toolName(st.tool), col: '#ffd23f', t: 2.5 }; return; }
  // wrong tool
  if (st.k === 'neta' && id.startsWith('case:')) { const f = FISH[id.slice(5)], want = FISH[st.tool.slice(5)];
    mistake(O, 'That is ' + f.jp + ' (' + f.en.toLowerCase() + '). The ticket says ' + want.jp + (diffK() < 2 || O.lesson ? ' (' + want.en.toLowerCase() + ')' : '') + '.'); return; }
  if (st.k === 'spoon' && id.startsWith('case:')) { mistake(O, 'Wrong neta: this gunkan needs ' + FISH[st.tool.slice(5)].jp + '.'); return; }
  if (st.tool.startsWith('top:') && id.startsWith('top:')) { mistake(O, 'Wrong topping: ' + TOPS[id.slice(4)].jp + '. The ticket wants ' + TOPS[st.tool.slice(4)].jp + '.'); return; }
  const why = WRONG_WHY[id + '>' + st.k] || WRONG_WHY[id] || null;
  mistake(O, (why ? why + ' ' : 'Not yet. ') + (diffK() === 0 || O.lesson ? 'Next step: ' + stepLabel(st, true) + '.' : ''));
}
const WRONG_WHY = {
  'wasabi>form': 'Wasabi first? Not on this one.',
  'wasabi': 'No wasabi right now.',
  'knife>tezu': 'Hands first: rice will stick to dry fingers.',
  'shari>tezu': 'Wet your hands in tezu first, or the shari will glue itself to your fingers.',
  'shari': 'Not time for rice yet.',
  'knife>cut': '', 'knife>fukin': 'Wipe the blade on the damp fukin before cutting a roll, or it will tear the nori.',
  'knife': 'No cutting right now.',
  'geta': 'It is not finished yet!',
  'tezu': 'Your hands are wet already.',
  'nori': 'No nori right now.',
  'makisu': 'The makisu is not needed yet.',
  'fukin': 'Clean already.',
  'tare': 'Tare is only for unagi.',
  'garnish': 'Garnish is for sashimi.'
};
function beginStep(O, st, id) {
  if (st.mini) { O.mg = newMini(st, O, id); sfx('pick'); }
  else { instantStep(O, st); }
}
function instantStep(O, st) {
  const k = st.k;
  if (k === 'neta') { O.v.saku = st.tool.slice(5); sfx('pick'); puff(BC.x, BC.y, 'rgba(200,240,255,0.8)', 8, 60); }
  else if (k === 'tezu') { sfx('splash'); const t = TOOLS.tezu; puff(t.x + t.w / 2, t.y + t.h / 2, 'rgba(200,235,255,0.95)', 16, 90, 0.6); }
  else if (k === 'fukin') { sfx('wipe'); }
  else if (k === 'flip') { sfx('flip'); O.v.flipped = true; }
  else if (k === 'obi') { sfx('pick'); O.v.obi = true; }
  else if (k === 'garnish') { sfx('pick'); O.v.garnish = true; }
  else if (k === 'geta') { sfx('serve'); }

function update(dt) {

  musicTick(); MUS.on = true;
  game.shake = Math.max(0, game.shake - dt * 3);
  if (game.state === 'play') {
    if (game.paused) { if (pressed.pause || pressed.esc) game.paused = false; return; }
    if (pressed.pause || pressed.esc) { game.paused = true; return; }
    if (pressed.restart && M.mode === 'shift' && !M.O) { startShift(M.D, M.diff); return; }
    const busy = M.mode === 'shift' ? M.seats.filter(g => g && (g.st === 'wait' || g.st === 'sit' || g.st === 'cook')).length : 0;
    MUS.int = lerp(MUS.int, M.mode === 'shift' ? clamp(0.2 + busy * 0.18, 0, 1) : 0.15, dt * 0.5);
    handlePlayInput();
    updatePlay(dt);
  } else {
    MUS.int = lerp(MUS.int, 0.2, dt);

    if (pressed.start) { if (game.state === 'title') game.state = 'dojo'; }
  }
