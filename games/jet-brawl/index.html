function musicTick() {

  const t = AC.currentTime, sp = 60 / MUS.bpm / 4;
  if (MUS.next < t - 0.3) MUS.next = t + 0.05;
  while (MUS.next < t + 0.12) {
    const s = MUS.step % 16, w = MUS.next, I = MUS.int, bar = Math.floor(MUS.step / 16) % 8, root = [45, 45, 41, 43, 45, 45, 48, 43][bar];
