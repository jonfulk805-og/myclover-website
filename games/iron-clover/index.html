<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>IRON CLOVER - Run & Gun | MyClover.Tech</title>
<meta name="description" content="IRON CLOVER: a Contra-style run-and-gun browser game with 26 weapons, 4 stages and 4 bosses. Free, no install.">
<style>
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;box-shadow:0 0 40px rgba(255,210,63,.12)}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#stick{position:absolute;left:4vw;bottom:5vh;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,210,63,.35);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,210,63,.4)}
.btn{position:absolute;width:74px;height:74px;border-radius:50%;pointer-events:auto;touch-action:none;font:bold 13px monospace;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.btn.on{background:rgba(255,210,63,.45)}
#bf{right:4vw;bottom:6vh;border-color:#ff3b3b}#bj{right:calc(4vw + 86px);bottom:3vh;border-color:#3eff6c}
#bn{right:4vw;bottom:calc(6vh + 90px);width:56px;height:56px;border-color:#ffd23f}#bp{right:calc(4vw + 70px);bottom:calc(6vh + 100px);width:46px;height:46px;border-color:#ff9a1f}
#bl{left:calc(4vw + 150px);bottom:5vh;width:56px;height:56px;border-color:#58c8ff}#bz{left:4vw;top:3vh;width:46px;height:46px}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="touch"><div id="stick"><div id="knob"></div></div>
<div class="btn" id="bf" data-k="fire">FIRE</div><div class="btn" id="bj" data-k="jump">JUMP</div>
<div class="btn" id="bn" data-k="next">SWAP</div><div class="btn" id="bp" data-k="prev">&lt;</div>
<div class="btn" id="bl" data-k="lock">LOCK</div><div class="btn" id="bz" data-k="pause">II</div></div>
<script>
(function(){
'use strict';
// ===== IRON CLOVER - a run-and-gun tribute to Contra (Konami, 1987) =====
// Original code + procedurally drawn art by Viktor for MyClover.Tech. No external assets.
const W = 640, H = 360;
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
cv.width = W; cv.height = H;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

const TOUCH = (navigator.maxTouchPoints > 0) && /Mobi|Android|iPhone|iPad|Tablet/i.test(navigator.userAgent);

// ---------- utils ----------
const R = (a, b) => a + Math.random() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function circRect(x, y, r, e) {
  const nx = clamp(x, e.x, e.x + e.w), ny = clamp(y, e.y, e.y + e.h);
  return dist2(x, y, nx, ny) <= r * r;
}
// segment vs rect (for hitscan weapons)
function segRect(x1, y1, x2, y2, e, pad) {
  pad = pad || 0;
  const steps = Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 4);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
    if (x > e.x - pad && x < e.x + e.w + pad && y > e.y - pad && y < e.y + e.h + pad) return true;
  }
  return false;
}

// ---------- input ----------
const keys = {}, pressed = {};
const KM = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  KeyZ: 'jump', KeyK: 'jump', Space: 'jump',
  KeyX: 'fire', KeyJ: 'fire',
  KeyQ: 'prev', KeyE: 'next', KeyC: 'lock', ShiftLeft: 'lock', ShiftRight: 'lock', KeyL: 'lock',
  KeyP: 'pause', Escape: 'pause', Enter: 'start', KeyM: 'mute', Tab: 'codex'
};
const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','KeyB','KeyA'];
let konamiIdx = 0, konamiOn = false;
addEventListener('keydown', e => {
  ensureAudio();
  const a = KM[e.code];
  if (a) { if (!keys[a]) pressed[a] = true; keys[a] = true; e.preventDefault(); }
  if (/^Digit[0-9]$/.test(e.code)) pressed['slot' + e.code.slice(5)] = true;
  if (e.code === KONAMI[konamiIdx]) { konamiIdx++; if (konamiIdx === KONAMI.length) { konamiIdx = 0; if (game.state === 'title') { konamiOn = !konamiOn; sfx('power'); } } }
  else konamiIdx = (e.code === KONAMI[0]) ? 1 : 0;
});
addEventListener('keyup', e => { const a = KM[e.code]; if (a) keys[a] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (game.state === 'play') game.state = 'pause'; });

// gamepad
let padPrev = {};
function pollPad() {
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = gps && gps[0];
  if (!gp) return;
  const b = i => gp.buttons[i] && gp.buttons[i].pressed;
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  const st = {
    left: b(14) || ax < -0.4, right: b(15) || ax > 0.4, up: b(12) || ay < -0.4, down: b(13) || ay > 0.4,
    jump: b(0), fire: b(2) || b(7), prev: b(4), next: b(5), lock: b(6) || b(3), pause: b(9), start: b(9) || b(0)
  };
  for (const k in st) {
    if (st[k] && !padPrev[k]) pressed[k] = true;
    if (st[k] !== padPrev[k]) keys[k] = st[k] || false;
  }
  padPrev = st;
}

// ---------- audio (WebAudio synth) ----------
let AC = null, master = null, musicGain = null, muted = false, noiseBuf = null;
function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.3; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.35; musicGain.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (err) { AC = null; }
}
function tone(f, d, type, v, slide, dest, when) {
  if (!AC || muted) return;
  const t = when || AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
  g.gain.setValueAtTime(v || 0.1, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
  o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v, freq, slide) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq || 1200, t);
  if (slide) f.frequency.exponentialRampToValueAtTime(Math.max(40, (freq || 1200) + slide), t + d);
  g.gain.setValueAtTime(v || 0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d);
}
const sfxLast = {};
const SFX = {
  rifle: () => tone(900, 0.05, 'square', 0.05, -500),
  mg: () => tone(700, 0.04, 'square', 0.04, -300),
  spread: () => { tone(500, 0.08, 'sawtooth', 0.05, -250); },
  laser: () => tone(1400, 0.18, 'sawtooth', 0.05, -1100),
  fire: () => tone(300, 0.12, 'triangle', 0.08, 300),
  missile: () => noise(0.2, 0.08, 2000, -1500),
  shotgun: () => { noise(0.15, 0.2, 1800, -1200); tone(160, 0.1, 'square', 0.06, -80); },
  rail: () => { tone(2000, 0.3, 'sawtooth', 0.06, -1900); noise(0.2, 0.08, 4000, -3000); },
  flame: () => noise(0.08, 0.05, 900),
  thump: () => tone(140, 0.12, 'square', 0.08, -60),
  zap: () => { tone(1800, 0.1, 'square', 0.04, 1200); noise(0.1, 0.06, 6000); },
  plasma: () => tone(220, 0.35, 'sawtooth', 0.07, 400),
  wave: () => tone(600, 0.12, 'sine', 0.08, 500),
  saw: () => tone(1200, 0.1, 'sawtooth', 0.04, 300),
  ice: () => tone(2400, 0.08, 'triangle', 0.05, -800),
  boom: () => { noise(0.45, 0.35, 900, -800); tone(90, 0.35, 'square', 0.12, -60); },
  bigboom: () => { noise(1.2, 0.5, 600, -560); tone(60, 1.0, 'sawtooth', 0.15, -40); },
  hit: () => tone(240, 0.03, 'square', 0.03, -100),
  ehit: () => tone(400, 0.03, 'triangle', 0.03, -100),
  eshot: () => tone(420, 0.06, 'triangle', 0.035, -200),
  jump: () => tone(300, 0.1, 'square', 0.03, 300),
  pick: () => { tone(660, 0.08, 'square', 0.06); setTimeout(() => tone(990, 0.12, 'square', 0.06), 70); },
  power: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'square', 0.06), i * 70)); },
  die: () => { tone(500, 0.6, 'square', 0.1, -440); noise(0.4, 0.2, 1200, -1000); },
  select: () => tone(1200, 0.04, 'square', 0.04),
  empty: () => tone(200, 0.06, 'square', 0.04),
  hole: () => tone(80, 0.6, 'sine', 0.15, 200)
};
function sfx(n) {
  if (!AC || muted || !SFX[n]) return;
  const t = performance.now();
  if (sfxLast[n] && t - sfxLast[n] < 40) return;
  sfxLast[n] = t; SFX[n]();
}

// tiny chiptune sequencer (bass + arp per stage)
const SONGS = [
  { tempo: 0.13, bass: [0,0,12,0,10,0,7,0, 0,0,12,0,15,12,10,7], arp: [12,15,19,15], root: 45 },
  { tempo: 0.12, bass: [0,0,0,12,3,3,3,15,5,5,5,17,3,3,7,10], arp: [12,15,17,22], root: 43 },
  { tempo: 0.115, bass: [0,1,0,12,0,1,0,13,5,6,5,17,3,4,3,15], arp: [12,13,19,13], root: 40 },
  { tempo: 0.16, bass: [0,7,12,7,5,12,17,12,3,10,15,10,7,14,19,14], arp: [24,19,24,27], root: 48 }
];
let songIdx = -1, nextNote = 0, noteStep = 0, musicOn = true;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function music() {
  if (!AC || muted || !musicOn || songIdx < 0) return;
  const s = SONGS[songIdx];
  if (nextNote < AC.currentTime) nextNote = AC.currentTime + 0.05;
  while (nextNote < AC.currentTime + 0.2) {
    const b = s.bass[noteStep % s.bass.length];
    tone(mtof(s.root + b), s.tempo * 0.9, 'triangle', 0.22, 0, musicGain, nextNote);
    if (noteStep % 2 === 0) {
      const a = s.arp[(noteStep / 2) % s.arp.length];
      tone(mtof(s.root + 12 + a), s.tempo * 0.5, 'square', 0.035, 0, musicGain, nextNote);
    }
    if (noteStep % 4 === 0) {
      const t = nextNote, sN = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
      sN.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = noteStep % 8 === 0 ? 200 : 5000;
      g.gain.setValueAtTime(noteStep % 8 === 0 ? 0.12 : 0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      sN.connect(f); f.connect(g); g.connect(musicGain); sN.start(t); sN.stop(t + 0.08);
    }
    nextNote += s.tempo; noteStep++;
  }
}
function playSong(i) { songIdx = i; noteStep = 0; if (AC) nextNote = AC.currentTime + 0.1; }

// ---------- world / physics / fx ----------
const GRAV = 0.38;
const game = {
  state: 'title', stage: 0, loop: 0, score: 0, t: 0, stateT: 0, continues: 3, codex: 0, codexPage: 0,
  hi: +(localStorage.getItem('ironclover_hi') || 0), flash: 0, msg: '', msgT: 0
};
let world = null, P = null;

function pointSolid(x, y) {
  const s = world.solids;
  for (let i = 0; i < s.length; i++) { const o = s[i]; if (!o.gone && x >= o.x && x < o.x + o.w && y >= o.y && y < o.y + o.h) return o; }
  return null;
}
function groundAt(x, fromY) {
  // top y of first solid/plat surface below fromY at x
  let best = Infinity; fromY = fromY == null ? -999 : fromY;
  for (const o of world.solids) if (!o.gone && x >= o.x && x < o.x + o.w && o.y >= fromY && o.y < best) best = o.y;
  for (const o of world.plats) if (!o.gone && x >= o.x && x < o.x + o.w && o.y >= fromY && o.y < best) best = o.y;
  return best;
}
function moveBody(e, dropThrough) {
  e.hitWall = false;
  e.x += e.vx;
  for (const s of world.solids) {
    if (s.gone || !overlap(e, s)) continue;
    if (e.y + e.h - s.y < 10 && !pointSolid(e.x + e.w / 2, s.y - e.h)) { e.y = s.y - e.h; e.vy = Math.min(e.vy, 0); continue; } // ledge assist
    if (e.vx > 0) e.x = s.x - e.w; else if (e.vx < 0) e.x = s.x + s.w;
    else { // pushed out (e.g. standing up under ledge)
      if (e.x + e.w / 2 < s.x + s.w / 2) e.x = s.x - e.w; else e.x = s.x + s.w;
    }
    e.hitWall = true;
  }
  const prevBottom = e.y + e.h;
  e.vy = Math.min(e.vy + (e.grav == null ? GRAV : e.grav), 9);
  e.y += e.vy; e.onGround = false; e.ground = null;
  for (const s of world.solids) {
    if (s.gone || !overlap(e, s)) continue;
    if (e.vy > 0) { e.y = s.y - e.h; e.onGround = true; e.ground = s; } else e.y = s.y + s.h;
    e.vy = 0;
  }
  if (e.vy >= 0 && !dropThrough) {
    for (const p of world.plats) {
      if (p.gone) continue;
      if (e.x + e.w > p.x && e.x < p.x + p.w && prevBottom <= p.y + 0.5 && e.y + e.h >= p.y) {
        e.y = p.y - e.h; e.vy = 0; e.onGround = true; e.ground = p;
      }
    }
  }
}

// particles
function part(x, y, vx, vy, life, color, size, grav, type) {
  if (world.parts.length > 1100) world.parts.shift();
  world.parts.push({ x, y, vx, vy, life, max: life, color, size: size || 2, grav: grav == null ? 0.1 : grav, type: type || 0 });
}
function burst(x, y, n, colors, spd, size, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * (spd || 3);
    part(x, y, Math.cos(a) * s, Math.sin(a) * s, (life || 30) * R(0.5, 1), pick(colors), size || 2, 0.08);
  }
}
function addFx(o) { world.fx.push(Object.assign({ t: 0 }, o)); }
function shake(n) { world.shake = Math.max(world.shake, n); }

function explode(x, y, r, dmg, opt) {
  opt = opt || {};
  for (const e of world.enemies) {
    if (e.dead || e.nohit) continue;
    if (circRect(x, y, r, e)) hurt(e, dmg, null);
  }
  if (opt.hurtsPlayer && P && !P.dead && circRect(x, y, r * 0.8, P)) killPlayer();
  addFx({ type: 'ring', x, y, r, life: 16, color: opt.color || '#ffd27a' });
  const n = Math.min(60, 10 + r * 0.6);
  burst(x, y, n, opt.colors || ['#fff3b0', '#ffb347', '#ff6a2a', '#d23c1e', '#5a5a5a'], r / 9, 3, 34);
  for (let i = 0; i < n / 4; i++) part(x + R(-r / 3, r / 3), y + R(-r / 3, r / 3), R(-0.5, 0.5), R(-1.2, -0.3), R(40, 70), '#3c3a3a', R(4, 7), -0.01, 1);
  shake(Math.min(14, r / 6));
  sfx(r > 120 ? 'bigboom' : 'boom');
}

function hurt(e, dmg, b) {
  if (e.dead || e.invul) return;
  if (e.armor && b && e.armorTest && !e.armorTest(b)) { sfx('ehit'); return; }
  if (e.armorK) dmg *= e.armorK;
  e.hp -= dmg; e.flash = 3;
  sfx('hit');
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  game.score += e.score || 100;
  const T = ET[e.type];
  if (T && T.die) T.die(e);
  else {
    explode(e.x + e.w / 2, e.y + e.h / 2, Math.max(18, Math.max(e.w, e.h) * 0.8), 0, {});
  }
  if (e.drop) spawnPickup(e.x + e.w / 2, e.y + e.h / 2, e.drop === true ? randomWeaponId() : e.drop);
  else if (!e.boss && Math.random() < 0.025) spawnPickup(e.x + e.w / 2, e.y, randomWeaponId());
}

// pickups
function randomWeaponId() {
  const owned = new Set(P ? P.arsenal.map(a => a.w) : []);
  const pool = [];
  for (let i = 1; i < WEAPONS.length; i++) {
    const wp = WEAPONS[i];
    if (wp.minStage > game.stage && game.loop === 0) continue;
    let wt = wp.rare ? 1 : 4;
    if (!owned.has(i)) wt *= 2.2;
    for (let k = 0; k < wt; k++) pool.push(i);
  }
  if (Math.random() < 0.06) return pick(['B', 'R', '1UP']);
  return pick(pool);
}
function spawnPickup(x, y, id) {
  world.pickups.push({ x: x - 9, y: y - 7, w: 18, h: 14, vx: R(0.6, 1.4), vy: -5, id, t: 0, onGround: false, grav: 0.25 });
}
function collectPickup(k) {
  const id = k.id;
  if (id === 'B') { P.barrier = 600; sfx('power'); flashMsg('BARRIER'); }
  else if (id === 'R') { P.rapid = 1200; sfx('power'); flashMsg('RAPID FIRE'); }
  else if (id === '1UP') { P.lives++; sfx('power'); flashMsg('1 UP'); }
  else giveWeapon(id, true);
  game.score += 500;
}
function giveWeapon(id, announce) {
  const wp = WEAPONS[id];
  let slot = P.arsenal.find(a => a.w === id);
  if (slot) slot.ammo = Math.min(wp.ammo * 3, slot.ammo + wp.ammo);
  else { slot = { w: id, ammo: wp.ammo }; P.arsenal.push(slot); P.arsenal.sort((a, b) => a.w - b.w); }
  P.cur = P.arsenal.indexOf(slot);
  if (announce) { sfx('pick'); flashMsg(wp.name + (P.arsenal.length > 1 ? '  [' + (P.arsenal.length - 1) + '/' + (WEAPONS.length - 1) + ']' : '')); }
}
function flashMsg(m) { game.msg = m; game.msgT = 120; }

function nearestEnemy(x, y, maxD, dirX, dirY, minDot) {
  let best = null, bd = maxD * maxD;
  for (const e of world.enemies) {
    if (e.dead || e.nohit || e.decor) continue;
    const ex = e.x + e.w / 2, ey = e.y + e.h / 2, d = dist2(x, y, ex, ey);
    if (d > bd) continue;
    if (dirX != null) { const l = Math.sqrt(d) || 1; if (((ex - x) * dirX + (ey - y) * dirY) / l < minDot) continue; }
    if (ex < world.camX - 20 || ex > world.camX + W + 20) continue;
    bd = d; best = e;
  }
  return best;
}

// ---------- weapons: the arsenal ----------
function mk(o) {
  const b = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, r: 2, dmg: 1, life: 120, t: 0, pierce: 1, color: '#ffe066' }, o);
  if (b.pierce > 1) b.hits = new Set();
  world.pb.push(b); return b;
}
function shot(m, a, spd, o) { return mk(Object.assign({ x: m.x, y: m.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd }, o)); }
function glow(x, y, r, c) {
  cx.globalAlpha = 0.35; cx.fillStyle = c; cx.beginPath(); cx.arc(x, y, r * 2.2, 0, 7); cx.fill();
  cx.globalAlpha = 1; cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill();
  cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(x, y, r * 0.45, 0, 7); cx.fill();
}
function hitscan(m, a, len) {
  const dx = Math.cos(a), dy = Math.sin(a);
  let l = 0;
  for (; l < len; l += 4) if (pointSolid(m.x + dx * l, m.y + dy * l)) break;
  return { x2: m.x + dx * l, y2: m.y + dy * l };
}

  if (P.x + P.w > world.camX + W) P.x = world.camX + W - P.w;
  if (P.y > H + 30) { P.inv = 0; P.barrier = 0; killPlayer(); return; }

ET.hive.base.armor = false;

function bossDown(e) {
  world.clearT = 200; world.bossDead = true;
  for (const o of world.enemies) if (o !== e && !o.dead) { o.dead = true; explode(o.x + o.w / 2, o.y + o.h / 2, 24, 0, {}); }
  world.eb.length = 0;
  explode(e.x + e.w / 2, e.y + e.h / 2, 90, 0, {});
  world.bossExplode = { x: e.x, y: e.y, w: e.w, h: e.h };
}

function updateEnemies() {
  for (const e of world.enemies) {
    if (e.dead) continue;
    if (e.flash > 0) e.flash--;
    if (e.frozen > 0) { e.frozen--; if (game.t % 3) continue; }
    e.t++;
    ET[e.type].update(e);
    if (!e.boss && !e.static && e.x + e.w < world.camX - 80) e.dead = true;
    if (e.y > H + 60) { e.dead = true; }
  }
  world.enemies = world.enemies.filter(e => !e.dead);
  // enemy bullets
  const hb = P && !P.dead ? hitbox() : null;
  for (const b of world.eb) {
    b.t++;
    if (b.homing && b.t > 40 && b.t < 160 && P) { const a = aimAt(b.x, b.y), s = Math.hypot(b.vx, b.vy); b.vx += Math.cos(a) * 0.12; b.vy += Math.sin(a) * 0.12; const ns = Math.hypot(b.vx, b.vy); if (ns > 3) { b.vx *= 3 / ns; b.vy *= 3 / ns; } }
    else b.vy += b.g;
    b.x += b.vx; b.y += b.vy;
    if (b.t > b.life || b.x < world.camX - 30 || b.x > world.camX + W + 30 || b.y > H + 20 || b.y < -60) b.dead = true;
    else if (b.t > 2 && pointSolid(b.x, b.y)) { b.dead = true; burst(b.x, b.y, 3, ['#ffb000', '#fff'], 1.5, 1.5, 10); }
    if (hb && !b.dead) {
      if (P.barrier > 0 && dist2(b.x, b.y, P.x + 7, P.y + P.h / 2) < 24 * 24) b.dead = true;
      else if (circRect(b.x, b.y, b.r - 1, hb)) { b.dead = true; killPlayer(); }
    }
  }
  world.eb = world.eb.filter(b => !b.dead);
}

const THEMES = [
  { name: 'STAGE 1  -  JUNGLE ASSAULT', sky: ['#07131f', '#1d3b3a'], far: '#10262a', mid: '#173a28', body: '#4a3320', top: '#3e8a2e', top2: '#5fb83e', water: '#0e3a5a', plat: '#6a4a2a' },
  { name: 'STAGE 2  -  STEEL BASE', sky: ['#05060f', '#1a1f3a'], far: '#121630', mid: '#1c2240', body: '#363c48', top: '#7a8496', top2: '#ffd23f', water: '#101018', plat: '#596270' },
  { name: 'STAGE 3  -  ALIEN HIVE', sky: ['#0a0312', '#2a0a34'], far: '#1e0a28', mid: '#2e0f3a', body: '#3a1440', top: '#8a2a9a', top2: '#ff5af0', water: '#1a3a0a', plat: '#5a2a6a' },
  { name: 'STAGE 4  -  IRON CITADEL', sky: ['#1a0505', '#6a1a0a'], far: '#2a0a08', mid: '#3a1410', body: '#2e2626', top: '#5a4a44', top2: '#ff9a1f', water: '#ff4a0a', plat: '#4a3e3a' }
];

function buildStage(si) {
  world = { solids: [], plats: [], bridges: [], spawns: [], deco: [], enemies: [], pb: [], eb: [], parts: [], pickups: [], fx: [],
    camX: 0, shake: 0, runnerT: 150, theme: THEMES[si], clearT: 0, bossDead: false, arena: false, arenaX: 0, len: 0, introT: 180 };
  let x = 0, gy = 300;
  const ground = (x0, w, y) => world.solids.push({ x: x0, y, w, h: H + 80 - y });
  const sp = (type, sx, sy, o) => world.spawns.push({ type, x: sx, y: sy, o: o || {} });
  const deco = (dx, dy, kind) => world.deco.push({ x: dx, y: dy, k: kind || RI(0, 2) });
  const tpl = {
    flat() { const w = RI(220, 360); ground(x, w, gy); if (Math.random() < 0.7) sp('soldier', x + w * 0.6, gy - 28); if (Math.random() < 0.18) sp('sensor', x + w * 0.35, gy - 22); deco(x + R(20, w - 20), gy); return w; },
    pit() { const g = RI(54, 76); ground(x + g, 160, gy); deco(x + g + 80, gy); return g + 160; },
    pitPlat() { const g = RI(150, 185); world.plats.push({ x: x + g / 2 - 30, y: gy - 40, w: 60, h: 6 }); ground(x + g, 160, gy); if (Math.random() < 0.5) sp('flyer', x, R(70, 140), { edge: 1 }); return g + 160; },
    stepUp() { if (gy <= 220) return tpl.flat(); gy -= 40; const w = RI(200, 300); ground(x, w, gy); sp('soldier', x + w - 40, gy - 28); return w; },
    stepDown() { if (gy >= 300) return tpl.flat(); gy += 40; const w = RI(200, 300); ground(x, w, gy); return w; },
    plats() { const w = 380; ground(x, w, gy); world.plats.push({ x: x + 50, y: gy - 66, w: 110, h: 6 }, { x: x + 200, y: gy - 124, w: 120, h: 6 }); sp('soldier', x + 260, gy - 124 - 28, { sniper: true, rate: 80, spd: 3.3 }); if (Math.random() < 0.5) sp('soldier', x + 100, gy - 66 - 28); return w; },
    turret() { const w = 320; ground(x, w, gy); world.solids.push({ x: x + 150, y: gy - 36, w: 40, h: 36 }); sp('turret', x + 158, gy - 56); if (Math.random() < 0.4) sp('soldier', x + 270, gy - 28); return w; },
    bridge() { if (si !== 0 && si !== 3) return tpl.pit(); const n = 8, pw = 28; ground(x, 40, gy); for (let i = 0; i < n; i++) { const b = { x: x + 40 + i * pw, y: gy, w: pw, h: 10, bridge: true }; world.solids.push(b); world.bridges.push(b); } ground(x + 40 + n * pw, 160, gy); return 40 + n * pw + 160; },
    heavy() { const w = 420; ground(x, w, gy); sp('heavy', x + 320, gy - 36); return w; },
    capsule() { const w = 260; ground(x, w, gy); sp('capsule', x, R(60, 120), { edge: -1 }); deco(x + 100, gy); return w; },
    flyers() { const w = 300; ground(x, w, gy); for (let i = 0; i < 3; i++) sp('flyer', x + i * 40, R(60, 150), { edge: 1 }); return w; },
    jets() { const w = 320; ground(x, w, gy); sp('jet', x, -30, { edge: 1 }); sp('jet', x + 100, -30, { edge: 1 }); return w; },
    tower() { const w = 360; ground(x, w, gy); world.plats.push({ x: x + 60, y: gy - 44, w: 56, h: 6 }); world.solids.push({ x: x + 140, y: gy - 84, w: 90, h: 84 }); sp('soldier', x + 180, gy - 84 - 28, { rate: 90 }); sp('turret', x + 280, gy - 20); return w; },
    pods() { const w = 380; ground(x, w, gy); sp('pod', x + 140, gy - 26); sp('pod', x + 290, gy - 26); return w; },
    bugs() { const w = 300; ground(x, w, gy); for (let i = 0; i < 4; i++) sp('bug', x + 150 + i * 30, gy - 10); return w; }
  };
  const W8 = [
    { flat: 4, pit: 3, pitPlat: 2, stepUp: 2, stepDown: 2, plats: 2, turret: 2, bridge: 2, heavy: 1, capsule: 1.5, flyers: 1 },
    { flat: 4, pit: 2, pitPlat: 2, stepUp: 2, stepDown: 2, plats: 2, turret: 3, tower: 2, heavy: 1.2, capsule: 1.5, flyers: 1.5, jets: 2 },
    { flat: 3, pit: 2, pitPlat: 2, stepUp: 2, stepDown: 2, plats: 2, pods: 3, bugs: 3, heavy: 1, capsule: 1.5, flyers: 1 },
    { flat: 3, pit: 3, pitPlat: 2, stepUp: 2, stepDown: 2, plats: 2, turret: 3, tower: 2, bridge: 1.5, heavy: 1.5, capsule: 1.5, jets: 2, flyers: 1.5, bugs: 1 }
  ][si];
  const choose = () => { let tot = 0; for (const k in W8) tot += W8[k]; let r = Math.random() * tot; for (const k in W8) { r -= W8[k]; if (r <= 0) return k; } return 'flat'; };
  ground(0, 560, gy); deco(200, gy); deco(420, gy); x = 560;
  sp('capsule', 0, 90, { edge: -1, at: 300 });
  const L = 6800 + si * 700;
  let last = '', capN = 0;
  while (x < L) {
    let t = choose();
    if ((t === 'pit' || t === 'pitPlat' || t === 'bridge') && (last === 'pit' || last === 'pitPlat' || last === 'bridge')) t = 'flat';
    if (x - capN > 1500) { t = 'capsule'; capN = x; }
    if (t === 'capsule') capN = x;
    x += tpl[t](); last = t;
  }
  // approach + boss arena
  gy = 300; ground(x, 300, gy); sp('heavy', x + 200, gy - 36); x += 300;
  world.arenaX = x; ground(x, W + 40, gy); world.len = x + W;
  world.spawns.sort((a, b) => a.x - b.x);
  return world;
}

function startBoss() {
  world.arena = true; world.camX = world.arenaX;
  const ax = world.arenaX, si = game.stage;
  if (si === 0) {
    const wx = ax + W - 80;
    world.solids.push({ x: wx, y: 30, w: 120, h: 270, wall: true });
    world.bossE = spawnEnemy('gatecore', wx - 34, 260);
    spawnEnemy('gatecannon', wx - 28, 130, { k: 0 }); spawnEnemy('gatecannon', wx - 28, 190, { k: 1 });
  } else if (si === 1) world.bossE = spawnEnemy('walker', ax + W - 130, -90);
  else if (si === 2) world.bossE = spawnEnemy('hive', ax + W - 110, 100);
  else world.bossE = spawnEnemy('overlord', ax + W - 150, 120, { baseY: 110 });
  flashMsg('WARNING: ' + ['IRON GATE', 'WARHOUND', 'HIVE HEART', 'IRON OVERLORD'][si]);
  sfx('power');
}

function updateLevel() {
  const target = P.x - W * 0.42;
  if (!world.arena) {
    world.camX = Math.max(world.camX, Math.min(target, world.arenaX));
    if (world.camX >= world.arenaX - 0.5) startBoss();
  }
  // spawns
  while (world.spawns.length && world.spawns[0].x < world.camX + W + 30) {
    const s = world.spawns.shift();
    let sx = s.x;
    if (s.o.edge === 1) sx = world.camX + W + 10; else if (s.o.edge === -1) sx = world.camX - 20;
    const o = Object.assign({}, s.o); delete o.edge; delete o.at;
    spawnEnemy(s.type, sx, s.y, o);
  }
  // runners
  if (!world.arena && --world.runnerT <= 0) {
    world.runnerT = Math.floor(RI(70, 140) / Math.min(2, diff()));
    const left = Math.random() < 0.18;
    const rx = left ? world.camX - 14 : world.camX + W + 4;
    const g = groundAt(rx + 6);
    if (g < H) {

// ---------- flow ----------
function newGame() {
  game.score = 0; game.stage = 0; game.loop = 0; game.continues = 3;
  P = newPlayer(konamiOn ? 29 : 2);
  buildStage(0);
  if (konamiOn) for (let i = 1; i < WEAPONS.length; i++) giveWeapon(i, false);
  P.cur = 0;
  game.state = 'play'; playSong(0);
}
function nextStage() {
  game.stage++;
  if (game.stage >= THEMES.length) { game.state = 'victory'; game.stateT = 0; playSong(3); return; }
  const keep = P; buildStage(game.stage); P = keep;
  P.x = 60; P.y = 100; P.vx = P.vy = 0; P.inv = 90; P.dead = false;
  game.state = 'play'; playSong(game.stage);
}
function saveHi() { if (game.score > game.hi) { game.hi = game.score; try { localStorage.setItem('ironclover_hi', game.hi); } catch (e) {} } }

  const st = game.state;
  if (st === 'title') {
    if (pressed.codex || (pressed.up && keys.start)) game.codex = !game.codex;
    if (game.codex && pressed.pause) game.codex = 0;
    if (!game.codex && (pressed.start || pressed.fire)) { ensureAudio(); newGame(); }
  } else if (st === 'play') {
    if (pressed.pause) { game.state = 'pause'; }
    else {
      updatePlayer(); if (game.state !== 'play' && game.state !== 'gameover') return;
      updateLevel(); updateEnemies();
      for (const b of world.pb) updPB(b);
      world.pb = world.pb.filter(b => !b.dead);
      for (const k of world.pickups) { k.t++; if (!k.onGround) moveBody(k); else k.vx = 0; if (k.t > 900 || k.y > H + 20) k.dead = true; }
      world.pickups = world.pickups.filter(k => !k.dead);
      for (const p of world.parts) { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--; }
      world.parts = world.parts.filter(p => p.life > 0);
      for (const f of world.fx) f.t++;
      world.fx = world.fx.filter(f => f.t < f.life);
      if (world.shake > 0) world.shake = Math.max(0, world.shake - 0.6);
    }
  } else if (st === 'pause') {
    if (pressed.pause || pressed.start) game.state = 'play';
    if (pressed.next) P.cur = (P.cur + 1) % P.arsenal.length;
    if (pressed.prev) P.cur = (P.cur - 1 + P.arsenal.length) % P.arsenal.length;
  } else if (st === 'gameover') {
    saveHi();
    if (game.stateT > 40 && (pressed.start || pressed.fire)) {
      if (game.continues > 0) { game.continues--; game.score = 0; P.lives = 2; P.dead = false; P.inv = 150; respawnPos(); P.vy = 0; game.state = 'play'; }
      else { game.state = 'title'; songIdx = -1; }
    }
    if (game.stateT > 40 && pressed.pause) { game.state = 'title'; songIdx = -1; }
  } else if (st === 'clear') {
    for (const p of world.parts) { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--; }
    if (game.stateT > 200 || (game.stateT > 60 && pressed.start)) nextStage();
  } else if (st === 'victory') {
    saveHi();
    if (game.stateT > 120 && (pressed.start || pressed.fire)) {
      game.loop++; game.stage = -1; game.continues = Math.max(game.continues, 1); nextStage();
    }
  }
}
function updPB(b) {
  b.t++;
  if (b.upd) b.upd(b); else { b.x += b.vx; b.y += b.vy; if (b.grav) b.vy += b.grav; }
  if (b.dead) return;
  if (!b.ghost && pointSolid(b.x, b.y)) { if (b.onWall) b.onWall(b); else { b.dead = true; burst(b.x, b.y, 3, [b.color, '#fff'], 1.5, 1.5, 8); } }
  if (b.dead) return;
  if (b.t > b.life) { b.dead = true; if (b.onEnd) b.onEnd(b); return; }
  if (!b.keep && (b.x < world.camX - 60 || b.x > world.camX + W + 60 || b.y < -140 || b.y > H + 40)) { b.dead = true; return; }
  if (b.dmg > 0) {
    for (const e of world.enemies) {
      if (e.dead || e.nohit) continue;
      if (b.hits && b.hits.has(e)) continue;
      if (circRect(b.x, b.y, b.r, e)) {
        if (e.invul) { if (!b.ghost && b.pierce < 50) { b.dead = true; sfx('ehit'); burst(b.x, b.y, 3, ['#fff'], 1.5, 1.5, 8); } if (b.dead) return; continue; }
        hurt(e, b.dmg, b); if (b.onHit) b.onHit(b, e); if (b.hits) b.hits.add(e);
        if (--b.pierce <= 0) { b.dead = true; return; }
      }
    }
  }
}
function render() {
  if (game.state === 'title') { drawTitle(); return; }
  drawWorld(); drawHUD();
  if (game.state === 'pause') {
    drawOverlay('PAUSED', ['P / ENTER to resume   Q / E to swap weapon', 'Arsenal: ' + P.arsenal.map(a => WEAPONS[a.w].tag).join(' ')]);
  } else if (game.state === 'gameover') {
    drawOverlay('GAME OVER', game.continues > 0 ? ['CONTINUE? (' + game.continues + ' left)', 'ENTER / FIRE to continue    ESC for title'] : ['No continues left.', 'ENTER for title'], '#ffd23f');
  } else if (game.state === 'clear') {
    drawOverlay('STAGE CLEAR', ['BONUS ' + (10000 * (game.stage + 1)), 'ARSENAL ' + (P.arsenal.length - 1) + '/' + (WEAPONS.length - 1)], '#3eff6c');
  } else if (game.state === 'victory') {
    cx.fillStyle = 'rgba(0,0,0,0.75)'; cx.fillRect(0, 0, W, H);
    drawClover(320, 70, 40, game.t * 0.02);
    metalText('MISSION COMPLETE', 320, 120, 40);
    ['The Iron Overlord is scrap. The clover flies again.', 'SCORE ' + game.score, 'ENTER to start LOOP ' + (game.loop + 2) + ' (harder, keep your arsenal)'].forEach((s, i) => txt(s, 320, 180 + i * 18, 11, '#fff', 'center'));
  }
}
let acc = 0, lastT = performance.now();
function frame(now) {
  acc += Math.min(100, now - lastT); lastT = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 4) { step(); for (const k in pressed) pressed[k] = false; acc -= 1000 / 60; n++; }
  if (n === 4) acc = 0;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__IC = { game, step, keys, pressed, get world() { return world; }, get P() { return P; }, WEAPONS, giveWeapon, startBoss, nextStage, buildStage };

// ---------- touch controls ----------
(function () {
  const root = document.getElementById('touch');
  if (!TOUCH) { root.style.display = 'none'; return; }
  root.style.display = 'block';
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let sid = null, sx = 0, sy = 0;
  const setDir = (dx, dy) => {
    const d = Math.hypot(dx, dy), th = 18;
    keys.left = dx < -th; keys.right = dx > th;
    const up = dy < -th && Math.abs(dy) > Math.abs(dx) * 0.45, down = dy > th && Math.abs(dy) > Math.abs(dx) * 0.45;
    if (up && !keys.up) pressed.up = true; if (down && !keys.down) pressed.down = true;
    keys.up = up; keys.down = down;
    const k = Math.min(1, 40 / (d || 1)); knob.style.transform = 'translate(' + dx * k + 'px,' + dy * k + 'px)';
  };
  stick.addEventListener('pointerdown', e => { ensureAudio(); sid = e.pointerId; const r = stick.getBoundingClientRect(); sx = r.left + r.width / 2; sy = r.top + r.height / 2; setDir(e.clientX - sx, e.clientY - sy); stick.setPointerCapture(sid); e.preventDefault(); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === sid) setDir(e.clientX - sx, e.clientY - sy); });
  const end = e => { if (e.pointerId === sid) { sid = null; setDir(0, 0); } };
  stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);
  document.querySelectorAll('[data-k]').forEach(b => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { ensureAudio(); if (!keys[k]) pressed[k] = true; keys[k] = true; if (k === 'fire' || k === 'jump') pressed.start = true; b.classList.add('on'); e.preventDefault(); });
    const up = () => { keys[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
  });
  cv.addEventListener('pointerdown', () => { ensureAudio(); pressed.start = true; });
})();

})();
</script>
