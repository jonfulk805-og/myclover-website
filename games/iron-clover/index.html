<meta name="description" content="IRON CLOVER: a Contra-style run-and-gun browser game with 26 weapons, 4 stages and 4 bosses. Free, no install.">
<style>
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}

.btn{position:absolute;width:74px;height:74px;border-radius:50%;pointer-events:auto;touch-action:none;font:800 12px system-ui,sans-serif;letter-spacing:.5px;color:#fff;text-shadow:0 1px 2px #000;display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.35);background:radial-gradient(circle at 50% 35%,rgba(90,98,116,.45),rgba(12,14,20,.55));box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 2px 10px rgba(0,0,0,.5)}
.btn.on{background:radial-gradient(circle at 50% 35%,rgba(255,230,150,.6),rgba(160,110,20,.5))}

<script>
(function(){
'use strict';
// ===== IRON CLOVER - a run-and-gun tribute to Contra (Konami, 1987) =====
// Original code + procedurally drawn art by Viktor for MyClover.Tech. No external assets.
const W = 640, H = 360;
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const TOUCH = (navigator.maxTouchPoints > 0) && /Mobi|Android|iPhone|iPad|Tablet/i.test(navigator.userAgent);
let SC = 1; // backing-store scale: the 640x360 playfield is rendered at device resolution

// ---------- utils ----------

// gamepad

  thump: () => tone(140, 0.12, 'square', 0.08, -60),

  saw: () => tone(1200, 0.1, 'sawtooth', 0.04, 300),
  ice: () => tone(2400, 0.08, 'triangle', 0.05, -800),
  boom: () => { noise(0.45, 0.35, 900, -800); tone(90, 0.35, 'square', 0.12, -60); },
  bigboom: () => { noise(1.2, 0.5, 600, -560); tone(60, 1.0, 'sawtooth', 0.15, -40); },
  hit: () => tone(240, 0.03, 'square', 0.03, -100),
  ehit: () => tone(400, 0.03, 'triangle', 0.03, -100),
  eshot: () => tone(420, 0.06, 'triangle', 0.035, -200),
  jump: () => tone(300, 0.1, 'square', 0.03, 300),
  pick: () => { tone(660, 0.08, 'square', 0.06); setTimeout(() => tone(990, 0.12, 'square', 0.06), 70); },
  power: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'square', 0.06), i * 70)); },
  die: () => { tone(500, 0.6, 'square', 0.1, -440); noise(0.4, 0.2, 1200, -1000); },
  select: () => tone(1200, 0.04, 'square', 0.04),
  empty: () => tone(200, 0.06, 'square', 0.04),

function sfx(n) {

// tiny chiptune sequencer (bass + arp per stage)
const SONGS = [
  { tempo: 0.13, bass: [0,0,12,0,10,0,7,0, 0,0,12,0,15,12,10,7], arp: [12,15,19,15], root: 45 },
  { tempo: 0.12, bass: [0,0,0,12,3,3,3,15,5,5,5,17,3,3,7,10], arp: [12,15,17,22], root: 43 },
  { tempo: 0.115, bass: [0,1,0,12,0,1,0,13,5,6,5,17,3,4,3,15], arp: [12,13,19,13], root: 40 },
  { tempo: 0.16, bass: [0,7,12,7,5,12,17,12,3,10,15,10,7,14,19,14], arp: [24,19,24,27], root: 48 }
];
let songIdx = -1, nextNote = 0, noteStep = 0, musicOn = true;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function music() {
  if (!AC || muted || !musicOn || songIdx < 0) return;
  const s = SONGS[songIdx];
  if (nextNote < AC.currentTime) nextNote = AC.currentTime + 0.05;
  while (nextNote < AC.currentTime + 0.2) {
    const b = s.bass[noteStep % s.bass.length];
    tone(mtof(s.root + b), s.tempo * 0.9, 'triangle', 0.22, 0, musicGain, nextNote);
    if (noteStep % 2 === 0) {
      const a = s.arp[(noteStep / 2) % s.arp.length];
      tone(mtof(s.root + 12 + a), s.tempo * 0.5, 'square', 0.035, 0, musicGain, nextNote);
    }
    if (noteStep % 4 === 0) {
      const t = nextNote, sN = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
      sN.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = noteStep % 8 === 0 ? 200 : 5000;
      g.gain.setValueAtTime(noteStep % 8 === 0 ? 0.12 : 0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      sN.connect(f); f.connect(g); g.connect(musicGain); sN.start(t); sN.stop(t + 0.08);
    }

function playSong(i) { songIdx = i; noteStep = 0; if (AC) nextNote = AC.currentTime + 0.1; }

// ---------- GFX v2: procedural sprites, painted parallax, lighting ----------
// Technique borrowed from Hill Turret v5: fBm value noise, pre-rendered layers, additive glow sprites.
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const LW = 1280; // parallax tile period (px)
const BGS = () => Math.min(TOUCH ? 1.25 : 1.5, SC);
const GS = () => Math.min(2, SC);
function layer(w, h, s) {

  c.width = Math.max(1, Math.ceil(w * s)); c.height = Math.max(1, Math.ceil(h * s));
  const g = c.getContext('2d'); g.scale(s, s);

let seed = 1337;
const srand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// colour helpers
const RGBC = {};

function bright(c) { if (LUM[c] != null) return LUM[c]; const [r, g, b] = hexRgb(c); return (LUM[c] = Math.max(r, g, b) > 170 && (0.3 * r + 0.59 * g + 0.11 * b) > 110); }

// sprites

const SMOKE = [0, 1, 2].map(() => smokeSprite('70,64,62', 0.34));
const FIRE = (() => {

const NOISE = (() => { // tileable grain for overlay texturing

const VIGNETTE = (() => {

  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(0.7, 'rgba(4,3,10,0.26)'); vg.addColorStop(1, 'rgba(2,1,6,0.72)');

  return { x: 60, y: 120, w: 14, h: 30, vx: 0, vy: 0, face: 1, lives, arsenal: [{ w: 0, ammo: Infinity }], cur: 0, cd: 0,
    inv: 120, barrier: 0, rapid: 0, dead: false, deadT: 0, prone: false, t: 0, spin: 0, ax: 1, ay: 0, drop: 0, anim: 0, onGround: false, firing: 0 };
}
function curWeapon() { return WEAPONS[P.arsenal[P.cur].w]; }

function killPlayer() {
  if (!P || P.dead || P.inv > 0 || P.barrier > 0 || game.state !== 'play') return;
  P.dead = true; P.deadT = 100; P.lives--; P.vy = -6; P.vx = -P.face * 1.6;
  if (P.prone) { P.prone = false; P.y -= 16; P.h = 30; }
  sfx('die'); burst(P.x + 7, P.y + 15, 25, ['#d8322e', '#ffd23f', '#fff'], 3, 2, 30); shake(6);
  if (P.cur > 0 && !konamiOn) {
    const lost = curWeapon();
    P.arsenal.splice(P.cur, 1); P.cur = Math.max(0, P.cur - 1);
    flashMsg('LOST ' + lost.name);
  }
}

function updatePlayer() {
  P.t++;
  if (P.dead) {
    P.deadT--;
    P.x += P.vx; P.vy += GRAV; P.y += P.vy;
    const g = groundAt(P.x + 7, P.y);
    if (P.y + P.h > g && P.vy > 0) { P.y = g - P.h; P.vy = 0; P.vx = 0; }
    if (P.deadT <= 0) {
      if (P.lives < 0) { game.state = 'gameover'; game.stateT = 0; return; }
      P.dead = false; P.inv = 150; respawnPos(); P.vx = 0; P.vy = 0;
    }
    return;
  }
  const L = keys.left, Rt = keys.right, U = keys.up, D = keys.down, lock = keys.lock;
  const hx = (Rt ? 1 : 0) - (L ? 1 : 0);
  if (hx) P.face = hx;
  const wantProne = P.onGround && D && !hx && !lock;
  if (wantProne && !P.prone) { P.prone = true; P.y += 16; P.h = 14; }
  else if (!wantProne && P.prone) { P.prone = false; P.y -= 16; P.h = 30; }
  const mv = (P.prone || (lock && P.onGround)) ? 0 : hx;
  P.vx = mv * 2.25;
  if (pressed.jump && P.onGround) {
    if (D && P.ground && world.plats.includes(P.ground)) { P.drop = 14; if (P.prone) { P.prone = false; P.y -= 16; P.h = 30; } }
    else { if (P.prone) { P.prone = false; P.y -= 16; P.h = 30; } P.vy = -8.6; sfx('jump'); }
  }
  if (P.drop > 0) P.drop--;
  moveBody(P, P.drop > 0);
  if (mv && P.onGround) P.anim += 0.28;
  // camera bounds
  if (P.x < world.camX) P.x = world.camX;
  if (P.x + P.w > world.camX + W) P.x = world.camX + W - P.w;
  if (P.y > H + 30) { P.inv = 0; P.barrier = 0; killPlayer(); return; }
  // aim
  let ax = P.face, ay = 0;
  if (U) { if (hx || lock && hx) { ax = P.face; ay = -1; } else { ax = 0; ay = -1; } }
  else if (D) {
    if (!P.onGround) { if (hx) { ay = 1; } else { ax = 0; ay = 1; } }
    else if (hx || lock) { ay = 1; if (!hx) ax = P.face; }
  }
  const l = Math.hypot(ax, ay) || 1; P.ax = ax / l; P.ay = ay / l;

  const n = P.arsenal.length;
  if (pressed.next) { P.cur = (P.cur + 1) % n; sfx('select'); }
  if (pressed.prev) { P.cur = (P.cur - 1 + n) % n; sfx('select'); }
  for (let i = 1; i <= 9; i++) if (pressed['slot' + i] && P.arsenal[i - 1]) { P.cur = i - 1; sfx('select'); }
  if (pressed.slot0 && P.arsenal[9]) { P.cur = 9; sfx('select'); }
  // fire
  if (P.cd > 0) P.cd--;
  if (P.firing > 0) P.firing--;
  const wp = curWeapon();
  if (keys.fire && P.cd <= 0) {
    const m = muzzle();
    const a = Math.atan2(P.ay, P.ax);
    wp.fire(m, a);
    sfx(wp.sfx);
    P.firing = 8;
    for (let i = 0; i < 2; i++) part(m.x, m.y, P.ax * R(1, 2) + R(-0.5, 0.5), P.ay * R(1, 2) + R(-0.5, 0.5), 6, '#fff3a0', 1.5, 0);
    if (Math.random() < 0.6) part(P.x + 7, P.y + (P.prone ? 6 : 10), -P.face * R(0.8, 1.6), R(-2.6, -1.4), 50, '#d9b25a', 1.5, 0.22, 3);
    addFx({ type: 'light', x: m.x, y: m.y, r: 28, life: 4, color: '#ffd27a', i: 0.5 });
    const slot = P.arsenal[P.cur];
    if (!konamiOn || slot.ammo !== Infinity) { if (!konamiOn) slot.ammo--; }
    let cd = wp.cdf ? wp.cdf() : wp.cd;
    if (P.rapid > 0) cd *= 0.6;
    P.cd = Math.max(1, Math.round(cd));
    if (slot.ammo <= 0) { P.arsenal.splice(P.cur, 1); P.cur = 0; flashMsg(wp.name + ' EMPTY'); sfx('empty'); }
  }
  if (!keys.fire) P.spin = Math.max(0, P.spin - 1);
  if (P.inv > 0) P.inv--;
  if (P.barrier > 0) P.barrier--;
  if (P.rapid > 0) P.rapid--;
  // pickups
  for (const k of world.pickups) if (!k.dead && overlap(P, k)) { k.dead = true; collectPickup(k); }
  // body contact
  const hb = hitbox();
  for (const e of world.enemies) if (!e.dead && e.touch && overlap(hb, e)) { killPlayer(); break; }
}
function respawnPos() {
  let x = world.camX + 50;
  for (let k = 0; k < 40; k++) { const tx = world.camX + 40 + k * 12; if (groundAt(tx + 7) < H && groundAt(tx) < H && groundAt(tx + 14) < H) { x = tx; break; } }
  P.x = x; P.y = -10;
}

  const cxp = P.x + P.w / 2, sy = P.prone ? P.y + 6 : P.y + 10;
  if (!P.onGround && !P.prone) return { x: cxp + P.ax * 12, y: P.y + 14 + P.ay * 12 };
  return { x: cxp + P.ax * 17, y: sy + P.ay * 16 };

// ----- shaded commando rig (origin = feet centre, facing +x) -----

function drawCommando(x, y, face, o) {

function drawPlayer() {
  if (P.dead) {
    cx.save(); cx.translate(P.x + 7, P.y + 15); cx.rotate(P.deadT > 60 ? (100 - P.deadT) * 0.2 * -P.face : Math.PI / 2 * -P.face);

  }
  if (P.inv > 0 && Math.floor(P.inv / 3) % 2) return;
  const wp = curWeapon();
  const opt = { ax: P.ax, ay: P.ay, run: P.onGround && Math.abs(P.vx) > 0, anim: P.anim, gun: wp.color, flash: P.firing > 6, pants: '#3a6e3e', band: '#e0302a' };

  if (P.prone) opt.prone = true;
  drawCommando(P.x, P.y, P.face, opt);
  if (P.barrier > 0 && (P.barrier > 120 || Math.floor(P.barrier / 4) % 2)) {
    const bc = ['#ff3b3b', '#3eff6c', '#ff9a1f', '#ffd23f'][Math.floor(game.t / 4) % 4];
    glowAt(P.x + 7, P.y + P.h / 2, 30, bc, 0.35);

}

// ---------- enemies ----------
const diff = () => 1 + game.loop * 0.6 + game.stage * 0.12;

const PAL = [
  { pants: '#7a6a48', band: '#3a3a3a', gun: '#555' },
  { pants: '#4a5a7a', band: '#c8c8c8', gun: '#666' },

  { pants: '#7a3a3a', band: '#ffd23f', gun: '#555' }

const ET = {

function bossDown(e) {
  world.clearT = 200; world.bossDead = true;
  for (const o of world.enemies) if (o !== e && !o.dead) { o.dead = true; explode(o.x + o.w / 2, o.y + o.h / 2, 24, 0, {}); }
  world.eb.length = 0;
  explode(e.x + e.w / 2, e.y + e.h / 2, 90, 0, {});
  world.bossExplode = { x: e.x, y: e.y, w: e.w, h: e.h };
}

function updateEnemies() {
  for (const e of world.enemies) {
    if (e.dead) continue;
    if (e.flash > 0) e.flash--;
    if (e.frozen > 0) { e.frozen--; if (game.t % 3) continue; }
    e.t++;
    ET[e.type].update(e);
    if (!e.boss && !e.static && e.x + e.w < world.camX - 80) e.dead = true;
    if (e.y > H + 60) { e.dead = true; }
  }
  world.enemies = world.enemies.filter(e => !e.dead);
  // enemy bullets
  const hb = P && !P.dead ? hitbox() : null;
  for (const b of world.eb) {
    b.t++;
    if (b.homing && b.t > 40 && b.t < 160 && P) { const a = aimAt(b.x, b.y), s = Math.hypot(b.vx, b.vy); b.vx += Math.cos(a) * 0.12; b.vy += Math.sin(a) * 0.12; const ns = Math.hypot(b.vx, b.vy); if (ns > 3) { b.vx *= 3 / ns; b.vy *= 3 / ns; } }
    else b.vy += b.g;
    b.x += b.vx; b.y += b.vy;
    if (b.t > b.life || b.x < world.camX - 30 || b.x > world.camX + W + 30 || b.y > H + 20 || b.y < -60) b.dead = true;
    else if (b.t > 2 && pointSolid(b.x, b.y)) { b.dead = true; burst(b.x, b.y, 3, ['#ffb000', '#fff'], 1.5, 1.5, 10); }
    if (hb && !b.dead) {
      if (P.barrier > 0 && dist2(b.x, b.y, P.x + 7, P.y + P.h / 2) < 24 * 24) b.dead = true;
      else if (circRect(b.x, b.y, b.r - 1, hb)) { b.dead = true; killPlayer(); }
    }
  }
  world.eb = world.eb.filter(b => !b.dead);
}

function buildStage(si) {
  world = { solids: [], plats: [], bridges: [], spawns: [], deco: [], enemies: [], pb: [], eb: [], parts: [], pickups: [], fx: [],
    camX: 0, shake: 0, runnerT: 150, theme: THEMES[si], clearT: 0, bossDead: false, arena: false, arenaX: 0, len: 0, introT: 180 };
  let x = 0, gy = 300;
  const ground = (x0, w, y) => world.solids.push({ x: x0, y, w, h: H + 80 - y });
  const sp = (type, sx, sy, o) => world.spawns.push({ type, x: sx, y: sy, o: o || {} });
  const deco = (dx, dy, kind) => world.deco.push({ x: dx, y: dy, k: kind || RI(0, 2) });
  const tpl = {
    flat() { const w = RI(220, 360); ground(x, w, gy); if (Math.random() < 0.7) sp('soldier', x + w * 0.6, gy - 28); if (Math.random() < 0.18) sp('sensor', x + w * 0.35, gy - 22); deco(x + R(20, w - 20), gy); return w; },
    pit() { const g = RI(54, 76); ground(x + g, 160, gy); deco(x + g + 80, gy); return g + 160; },
    pitPlat() { const g = RI(150, 185); world.plats.push({ x: x + g / 2 - 30, y: gy - 40, w: 60, h: 6 }); ground(x + g, 160, gy); if (Math.random() < 0.5) sp('flyer', x, R(70, 140), { edge: 1 }); return g + 160; },
    stepUp() { if (gy <= 220) return tpl.flat(); gy -= 40; const w = RI(200, 300); ground(x, w, gy); sp('soldier', x + w - 40, gy - 28); return w; },
    stepDown() { if (gy >= 300) return tpl.flat(); gy += 40; const w = RI(200, 300); ground(x, w, gy); return w; },
    plats() { const w = 380; ground(x, w, gy); world.plats.push({ x: x + 50, y: gy - 66, w: 110, h: 6 }, { x: x + 200, y: gy - 124, w: 120, h: 6 }); sp('soldier', x + 260, gy - 124 - 28, { sniper: true, rate: 80, spd: 3.3 }); if (Math.random() < 0.5) sp('soldier', x + 100, gy - 66 - 28); return w; },
    turret() { const w = 320; ground(x, w, gy); world.solids.push({ x: x + 150, y: gy - 36, w: 40, h: 36 }); sp('turret', x + 158, gy - 56); if (Math.random() < 0.4) sp('soldier', x + 270, gy - 28); return w; },
    bridge() { if (si !== 0 && si !== 3) return tpl.pit(); const n = 8, pw = 28; ground(x, 40, gy); for (let i = 0; i < n; i++) { const b = { x: x + 40 + i * pw, y: gy, w: pw, h: 10, bridge: true }; world.solids.push(b); world.bridges.push(b); } ground(x + 40 + n * pw, 160, gy); return 40 + n * pw + 160; },
    heavy() { const w = 420; ground(x, w, gy); sp('heavy', x + 320, gy - 36); return w; },
    capsule() { const w = 260; ground(x, w, gy); sp('capsule', x, R(60, 120), { edge: -1 }); deco(x + 100, gy); return w; },
    flyers() { const w = 300; ground(x, w, gy); for (let i = 0; i < 3; i++) sp('flyer', x + i * 40, R(60, 150), { edge: 1 }); return w; },
    jets() { const w = 320; ground(x, w, gy); sp('jet', x, -30, { edge: 1 }); sp('jet', x + 100, -30, { edge: 1 }); return w; },
    tower() { const w = 360; ground(x, w, gy); world.plats.push({ x: x + 60, y: gy - 44, w: 56, h: 6 }); world.solids.push({ x: x + 140, y: gy - 84, w: 90, h: 84 }); sp('soldier', x + 180, gy - 84 - 28, { rate: 90 }); sp('turret', x + 280, gy - 20); return w; },
    pods() { const w = 380; ground(x, w, gy); sp('pod', x + 140, gy - 26); sp('pod', x + 290, gy - 26); return w; },
    bugs() { const w = 300; ground(x, w, gy); for (let i = 0; i < 4; i++) sp('bug', x + 150 + i * 30, gy - 10); return w; }
  };
  const W8 = [
    { flat: 4, pit: 3, pitPlat: 2, stepUp: 2, stepDown: 2, plats: 2, turret: 2, bridge: 2, heavy: 1, capsule: 1.5, flyers: 1 },
    { flat: 4, pit: 2, pitPlat: 2, stepUp: 2, stepDown: 2, plats: 2, turret: 3, tower: 2, heavy: 1.2, capsule: 1.5, flyers: 1.5, jets: 2 },
    { flat: 3, pit: 2, pitPlat: 2, stepUp: 2, stepDown: 2, plats: 2, pods: 3, bugs: 3, heavy: 1, capsule: 1.5, flyers: 1 },
    { flat: 3, pit: 3, pitPlat: 2, stepUp: 2, stepDown: 2, plats: 2, turret: 3, tower: 2, bridge: 1.5, heavy: 1.5, capsule: 1.5, jets: 2, flyers: 1.5, bugs: 1 }
  ][si];
  const choose = () => { let tot = 0; for (const k in W8) tot += W8[k]; let r = Math.random() * tot; for (const k in W8) { r -= W8[k]; if (r <= 0) return k; } return 'flat'; };
  ground(0, 560, gy); deco(200, gy); deco(420, gy); x = 560;
  sp('capsule', 0, 90, { edge: -1, at: 300 });
  const L = 6800 + si * 700;
  let last = '', capN = 0;
  while (x < L) {
    let t = choose();
    if ((t === 'pit' || t === 'pitPlat' || t === 'bridge') && (last === 'pit' || last === 'pitPlat' || last === 'bridge')) t = 'flat';
    if (x - capN > 1500) { t = 'capsule'; capN = x; }
    if (t === 'capsule') capN = x;
    x += tpl[t](); last = t;
  }
  // approach + boss arena
  gy = 300; ground(x, 300, gy); sp('heavy', x + 200, gy - 36); x += 300;
  world.arenaX = x; ground(x, W + 40, gy); world.len = x + W;
  world.spawns.sort((a, b) => a.x - b.x);
  return world;
}

function startBoss() {
  world.arena = true; world.camX = world.arenaX;
  const ax = world.arenaX, si = game.stage;
  if (si === 0) {
    const wx = ax + W - 80;
    world.solids.push({ x: wx, y: 30, w: 120, h: 270, wall: true });
    world.bossE = spawnEnemy('gatecore', wx - 34, 260);
    spawnEnemy('gatecannon', wx - 28, 130, { k: 0 }); spawnEnemy('gatecannon', wx - 28, 190, { k: 1 });
  } else if (si === 1) world.bossE = spawnEnemy('walker', ax + W - 130, -90);
  else if (si === 2) world.bossE = spawnEnemy('hive', ax + W - 110, 100);
  else world.bossE = spawnEnemy('overlord', ax + W - 150, 120, { baseY: 110 });
  flashMsg('WARNING: ' + ['IRON GATE', 'WARHOUND', 'HIVE HEART', 'IRON OVERLORD'][si]);
  sfx('power');
}

function updateLevel() {
  const target = P.x - W * 0.42;
  if (!world.arena) {
    world.camX = Math.max(world.camX, Math.min(target, world.arenaX));
    if (world.camX >= world.arenaX - 0.5) startBoss();
  }
  // spawns
  while (world.spawns.length && world.spawns[0].x < world.camX + W + 30) {
    const s = world.spawns.shift();
    let sx = s.x;
    if (s.o.edge === 1) sx = world.camX + W + 10; else if (s.o.edge === -1) sx = world.camX - 20;
    const o = Object.assign({}, s.o); delete o.edge; delete o.at;
    spawnEnemy(s.type, sx, s.y, o);
  }
  // runners
  if (!world.arena && --world.runnerT <= 0) {
    world.runnerT = Math.floor(RI(70, 140) / Math.min(2, diff()));
    const left = Math.random() < 0.18;
    const rx = left ? world.camX - 14 : world.camX + W + 4;
    const g = groundAt(rx + 6);
    if (g < H) {
      if (game.stage === 2 && Math.random() < 0.5) spawnEnemy('bug', rx, g - 10);
      else { const n = Math.random() < 0.3 ? 2 : 1; for (let i = 0; i < n; i++) spawnEnemy('runner', rx + (left ? -i * 18 : i * 18), g - 28); }
    }
  }
  // collapsing bridges
  for (const b of world.bridges) {
    if (b.gone) continue;
    if (!b.armed && P.x + P.w > b.x - 24) { b.armed = 26; }
    if (b.armed && --b.armed <= 0) { b.gone = true; explode(b.x + b.w / 2, b.y + 4, 20, 0, {}); }
  }
  // boss clear sequence
  if (world.clearT > 0) {
    world.clearT--;
    const be = world.bossExplode;
    if (be && world.clearT % 7 === 0) explode(be.x + R(0, be.w), be.y + R(0, be.h), R(18, 40), 0, {});
    if (world.clearT === 0) { game.state = 'clear'; game.stateT = 0; game.score += 10000 * (game.stage + 1); }
  }
}

      for (const k of world.pickups) { k.t++; if (!k.onGround) moveBody(k); else k.vx = 0; if (k.t > 900 || k.y > H + 20) k.dead = true; }
      world.pickups = world.pickups.filter(k => !k.dead);
      for (const p of world.parts) { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--; if (p.type >= 2 && p.vy > 0 && pointSolid(p.x, p.y)) { p.y -= p.vy; p.vy *= -0.35; p.vx *= 0.6; } }

  if (b.upd) b.upd(b); else { b.x += b.vx; b.y += b.vy; if (b.grav) b.vy += b.grav; }
  if (b.dead) return;
  if (!b.ghost && pointSolid(b.x, b.y)) { if (b.onWall) b.onWall(b); else { b.dead = true; burst(b.x, b.y, 3, [b.color, '#fff'], 1.5, 1.5, 8); } }
  if (b.dead) return;
  if (b.t > b.life) { b.dead = true; if (b.onEnd) b.onEnd(b); return; }
  if (!b.keep && (b.x < world.camX - 60 || b.x > world.camX + W + 60 || b.y < -140 || b.y > H + 40)) { b.dead = true; return; }
  if (b.dmg > 0) {
    for (const e of world.enemies) {
      if (e.dead || e.nohit) continue;
      if (b.hits && b.hits.has(e)) continue;
      if (circRect(b.x, b.y, b.r, e)) {
        if (e.invul) { if (!b.ghost && b.pierce < 50) { b.dead = true; sfx('ehit'); burst(b.x, b.y, 3, ['#fff'], 1.5, 1.5, 8); } if (b.dead) return; continue; }
        hurt(e, b.dmg, b); if (b.onHit) b.onHit(b, e); if (b.hits) b.hits.add(e);
        if (--b.pierce <= 0) { b.dead = true; return; }

}
function render() {
  cx.setTransform(SC, 0, 0, SC, 0, 0); cx.imageSmoothingEnabled = true;
  if (game.state === 'title') { drawTitle(); return; }
  drawWorld(); drawHUD();
  if (game.state === 'pause') {
    drawOverlay('PAUSED', ['P / ENTER to resume   \u00b7   Q / E to swap weapon', 'Arsenal: ' + P.arsenal.map(a => WEAPONS[a.w].tag).join(' ')]);
  } else if (game.state === 'gameover') {
    drawOverlay('GAME OVER', game.continues > 0 ? ['CONTINUE? (' + game.continues + ' left)', 'ENTER / FIRE to continue   \u00b7   ESC for title'] : ['No continues left.', 'ENTER for title'], '#ffd23f');
  } else if (game.state === 'clear') {
    drawOverlay('STAGE CLEAR', ['BONUS ' + (10000 * (game.stage + 1)), 'ARSENAL ' + (P.arsenal.length - 1) + '/' + (WEAPONS.length - 1)], '#8df59f');
  } else if (game.state === 'victory') {
    cx.fillStyle = 'rgba(0,0,0,0.6)'; cx.fillRect(0, 0, W, H);
    glowAt(320, 70, 90, '#ffd23f', 0.35);
    drawClover(320, 70, 40, game.t * 0.02);
    metalText('MISSION COMPLETE', 320, 120, 40);
    ['The Iron Overlord is scrap. The clover flies again.', 'SCORE ' + game.score, 'ENTER to start LOOP ' + (game.loop + 2) + ' (harder, keep your arsenal)'].forEach((s, i) => txt(s, 320, 176 + i * 19, 12, i === 1 ? '#ffe08a' : '#fff', 'center', true, 700));
  }
}
let acc = 0, lastT = performance.now();
function frame(now) {
  acc += Math.min(100, now - lastT); lastT = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 4) { step(); for (const k in pressed) pressed[k] = false; acc -= 1000 / 60; n++; }
  if (n === 4) acc = 0;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__IC = { game, step, keys, pressed, get world() { return world; }, get P() { return P; }, WEAPONS, giveWeapon, startBoss, nextStage, buildStage };

// ---------- touch controls ----------
(function () {
  const root = document.getElementById('touch');
  if (!TOUCH) { root.style.display = 'none'; return; }
  root.style.display = 'block';
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let sid = null, sx = 0, sy = 0;
  const setDir = (dx, dy) => {
    const d = Math.hypot(dx, dy), th = 18;
    keys.left = dx < -th; keys.right = dx > th;
    const up = dy < -th && Math.abs(dy) > Math.abs(dx) * 0.45, down = dy > th && Math.abs(dy) > Math.abs(dx) * 0.45;
    if (up && !keys.up) pressed.up = true; if (down && !keys.down) pressed.down = true;
    keys.up = up; keys.down = down;
    const k = Math.min(1, 40 / (d || 1)); knob.style.transform = 'translate(' + dx * k + 'px,' + dy * k + 'px)';
  };
  stick.addEventListener('pointerdown', e => { ensureAudio(); sid = e.pointerId; const r = stick.getBoundingClientRect(); sx = r.left + r.width / 2; sy = r.top + r.height / 2; setDir(e.clientX - sx, e.clientY - sy); stick.setPointerCapture(sid); e.preventDefault(); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === sid) setDir(e.clientX - sx, e.clientY - sy); });
  const end = e => { if (e.pointerId === sid) { sid = null; setDir(0, 0); } };
  stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);
  document.querySelectorAll('[data-k]').forEach(b => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { ensureAudio(); if (!keys[k]) pressed[k] = true; keys[k] = true; if (k === 'fire' || k === 'jump') pressed.start = true; b.classList.add('on'); e.preventDefault(); });
    const up = () => { keys[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
  });
  cv.addEventListener('pointerdown', () => { ensureAudio(); pressed.start = true; });
})();

})();
</script>
